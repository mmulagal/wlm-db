name: UI Bug Report
description: Report a bug related to the user interface.
title: "[BUG][UI]: "
labels: ["Bug", "UI"]
type: "Bug"
assignees:
  - shaswatinetapp
projects: ["TLVeng/41"]

body:
  - type: markdown
    attributes:
      value: |
        ## 🐞 UI Bug Report

        Thank you for helping us improve the user experience! Please provide as much detail as possible.

  - type: input
    id: parent-issue
    attributes:
      label: "Parent Issue"
      description: "Link to the parent issue (e.g., #1234 or full URL). Leave blank if none."
      placeholder: "#1234"
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: "Bug Summary"
      description: "Briefly describe the UI bug."
      placeholder: "Describe the bug and what you expected to happen. Provide proper steps to reproduce the issue."
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "Severity/Impact"
      description: "How severe is this issue?"
      options:
        - "Critical (blocks all work)"
        - "Major (significant impact)"
        - "Minor (minor inconvenience)"
        - "Trivial (cosmetic or low impact)"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "List the steps to reproduce the issue."
      placeholder: |
        1. Go to the login page
        2. Enter valid credentials
        3. Click the 'Login' button
        4. Observe the error message
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: "Environment"
      description: "Which environment did you encounter the bug in?"
      options:
        - "staging"
        - "prod"
        - "staging-demo"
        - "prod-demo"
    validations:
      required: false

  - type: textarea
    id: attachments
    attributes:
      label: "Attachments"
      description: "Attach any relevant files (logs, HAR files, etc.)."
      placeholder: "Drag and drop files here."