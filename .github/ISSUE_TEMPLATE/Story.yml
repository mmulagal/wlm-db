name: Story
description: Create a new user story.
title: "[STORY]: "
labels: ["Story"]
type: "User Story"
assignees:
  - shaswatinetapp
projects: ["TLVeng/41"]

body:
  - type: markdown
    attributes:
      value: |
        ## 📖 User Story

        Please provide details for this user story.

  - type: input
    id: parent-issue
    attributes:
      label: "Parent Issue"
      description: "Link to the parent issue (e.g., #1234 or full URL). Leave blank if none."
      placeholder: "#1234"
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: "Story Summary"
      description: "Briefly describe the user story."
      placeholder: "As a [user], I want to [do something] so that [benefit]."
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance Criteria"
      description: "What are the requirements for this story to be considered complete?"
      placeholder: |
        - [ ] User can...
        - [ ] System responds with...
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      description: "How important is this story?"
      options:
        - "High"
        - "Medium"
        - "Low"
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies"
      description: "List any dependencies or blockers for this story."
      placeholder: "e.g., Waiting for backend API"
    validations:
      required: false
