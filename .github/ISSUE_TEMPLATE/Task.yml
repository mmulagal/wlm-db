name: Task
description: Create a new task for implementation or tracking.
title: "[TASK]: "
labels: ["Task"]
assignees:
  - shaswatinetapp
projects: ["TLVeng/41"]

body:
  - type: markdown
    attributes:
      value: |
        ## 📝 Task

        Please provide details for this task.

  - type: textarea
    id: summary
    attributes:
      label: "Task Summary"
      description: "Briefly describe the task to be completed."
      placeholder: "Describe the task here."
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      description: "How important is this task?"
      options:
        - "High"
        - "Medium"
        - "Low"
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies"
      description: "List any dependencies or blockers for this task."
      placeholder: "e.g., Waiting for API update"
    validations:
      required: false
