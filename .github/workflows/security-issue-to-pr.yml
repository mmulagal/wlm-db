name: Security Issue to PR

on:
  issues:
    types: [opened, labeled, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process (for manual/testing runs on a non-default branch)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: security-issue-${{ github.event.issue.number || inputs.issue_number }}
  # Never cancel a mid-flight run: canceling after it pushes a branch but
  # before it opens the PR would leave an orphaned branch, and the next run
  # would fail to re-push it (non-fast-forward). Queue instead.
  cancel-in-progress: false

jobs:
  check-and-fix:
    runs-on: wlmdb-runner
    timeout-minutes: 20

    steps:
      - name: Resolve issue number
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_EVENT_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual input is free-form text - validate it's digits-only
            # before it's trusted anywhere else in this workflow.
            if ! [[ "$INPUT_ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "::error::issue_number input must contain only digits, got: $INPUT_ISSUE_NUMBER"
              exit 1
            fi
            echo "issue_number=$INPUT_ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "issue_number=$ISSUE_EVENT_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch and verify issue state and labels
        id: verify
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use gh's own vendored --jq (no dependency on a system jq binary).
          DATA=$(gh issue view "$ISSUE_NUMBER" --repo ${{ github.repository }} \
            --json state,labels,title \
            --jq '[.state, .title, ([.labels[].name] | any(ascii_downcase == "security") | tostring)] | @tsv')

          STATE=$(printf '%s' "$DATA" | cut -f1)
          TITLE=$(printf '%s' "$DATA" | cut -f2)
          HAS_SECURITY=$(printf '%s' "$DATA" | cut -f3)

          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "has_security=$HAS_SECURITY" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

          if [ "$STATE" != "OPEN" ] || [ "$HAS_SECURITY" != "true" ]; then
            echo "Issue #$ISSUE_NUMBER is not an open 'security' issue. Skipping."
          fi

      - name: Check for existing PR
        if: steps.verify.outputs.state == 'OPEN' && steps.verify.outputs.has_security == 'true'
        id: check-pr
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_COUNT=$(gh pr list --repo ${{ github.repository }} --search "Fixes #$ISSUE_NUMBER" --state open --json number --jq 'length')
          if [ "$PR_COUNT" -gt 0 ]; then
            echo "pr_exists=true" >> "$GITHUB_OUTPUT"
            echo "PR already exists for this issue. Skipping."
          else
            echo "pr_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe LLM proxy connectivity
        if: steps.check-pr.outputs.pr_exists == 'false'
        run: |
          HOST="llm-proxy-api.ai.eng.netapp.com"
          URL="https://$HOST"

          echo "Runner: $(hostname)"
          echo "Resolving $HOST..."
          getent hosts "$HOST" || nslookup "$HOST" || echo "::warning::DNS lookup for $HOST returned no result (informational - continuing to curl check)"

          echo "Checking HTTPS reachability to $URL..."
          if curl -sS --max-time 10 -o /dev/null -w "HTTP status: %{http_code}\n" "$URL"; then
            echo "LLM proxy is reachable from this runner ($(hostname))."
          else
            CURL_EXIT=$?
            echo "::error::Cannot reach $URL from runner $(hostname) (curl exit code $CURL_EXIT). The agent step will fail with a connection error. Check that this job is running on a runner with access to NetApp's internal network (e.g. wlmdb-runner)."
            exit 1
          fi

      - name: Checkout repository
        if: steps.check-pr.outputs.pr_exists == 'false'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.check-pr.outputs.pr_exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.check-pr.outputs.pr_exists == 'false'
        run: npm ci

      - name: Fetch issue body
        if: steps.check-pr.outputs.pr_exists == 'false'
        id: fetch-body
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          ISSUE_BODY_FILE: ${{ runner.temp }}/issue_body.txt
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Write to a plain file rather than $GITHUB_ENV/$GITHUB_OUTPUT:
          # those are heredoc-appended files shared by every later step in
          # the job, so putting untrusted issue content in them (even behind
          # a random delimiter) is flagged as an env-injection surface by
          # CodeQL. A file that only the next step explicitly reads has no
          # such blast radius.
          gh issue view "$ISSUE_NUMBER" --repo ${{ github.repository }} --json body --jq '.body' > "$ISSUE_BODY_FILE"
          echo "issue_body_file=$ISSUE_BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: Run security agent
        if: steps.check-pr.outputs.pr_exists == 'false'
        id: agent
        run: node .github/scripts/armor-fix-agent.js
        env:
          MM_LLM_PROXY_KEY: ${{ secrets.MM_LLM_PROXY_KEY }}
          MODEL_ID: ${{ vars.MODEL_ID || 'claude-sonnet-5-medium' }}
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.verify.outputs.title }}
          ISSUE_BODY_FILE: ${{ steps.fetch-body.outputs.issue_body_file }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate server lockfile
        # The agent may only write server/package.json (never
        # server/package-lock.json), so if it changed anything, the lockfile
        # is now out of sync and `npm ci` in server/ would reject it.
        # Deterministically resync it here rather than trusting the model
        # with a second writable file.
        if: steps.check-pr.outputs.pr_exists == 'false'
        run: |
          cd server
          npm install --package-lock-only

      - name: Check if files were modified
        if: steps.check-pr.outputs.pr_exists == 'false'
        id: check-changes
        run: |
          # Only these two files are ever eligible to be committed - this is
          # the enforcement point for the agent's stated write scope,
          # independent of anything the model's tool calls may have done.
          if git diff --quiet -- server/package.json server/package-lock.json; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
            git diff --stat -- server/package.json server/package-lock.json
          fi

      - name: Create and push branch
        if: steps.check-changes.outputs.has_changes == 'true'
        id: branch
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.verify.outputs.title }}
        run: |
          BRANCH="security-fix/issue-$ISSUE_NUMBER"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add server/package.json server/package-lock.json
          git commit -m "GH-$ISSUE_NUMBER: $ISSUE_TITLE"
          git push origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.check-changes.outputs.has_changes == 'true'
        id: pr
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.verify.outputs.title }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="security-fix/issue-$ISSUE_NUMBER"

          PR_URL=$(gh pr create \
            --title "GH-$ISSUE_NUMBER: $ISSUE_TITLE" \
            --body "Fixes #$ISSUE_NUMBER" \
            --base master \
            --head "$BRANCH" \
            --repo ${{ github.repository }})

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Comment on issue
        if: steps.check-changes.outputs.has_changes == 'true'
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo ${{ github.repository }} \
            --body "🤖 Automated fix PR opened: $PR_URL"

      - name: Comment if no changes
        if: steps.check-pr.outputs.pr_exists == 'false' && steps.check-changes.outputs.has_changes != 'true'
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo ${{ github.repository }} \
            --body "⚠️ Security agent ran but could not determine how to fix this issue. Manual review needed."
