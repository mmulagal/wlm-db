name: Find Owner For Error-Agent Issue

on:
    issues:
        types: [labeled]

jobs:
    find-owner:
        if: github.event.label.name == 'error-agent'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write

        steps:
            - uses: actions/checkout@v4
              with:
                  # Full commit graph is required so `git blame` can resolve authors
                  # beyond the HEAD commit. `filter: blob:none` keeps the clone cheap:
                  # blobs are fetched lazily only for the files blame actually walks.
                  fetch-depth: 0
                  filter: blob:none
                  sparse-checkout: |
                      server/src
                  sparse-checkout-cone-mode: true

            - name: Find owner from stack trace or error text and assign
              env:
                  # Repo REST / blame / issue assignees: default `github.token`, or set secret FIND_OWNER_REPO_TOKEN (PAT with issues:write, etc.) if the workflow token is insufficient.
                  GITHUB_TOKEN: ${{ secrets.FIND_OWNER_REPO_TOKEN || github.token }}
                  GH_TOKEN: ${{ secrets.FIND_OWNER_REPO_TOKEN || github.token }}
                  # GraphQL for org Project V2: use secret FIND_OWNER_ORG_PROJECT_TOKEN (PAT or PAT-like); else github.token (cannot see org projects).
                  GH_PROJECT_TOKEN: ${{ secrets.FIND_OWNER_ORG_PROJECT_TOKEN || github.token }}
                  # true when FIND_OWNER_ORG_PROJECT_TOKEN is set (for diagnostics only; never the secret value).
                  FIND_OWNER_ORG_PROJECT_SECRET_SET: ${{ secrets.FIND_OWNER_ORG_PROJECT_TOKEN != '' }}
                  ISSUE_NUMBER: ${{ github.event.issue.number }}
                  ISSUE_BODY: ${{ github.event.issue.body }}
                  REPO: ${{ github.repository }}
                  RUNTIME_PREFIX: '/opt/netapp/wlmdb/'
                  REPO_SRC_PREFIX: 'server/src/'
                  MAX_FRAMES: '30'
                  SKIP_ASSIGNEES: 'copilot-swe-agent'
                  FALLBACK_ASSIGNEE: 'mmulagal' # Murali Mulagalapati
                  PROJECT_V2_TITLE: 'WF Database'
                  # Optional: Project V2 number from the URL …/orgs/<org>/projects/<N> (e.g. 41). Repo/org variable FIND_OWNER_PROJECT_V2_NUMBER.
                  # Org-level projects still need secret FIND_OWNER_ORG_PROJECT_TOKEN — GITHUB_TOKEN cannot see them (GitHub limitation).
                  PROJECT_V2_NUMBER: ${{ vars.FIND_OWNER_PROJECT_V2_NUMBER }}
                  SPRINT_FIELD_NAME: 'Sprint'
              run: |
                  python3 - <<'PY'
                  import datetime as dt, json, os, re, subprocess, sys
                  from functools import lru_cache
                  from typing import Optional, Tuple


                  def _env_gh_repo() -> dict:
                      """Subprocess env for repo `gh api` / blame: `gh` authenticates via `GH_TOKEN` only.

                      Copy the workflow token from `GITHUB_TOKEN` or `GH_TOKEN` onto `GH_TOKEN`, and omit
                      `GH_PROJECT_TOKEN` so org project credentials are not present in that env (not used
                      by `gh` for auth; avoids passing the org PAT to these child processes unnecessarily).
                      """
                      env = dict(os.environ)
                      tok = (env.get("GITHUB_TOKEN") or env.get("GH_TOKEN") or "").strip()
                      if tok:
                          env["GH_TOKEN"] = tok
                      env.pop("GH_PROJECT_TOKEN", None)
                      return env


                  def _gh_err(proc: subprocess.CompletedProcess, label: str) -> None:
                      msg = ((proc.stderr or "") + (proc.stdout or "")).strip()
                      if msg:
                          print(f"find-owner: {label}: {msg[:2000]}", file=sys.stderr)


                  def normalize_path(runtime_path: str, runtime_prefix: str, repo_src_prefix: str) -> Optional[str]:
                      if runtime_path.startswith("file://"):
                          runtime_path = runtime_path[7:]
                      if runtime_path.startswith(runtime_prefix):
                          t = runtime_path[len(runtime_prefix) :]
                      elif runtime_path.startswith(repo_src_prefix):
                          t = runtime_path[len(repo_src_prefix) :]
                      else:
                          return None
                      t = t.lstrip("/")
                      if not t or re.match(r"^[A-Za-z]:[\\/]", t):
                          return None
                      if t.startswith(repo_src_prefix):
                          t = t[len(repo_src_prefix) :].lstrip("/")
                          if not t:
                              return None
                      if t.endswith(".js"):
                          t = t[:-3] + ".ts"
                      return f"{repo_src_prefix}{t}"


                  def to_login(name: str) -> str:
                      return re.sub(r"\s+", "-", name.strip().lower())


                  def login_from_git_mail(mail: str) -> str:
                      if not mail:
                          return ""
                      m = re.match(r"^(\d+)\+([^+@]+)@users\.noreply\.github\.com$", mail, re.I)
                      if m:
                          return m.group(2)
                      return ""


                  def author_login_from_commit_sha(repo_full: str, sha: str) -> str:
                      if not repo_full or len(sha) < 7:
                          return ""
                      try:
                          proc = subprocess.run(
                              [
                                  "gh",
                                  "api",
                                  f"repos/{repo_full}/commits/{sha}",
                                  "--jq",
                                  ".author.login",
                              ],
                              capture_output=True,
                              text=True,
                              check=False,
                              env=_env_gh_repo(),
                          )
                      except Exception:
                          return ""
                      if proc.returncode != 0:
                          return ""
                      login = (proc.stdout or "").strip().strip('"')
                      if not login or login == "null":
                          return ""
                      return login


                  def query_blame_git(
                      path: str, start_line: int, end_line: int, workspace: str, repo_full: str
                  ) -> Optional[Tuple[str, str, int]]:
                      if not workspace or not os.path.isdir(workspace):
                          return None
                      fp = os.path.join(workspace, path)
                      if not os.path.isfile(fp):
                          return None
                      try:
                          proc = subprocess.run(
                              [
                                  "git",
                                  "blame",
                                  "-L",
                                  f"{start_line},{end_line}",
                                  "-p",
                                  "--no-progress",
                                  "HEAD",
                                  "--",
                                  path,
                              ],
                              cwd=workspace,
                              capture_output=True,
                              text=True,
                              check=False,
                          )
                      except Exception:
                          return None
                      if proc.returncode != 0:
                          return None
                      lines = proc.stdout.splitlines()
                      best_time, best_name, best_login, best_sha = 0, "", "", ""
                      for i, line in enumerate(lines):
                          if not line.startswith("author-time "):
                              continue
                          try:
                              t = int(line.split()[1])
                          except (IndexError, ValueError):
                              continue
                          sha = ""
                          for k in range(i - 1, max(-1, i - 40), -1):
                              parts = lines[k].split()
                              if not parts:
                                  continue
                              h = parts[0].lower()
                              if len(h) == 40 and all(c in "0123456789abcdef" for c in h):
                                  sha = parts[0]
                                  break
                          j = i - 1
                          if j >= 0 and lines[j].startswith("author-tz "):
                              j -= 1
                          mail = ""
                          if j >= 0 and lines[j].startswith("author-mail "):
                              mail = lines[j][12:].strip().strip("<>")
                              j -= 1
                          else:
                              continue
                          name = ""
                          if j >= 0 and lines[j].startswith("author ") and not lines[j].startswith("author-mail"):
                              name = lines[j][7:].strip()
                          if not name:
                              continue
                          if t > best_time:
                              best_time = t
                              best_name = name
                              best_sha = sha
                              best_login = login_from_git_mail(mail) or to_login(name)
                      if not best_name:
                          return None
                      gh_login = author_login_from_commit_sha(repo_full, best_sha)
                      return (best_name, gh_login or best_login, best_time)


                  def query_blame(path: str, start_line: int, end_line: int, owner: str, repo: str) -> Optional[Tuple[str, str, int]]:
                      """Resolve (author_name, author_login, author_epoch) for a line range.

                      Uses local `git blame` against the checked-out working copy. The workflow's
                      `actions/checkout@v4` step fetches full history (`fetch-depth: 0`) with
                      `filter: blob:none`, so blame sees every commit and can return the real
                      author of each line (not just whoever last merged to HEAD).

                      Previously this function first tried GitHub's GraphQL `Blob.blame` field,
                      but that field is not part of the public GraphQL schema — the query always
                      errored with `Field 'blame' doesn't exist on type 'Blob'` and the code
                      silently fell through to the git path. With a shallow (`fetch-depth: 1`)
                      clone the git fallback then attributed every line to the single boundary
                      commit at HEAD, which is why every candidate file was being blamed on the
                      latest master merger.
                      """
                      ws = os.environ.get("GITHUB_WORKSPACE", ".")
                      return query_blame_git(path, start_line, end_line, ws, f"{owner}/{repo}")


                  def extract_where_to_look_literals(text: str) -> list[str]:
                      """Return backtick literals from the `### Where to Look` section bullets, in order.

                      These are the investigator-curated high-signal strings (e.g. `Failed to clean up`)
                      the error-agent puts in the issue body. This is the only literal source the
                      resolver trusts — a broad sweep over fenced log blocks was prone to picking up
                      generic log prose (timestamps, correlation ids, "Resetting cache", …) and
                      assigning the most-recent committer of any matching file.
                      """
                      if not text:
                          return []
                      lines = text.splitlines()
                      start = -1
                      for i, line in enumerate(lines):
                          if re.match(r"^\s*#{1,6}\s+where\s+to\s+look\b", line, re.I):
                              start = i + 1
                              break
                      if start < 0:
                          return []
                      out: list[str] = []
                      seen: set[str] = set()
                      for j in range(start, len(lines)):
                          raw = lines[j]
                          # Stop at the next markdown heading.
                          if re.match(r"^\s*#{1,6}\s+\S", raw):
                              break
                          ls = raw.lstrip()
                          if not (ls.startswith("- ") or ls.startswith("* ") or re.match(r"^\d+[.)]\s", ls)):
                              continue
                          m = re.search(r"`([^`\n]{12,180})`", raw)
                          if not m:
                              continue
                          s = m.group(1).strip().strip("`")
                          if not (12 <= len(s) <= 180):
                              continue
                          k = s.lower()
                          if k in seen:
                              continue
                          seen.add(k)
                          out.append(s)
                      return out


                  def git_grep_matches(needle: str, path_prefix: str, workspace: str, max_total: int) -> list[tuple[str, int]]:
                      if len(needle) < 12:
                          return []
                      try:
                          proc = subprocess.run(
                              ["git", "grep", "-n", "-I", "-F", needle, "HEAD", "--", path_prefix],
                              capture_output=True,
                              text=True,
                              check=False,
                              cwd=workspace,
                          )
                      except Exception:
                          return []
                      if proc.returncode != 0:
                          return []
                      hits: list[tuple[str, int]] = []
                      for line in proc.stdout.splitlines():
                          if line.startswith("HEAD:"):
                              line = line[5:]
                          a, _, rest = line.partition(":")
                          b, _, _ = rest.partition(":")
                          try:
                              hits.append((a, int(b)))
                          except ValueError:
                              continue
                          if len(hits) >= max_total:
                              break
                      return hits


                  def _iso_utc(epoch: int) -> str:
                      try:
                          return dt.datetime.fromtimestamp(int(epoch), tz=dt.timezone.utc).strftime(
                              "%Y-%m-%dT%H:%M:%SZ"
                          )
                      except Exception:
                          return "?"


                  def resolve_best_author(
                      body: str, repo_full: str, runtime_prefix: str, repo_src_prefix: str, max_frames: int
                  ) -> tuple[str, str, int, str, str]:
                      """Return (author_name, author_login, author_time_epoch, source_desc, reason).

                      `reason` is one of: "stack", "where-to-look", or "" when nothing was resolved.
                      Only two resolution paths are trusted:

                      1. Stack frames in the issue body (normalized back to `server/src/…`).
                      2. Backtick literals under a `### Where to Look` heading.

                      If neither yields a blame author we return empty and the caller routes to
                      `FALLBACK_ASSIGNEE`. The old "broad sweep" over every backtick / fenced-log line
                      was removed because it regularly picked the most-recent unrelated committer to
                      `server/src/` on issues with no high-signal input.

                      Emits `find-owner:`-prefixed stderr traces for every decision so the workflow log
                      explains why a particular author was chosen.
                      """
                      owner, repo = repo_full.split("/", 1)
                      # Greedy path so file:///opt/.../foo.js:line:col works (not just first ":").
                      sp = re.compile(r"^\s*at\s+.*\((.+):(\d+):(\d+)\)\s*$")
                      frames = [(m.group(1), int(m.group(2))) for line in body.splitlines() if (m := sp.match(line))]
                      filtered: list[tuple[str, int]] = []
                      seen: set[tuple[str, int]] = set()
                      for rf, rl in frames:
                          if not rf or rl <= 0:
                              continue
                          pth = normalize_path(rf, runtime_prefix, repo_src_prefix)
                          if not pth:
                              continue
                          k = (pth, rl)
                          if k in seen:
                              continue
                          seen.add(k)
                          filtered.append(k)
                          if len(filtered) >= max_frames:
                              break

                      wtl_lits = extract_where_to_look_literals(body)
                      inum = os.environ.get("ISSUE_NUMBER", "?")
                      print(
                          f"find-owner: issue=#{inum} repo={repo_full} frames={len(filtered)} "
                          f"where_to_look={len(wtl_lits)}",
                          file=sys.stderr,
                      )

                      ban, bal, bt, bsrc, reason = "", "", 0, "", ""
                      for pth, rl in filtered:
                          cand = query_blame(pth, max(1, rl - 5), rl + 5, owner, repo)
                          if cand:
                              cn, cl, ce = cand
                              new_best = ce > bt
                              print(
                                  f"find-owner: frame {pth}:{rl} -> blame {cn!r} {cl} {_iso_utc(ce)}"
                                  + (" [new best]" if new_best else ""),
                                  file=sys.stderr,
                              )
                              if new_best:
                                  ban, bal, bt = cn, cl, ce
                                  bsrc = f"{pth}:{rl}"
                                  reason = "stack"
                          else:
                              print(f"find-owner: frame {pth}:{rl} -> no blame", file=sys.stderr)

                      def _try_literals(lits: list[str], tag: str) -> None:
                          """Grep each literal under server/src, blame each hit, keep the newest author."""
                          nonlocal ban, bal, bt, bsrc, reason
                          if not lits:
                              return
                          ws = os.environ.get("GITHUB_WORKSPACE", ".")
                          prefix = repo_src_prefix.rstrip("/") + "/"
                          mgh, bb, bu = 30, 45, 0
                          for lit in lits:
                              if bu >= bb:
                                  print(
                                      f"find-owner: blame-budget {bb} reached; stopping {tag} loop",
                                      file=sys.stderr,
                                  )
                                  break
                              pv = lit if len(lit) <= 80 else lit[:77] + "..."
                              ms = git_grep_matches(lit, prefix, ws, mgh + 1)
                              if len(ms) > mgh:
                                  print(
                                      f"find-owner: literal {pv!r} hits={len(ms)} >mgh={mgh} ({tag}, skip)",
                                      file=sys.stderr,
                                  )
                                  continue
                              print(
                                  f"find-owner: literal {pv!r} hits={len(ms)} ({tag})",
                                  file=sys.stderr,
                              )
                              for pth, rl in ms:
                                  if bu >= bb:
                                      break
                                  hit = query_blame(pth, max(1, rl - 5), rl + 5, owner, repo)
                                  bu += 1
                                  if not hit:
                                      print(f"find-owner:   -> {pth}:{rl} no blame", file=sys.stderr)
                                      continue
                                  hn, hl, he = hit
                                  new_best = he > bt
                                  print(
                                      f"find-owner:   -> {pth}:{rl} blame={hl}@{_iso_utc(he)}"
                                      + (" [new best]" if new_best else ""),
                                      file=sys.stderr,
                                  )
                                  if new_best:
                                      ban, bal, bt = hn, hl, he
                                      bsrc = f"{pth}:{rl} (literal: {pv})"
                                      reason = tag

                      if not bal and wtl_lits:
                          _try_literals(wtl_lits, "where-to-look")
                      if not bal and not filtered and not wtl_lits:
                          print(
                              "find-owner: no frames and no where-to-look literals; -> fallback",
                              file=sys.stderr,
                          )
                      return ban, bal, bt, bsrc, reason


                  def parse_skip_assignee_tokens(raw: str) -> list[str]:
                      return [x.strip().lower() for x in raw.split(",") if x.strip()]


                  def should_skip_existing_assignee(lc: str, toks: list[str]) -> bool:
                      # GitHub may assign the Copilot actor as login "Copilot" (not only copilot-* bots).
                      if lc == "copilot" or lc.startswith("copilot-"):
                          return True
                      return any(lc == t for t in toks)


                  @lru_cache(maxsize=None)
                  def repo_owner_type(repo_full: str) -> str:
                      """REST: 'Organization', 'User', or ''. Avoids GraphQL user(login:) on org owners. Memoized per process."""
                      if not repo_full or "/" not in repo_full:
                          return ""
                      try:
                          r = subprocess.run(
                              ["gh", "api", f"repos/{repo_full}", "--jq", ".owner.type"],
                              capture_output=True,
                              text=True,
                              check=False,
                              env=_env_gh_repo(),
                          )
                      except Exception:
                          return ""
                      if r.returncode != 0:
                          return ""
                      t = (r.stdout or "").strip().strip('"')
                      return t if t in ("Organization", "User") else ""


                  def is_assignable_user(login: str, repo_full: str) -> bool:
                      if not login:
                          return False
                      own, _, _ = repo_full.partition("/")
                      if own and login.lower() == own.lower() and repo_owner_type(repo_full) == "Organization":
                          return False
                      try:
                          r = subprocess.run(
                              ["gh", "api", f"repos/{repo_full}/assignees/{login}"],
                              capture_output=True,
                              text=True,
                              check=False,
                              env=_env_gh_repo(),
                          )
                          return r.returncode == 0
                      except Exception:
                          return False


                  def add_assignee_rest(to_add: str, repo_full: str, issue_number: str, toks: list[str]) -> bool:
                      """Add one assignee without replacing the full list (avoids PATCH 422 when e.g. Copilot is on the issue).

                      Prefer POST …/issues/{n}/assignees (additive). Fall back to PATCH with only assignable logins
                      (drops bots/non-assignable actors). Do not use `gh issue edit --add-assignee` (GraphQL path can
                      fail with 'Copilot agent is not enabled in this repository' when Copilot is disabled).
                      """
                      try:
                          proc = subprocess.run(
                              ["gh", "api", f"repos/{repo_full}/issues/{issue_number}"],
                              capture_output=True,
                              text=True,
                              check=False,
                              env=_env_gh_repo(),
                          )
                      except Exception:
                          return False
                      if proc.returncode != 0:
                          _gh_err(proc, f"gh api GET issues/{issue_number}")
                          return False
                      try:
                          data = json.loads(proc.stdout)
                      except json.JSONDecodeError:
                          return False
                      add_lc = to_add.lower()
                      for a in data.get("assignees") or []:
                          lg = (a.get("login") or "").strip()
                          if lg.lower() == add_lc:
                              return True
                      pl_add = json.dumps({"assignees": [to_add]})
                      try:
                          post = subprocess.run(
                              [
                                  "gh",
                                  "api",
                                  "-X",
                                  "POST",
                                  f"repos/{repo_full}/issues/{issue_number}/assignees",
                                  "--input",
                                  "-",
                              ],
                              input=pl_add,
                              text=True,
                              capture_output=True,
                              check=False,
                              env=_env_gh_repo(),
                          )
                      except Exception:
                          post = None
                      if post is not None and post.returncode == 0:
                          return True
                      if post is not None and post.returncode != 0:
                          _gh_err(post, f"gh api POST issues/{issue_number}/assignees")
                      kept: list[str] = []
                      seen_lc: set[str] = set()
                      for a in data.get("assignees") or []:
                          lg = (a.get("login") or "").strip()
                          if not lg:
                              continue
                          lc = lg.lower()
                          if should_skip_existing_assignee(lc, toks) or lc in seen_lc:
                              continue
                          if not is_assignable_user(lg, repo_full):
                              continue
                          seen_lc.add(lc)
                          kept.append(lg)
                      if add_lc not in seen_lc:
                          seen_lc.add(add_lc)
                          kept.append(to_add)
                      pl = json.dumps({"assignees": kept})
                      try:
                          p = subprocess.run(
                              ["gh", "api", "-X", "PATCH", f"repos/{repo_full}/issues/{issue_number}", "--input", "-"],
                              input=pl,
                              text=True,
                              capture_output=True,
                              check=False,
                              env=_env_gh_repo(),
                          )
                      except Exception:
                          return False
                      if p.returncode != 0:
                          _gh_err(p, f"gh api PATCH issues/{issue_number} assignees")
                      return p.returncode == 0


                  def _graphql(query: str, variables: dict) -> Optional[dict]:
                      token = (os.environ.get("GH_PROJECT_TOKEN") or os.environ.get("GH_TOKEN") or "").strip()
                      if not token:
                          return None
                      try:
                          proc = subprocess.run(
                              ["gh", "api", "graphql", "--input", "-"],
                              input=json.dumps({"query": query, "variables": variables}),
                              capture_output=True,
                              text=True,
                              check=False,
                              env={**os.environ, "GH_TOKEN": token},
                          )
                      except Exception:
                          return None
                      if proc.returncode != 0:
                          print(proc.stderr or proc.stdout, file=sys.stderr)
                          return None
                      try:
                          payload = json.loads(proc.stdout)
                      except json.JSONDecodeError:
                          return None
                      if payload.get("errors"):
                          print(json.dumps(payload["errors"]), file=sys.stderr)
                          return None
                      return payload.get("data")


                  def _iteration_is_current(it: dict) -> bool:
                      sd, dur = it.get("startDate"), it.get("duration")
                      if not sd or dur is None:
                          return False
                      try:
                          start = dt.datetime.fromisoformat(str(sd).replace("Z", "+00:00"))
                          if start.tzinfo is None:
                              start = start.replace(tzinfo=dt.timezone.utc)
                      except ValueError:
                          return False
                      end = start + dt.timedelta(days=int(dur))
                      now = dt.datetime.now(dt.timezone.utc)
                      return start <= now <= end


                  def _pick_current_iteration(iterations: list, completed: list) -> Optional[dict]:
                      """Prefer calendar-active iteration (same as test-item-defaults.js), then title match."""
                      sub = (os.environ.get("CURRENT_SPRINT_TITLE_SUBSTRING") or "current").strip().lower()
                      all_it = list(iterations or []) + list(completed or [])
                      for it in all_it:
                          if _iteration_is_current(it):
                              return it
                      if sub:
                          for it in all_it:
                              if sub in (it.get("title") or "").lower():
                                  return it
                      now = dt.datetime.now(dt.timezone.utc)
                      future = []
                      for it in iterations or []:
                          sd = it.get("startDate")
                          if not sd:
                              continue
                          try:
                              st = dt.datetime.fromisoformat(str(sd).replace("Z", "+00:00"))
                              if st.tzinfo is None:
                                  st = st.replace(tzinfo=dt.timezone.utc)
                          except ValueError:
                              continue
                          if st >= now:
                              future.append((st, it))
                      if future:
                          future.sort(key=lambda x: x[0])
                          return future[0][1]
                      return None


                  def apply_wf_database_project_and_sprint(repo_full: str, issue_number: str) -> None:
                      """Add issue to org Project V2 'WF Database' and set Sprint to the current iteration."""
                      proj_title = (os.environ.get("PROJECT_V2_TITLE") or "WF Database").strip()
                      sprint_name = (os.environ.get("SPRINT_FIELD_NAME") or "Sprint").strip()
                      if not repo_full or not issue_number or not proj_title:
                          return
                      try:
                          inum = int(issue_number)
                      except ValueError:
                          return
                      own, rname = repo_full.split("/", 1)

                      q_org_projects = """
                      query($login: String!) {
                        organization(login: $login) {
                          projectsV2(first: 100) { nodes { id title } }
                        }
                      }
                      """
                      q_user_projects = """
                      query($login: String!) {
                        user(login: $login) {
                          projectsV2(first: 100) { nodes { id title } }
                        }
                      }
                      """
                      q_org_project_by_number = """
                      query($login: String!, $number: Int!) {
                        organization(login: $login) {
                          projectV2(number: $number) { id title }
                        }
                      }
                      """
                      q_user_project_by_number = """
                      query($login: String!, $number: Int!) {
                        user(login: $login) {
                          projectV2(number: $number) { id title }
                        }
                      }
                      """

                      def _nodes_from_org(pdata: Optional[dict]) -> list:
                          if not pdata:
                              return []
                          orgn = (pdata.get("organization") or {}).get("projectsV2") or {}
                          return (orgn.get("nodes") if orgn else None) or []

                      def _nodes_from_user(pdata: Optional[dict]) -> list:
                          if not pdata:
                              return []
                          usr = (pdata.get("user") or {}).get("projectsV2") or {}
                          return (usr.get("nodes") if usr else None) or []

                      def _project_v2_by_number(login: str, number: int, as_org: bool) -> Optional[dict]:
                          q = q_org_project_by_number if as_org else q_user_project_by_number
                          d = _graphql(q, {"login": login, "number": number})
                          if not d:
                              return None
                          key = "organization" if as_org else "user"
                          return ((d.get(key) or {}).get("projectV2")) or None

                      ot = repo_owner_type(repo_full)
                      project_id = ""
                      pnum_raw = (os.environ.get("PROJECT_V2_NUMBER") or "").strip()
                      pnum: Optional[int] = int(pnum_raw) if pnum_raw.isdigit() else None

                      if pnum is not None:
                          pv: Optional[dict] = None
                          if ot == "Organization":
                              pv = _project_v2_by_number(own, pnum, True)
                          elif ot == "User":
                              pv = _project_v2_by_number(own, pnum, False)
                          else:
                              pv = _project_v2_by_number(own, pnum, True) or _project_v2_by_number(
                                  own, pnum, False
                              )
                          if pv and pv.get("id"):
                              project_id = str(pv["id"])
                              got = (pv.get("title") or "").strip()
                              if got and got != proj_title:
                                  print(
                                      f"find-owner: PROJECT_V2_NUMBER={pnum} resolved to title {got!r} "
                                      f"(PROJECT_V2_TITLE is {proj_title!r})",
                                      file=sys.stderr,
                                  )

                      nodes: list = []
                      if not project_id:
                          if ot == "Organization":
                              nodes = _nodes_from_org(_graphql(q_org_projects, {"login": own}))
                          elif ot == "User":
                              nodes = _nodes_from_user(_graphql(q_user_projects, {"login": own}))
                          else:
                              nodes = _nodes_from_org(_graphql(q_org_projects, {"login": own}))
                              if not nodes:
                                  nodes = _nodes_from_user(_graphql(q_user_projects, {"login": own}))
                          for n in nodes:
                              if (n.get("title") or "").strip() == proj_title:
                                  project_id = n.get("id") or ""
                                  break

                      if not project_id:
                          print(
                              f"find-owner: no Project V2 titled {proj_title!r} under {own}"
                              + (f" (PROJECT_V2_NUMBER={pnum} also failed)" if pnum is not None else ""),
                              file=sys.stderr,
                          )
                          if not nodes:
                              ot_disp = ot if ot else "(empty — owner-type REST lookup failed or inconclusive)"
                              tok_custom = (os.environ.get("FIND_OWNER_ORG_PROJECT_SECRET_SET") or "").strip().lower() in (
                                  "true",
                                  "1",
                                  "yes",
                              )
                              tok_disp = (
                                  "FIND_OWNER_ORG_PROJECT_TOKEN is set (dedicated token for GraphQL)"
                                  if tok_custom
                                  else "FIND_OWNER_ORG_PROJECT_TOKEN is not set (GH_PROJECT_TOKEN is the default GITHUB_TOKEN)"
                              )
                              print(
                                  f"find-owner: projectsV2 list is empty for {own!r} "
                                  f"(detected owner type: {ot_disp}; {tok_disp}). "
                                  "That can mean there are no Project V2 boards visible to this token, "
                                  "the token lacks project/org scopes, the owner-type query failed, or "
                                  "(for org-owned repos) organization-level projects are not exposed to GITHUB_TOKEN. "
                                  "If you need org Project v2, configure secret FIND_OWNER_ORG_PROJECT_TOKEN "
                                  "(classic PAT: `repo` + `project`, or fine-grained PAT with Organization projects) "
                                  "or a GitHub App. Optional: repo/org variable FIND_OWNER_PROJECT_V2_NUMBER from "
                                  "…/orgs/<org>/projects/<N>. "
                                  "https://docs.github.com/en/issues/planning-and-tracking-with-projects/automating-your-project/automating-projects-using-actions",
                                  file=sys.stderr,
                              )
                          else:
                              titles = sorted({(x.get("title") or "").strip() for x in nodes if x})
                              print(
                                  f"find-owner: visible projects ({len(nodes)}): "
                                  + (", ".join(titles[:20]) + ("…" if len(titles) > 20 else "")),
                                  file=sys.stderr,
                              )
                          return

                      q_issue = """
                      query($owner: String!, $name: String!, $inum: Int!) {
                        repository(owner: $owner, name: $name) {
                          issue(number: $inum) { id }
                        }
                      }
                      """
                      idata = _graphql(q_issue, {"owner": own, "name": rname, "inum": inum})
                      issue_node = ((idata or {}).get("repository") or {}).get("issue") or {}
                      content_id = issue_node.get("id")
                      if not content_id:
                          print("find-owner: could not resolve issue node id", file=sys.stderr)
                          return

                      q_fields = """
                      query($pid: ID!) {
                        node(id: $pid) {
                          ... on ProjectV2 {
                            fields(first: 100) {
                              nodes {
                                ... on ProjectV2IterationField {
                                  id
                                  name
                                  configuration {
                                    iterations { id title startDate duration }
                                    completedIterations { id title startDate duration }
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                      """
                      fdata = _graphql(q_fields, {"pid": project_id})
                      proj_node = (fdata or {}).get("node") or {}
                      field_nodes = ((proj_node.get("fields") or {}).get("nodes")) or []
                      iteration_field = None
                      for fn in field_nodes:
                          if not fn:
                              continue
                          nm = (fn.get("name") or "").strip()
                          if nm.lower() == sprint_name.lower() and fn.get("configuration"):
                              iteration_field = fn
                              break
                      if iteration_field is None:
                          for fn in field_nodes:
                              if fn and fn.get("configuration") and (
                                  fn.get("configuration", {}).get("iterations")
                                  or fn.get("configuration", {}).get("completedIterations")
                              ):
                                  iteration_field = fn
                                  break
                      if iteration_field is None:
                          print("find-owner: no Sprint / iteration field on project", file=sys.stderr)
                          return

                      cfg = iteration_field.get("configuration") or {}
                      iters = cfg.get("iterations") or []
                      done = cfg.get("completedIterations") or []
                      chosen = _pick_current_iteration(iters, done)
                      if not chosen or not chosen.get("id"):
                          print("find-owner: could not pick current sprint iteration", file=sys.stderr)
                          return
                      iter_id = str(chosen["id"])

                      m_add = """
                      mutation($projectId: ID!, $contentId: ID!) {
                        addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                          item { id }
                        }
                      }
                      """
                      adata = _graphql(m_add, {"projectId": project_id, "contentId": content_id})
                      item = ((adata or {}).get("addProjectV2ItemById") or {}).get("item") or {}
                      item_id = item.get("id")
                      if not item_id:
                          print("find-owner: addProjectV2ItemById did not return item id", file=sys.stderr)
                          return

                      m_set = """
                      mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $iterationId: String!) {
                        updateProjectV2ItemFieldValue(input: {
                          projectId: $projectId,
                          itemId: $itemId,
                          fieldId: $fieldId,
                          value: { iterationId: $iterationId }
                        }) {
                          projectV2Item { id }
                        }
                      }
                      """
                      fld_id = iteration_field.get("id")
                      sdata = _graphql(
                          m_set,
                          {
                              "projectId": project_id,
                              "itemId": item_id,
                              "fieldId": fld_id,
                              "iterationId": iter_id,
                          },
                      )
                      if not sdata:
                          print(
                              "find-owner: updateProjectV2ItemFieldValue failed (GraphQL error or no data); "
                              "check PAT scopes and project field permissions",
                              file=sys.stderr,
                          )
                          return
                      upd = (sdata.get("updateProjectV2ItemFieldValue") or {}).get("projectV2Item") or {}
                      if not upd.get("id"):
                          print(
                              "find-owner: updateProjectV2ItemFieldValue returned no projectV2Item id",
                              file=sys.stderr,
                          )
                          return
                      print(
                          f"find-owner: set project {proj_title!r} sprint to {chosen.get('title')!r} ({iter_id})",
                          file=sys.stderr,
                      )


                  def _run_owner_assignment() -> int:
                      body = os.environ.get("ISSUE_BODY", "") or ""
                      rf = os.environ.get("REPO", "")
                      rtp = os.environ.get("RUNTIME_PREFIX", "/opt/netapp/wlmdb/")
                      rsp = os.environ.get("REPO_SRC_PREFIX", "server/src/")
                      mf = int(os.environ.get("MAX_FRAMES", "30"))
                      inum = os.environ.get("ISSUE_NUMBER", "")
                      ska = os.environ.get("SKIP_ASSIGNEES", "")
                      fb = (os.environ.get("FALLBACK_ASSIGNEE", "") or "").strip()
                      st = parse_skip_assignee_tokens(ska)
                      _, bal, _, bsrc, reason = resolve_best_author(body, rf, rtp, rsp, mf)
                      if not bal:
                          print(
                              f"find-owner: chosen=(none) source=(none) reason=fallback",
                              file=sys.stderr,
                          )
                          if not fb:
                              print(
                                  "find-owner: no author from stack trace/literals and FALLBACK_ASSIGNEE is empty",
                                  file=sys.stderr,
                              )
                              print(
                                  f"find-owner: assign via POST /issues/{inum}/assignees -> (none) status=skipped",
                                  file=sys.stderr,
                              )
                              return 0
                          if not is_assignable_user(fb, rf):
                              print(
                                  f"find-owner: fallback {fb!r} is not assignable on {rf} "
                                  "(needs repo permission / org membership for assignment)",
                                  file=sys.stderr,
                              )
                              print(
                                  f"find-owner: assign via POST /issues/{inum}/assignees -> (none) status=skipped",
                                  file=sys.stderr,
                              )
                              return 0
                          ok = add_assignee_rest(fb, rf, inum, st)
                          print(
                              f"find-owner: assign via POST /issues/{inum}/assignees -> {fb} "
                              f"status={'ok' if ok else 'failed'}",
                              file=sys.stderr,
                          )
                          if not ok:
                              print(
                                  f"find-owner: could not assign fallback {fb!r} to issue #{inum}",
                                  file=sys.stderr,
                              )
                          return 0
                      print(
                          f"find-owner: chosen={bal} source={bsrc or '(n/a)'} reason={reason or 'unknown'}",
                          file=sys.stderr,
                      )
                      clc = bal.lower()
                      ch = bal
                      if should_skip_existing_assignee(clc, st):
                          print(
                              f"find-owner: skip {bal!r} (SKIP_ASSIGNEES/Copilot); falling back to {fb or '(empty)'}",
                              file=sys.stderr,
                          )
                          ch = fb
                      if not is_assignable_user(ch, rf):
                          if ch and ch != fb:
                              print(
                                  f"find-owner: {ch!r} not assignable on {rf}; falling back to {fb or '(empty)'}",
                                  file=sys.stderr,
                              )
                          ch = fb
                      if not is_assignable_user(ch, rf):
                          print(
                              "find-owner: neither resolved author nor fallback is assignable on "
                              f"{rf} (resolved={bal!r}, fallback={fb or '(empty)'})",
                              file=sys.stderr,
                          )
                          print(
                              f"find-owner: assign via POST /issues/{inum}/assignees -> (none) status=skipped",
                              file=sys.stderr,
                          )
                          return 0
                      if add_assignee_rest(ch, rf, inum, st):
                          print(
                              f"find-owner: assign via POST /issues/{inum}/assignees -> {ch} status=ok",
                              file=sys.stderr,
                          )
                          return 0
                      print(
                          f"find-owner: assign via POST /issues/{inum}/assignees -> {ch} status=failed",
                          file=sys.stderr,
                      )
                      if ch != fb and fb and is_assignable_user(fb, rf):
                          if add_assignee_rest(fb, rf, inum, st):
                              print(
                                  f"find-owner: assign retry POST /issues/{inum}/assignees -> {fb} status=ok "
                                  f"(fallback=<FALLBACK_ASSIGNEE>)",
                                  file=sys.stderr,
                              )
                              return 0
                          print(
                              f"find-owner: assign retry POST /issues/{inum}/assignees -> {fb} status=failed",
                              file=sys.stderr,
                          )
                          print(
                              f"find-owner: assign failed for primary and fallback on issue #{inum}",
                              file=sys.stderr,
                          )
                          return 0
                      print(
                          f"find-owner: assign failed; fallback {fb!r} not assignable on {rf}",
                          file=sys.stderr,
                      )
                      return 0


                  def main() -> int:
                      rf = os.environ.get("REPO", "")
                      inum = os.environ.get("ISSUE_NUMBER", "")
                      rc = 0
                      try:
                          rc = _run_owner_assignment()
                      finally:
                          try:
                              # Independent of assignee success above; runs after assignment attempt.
                              apply_wf_database_project_and_sprint(rf, inum)
                          except Exception as ex:
                              print(f"find-owner: project/sprint step raised: {ex}", file=sys.stderr)
                      return rc


                  sys.exit(main())
                  PY
