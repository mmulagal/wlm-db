# Manual: expand a GitHub epic into selected user stories and child tasks/test plans.
#
# Run from Actions → "Expand epic into user stories and tasks" → Run workflow.
# Manual-only: no automatic trigger on epic opened/milestoned (workflow_dispatch only).
#
# preset: full | api-only | ui-only | minimal | custom.
#   full/api-only/ui-only/minimal auto-fill the whole plan; the Custom checkboxes below are ignored.
#   custom — check "include API/UI user story", tick catalog task checkboxes per story, and
#     optionally add extra slugs in the per-story "extra tasks" field (needs allow_custom_slugs).
#   Catalog children: implementation, unit-testing, demo-support, testcase-design, functional-testing, automation.
#
# Re-runs update only listed stories/children; omitted existing issues are left alone.
# Idempotency: hidden <!-- epic-sync:... --> markers in issue bodies.
#
# Labels: applied on create only (epic non-type labels, testcase-design progression, Task on tasks).
# PATCH re-sync omits labels. Milestone copied from epic when present.
# Project/Sprint: set secret PROJECTS_SYNC_PAT (project + repo scope) to propagate from epic.
# Assignee: GITHUB_DEFAULT_ASSIGNEE (default shaswatinetapp).

name: Expand epic into user stories and tasks

run-name: 'Expand epic #${{ inputs.epic_issue_number }}'

on:
    workflow_dispatch:
        inputs:
            epic_issue_number:
                description: 'GitHub epic issue number (e.g. 1234)'
                required: true
                type: number
            preset:
                description: 'full/api-only/ui-only/minimal auto-fill the plan; custom uses the checkboxes below'
                required: true
                type: choice
                options:
                    - custom
                    - full
                    - api-only
                    - ui-only
                    - minimal
                default: custom
            include_api:
                description: 'Custom: include API user story (parent — must be checked for ↳ fields below to take effect)'
                required: true
                type: boolean
                default: false
            api_implementation:
                description: '↳ Custom API task (needs "include API user story" checked): Implementation'
                required: true
                type: boolean
                default: false
            api_unit_testing:
                description: '↳ Custom API task (needs "include API user story" checked): Unit testing'
                required: true
                type: boolean
                default: false
            api_demo_support:
                description: '↳ Custom API task (needs "include API user story" checked): Demo support'
                required: true
                type: boolean
                default: false
            api_testcase_design:
                description: '↳ Custom API task (needs "include API user story" checked): Testcase design (Test plan)'
                required: true
                type: boolean
                default: false
            api_functional_testing:
                description: '↳ Custom API task (needs "include API user story" checked): Functional testing'
                required: true
                type: boolean
                default: false
            api_automation:
                description: '↳ Custom API task (needs "include API user story" checked): Automation'
                required: true
                type: boolean
                default: false
            api_extra_tasks:
                description: "↳ Custom API task (needs \"include API user story\" checked): extra task/test-plan slugs (comma-separated, requires 'allow custom slugs'). Suffix @test-plan to mark as a test plan."
                required: false
                type: string
                default: ''
            include_ui:
                description: 'Custom: include UI user story (parent — must be checked for ↳ fields below to take effect)'
                required: true
                type: boolean
                default: false
            ui_implementation:
                description: '↳ Custom UI task (needs "include UI user story" checked): Implementation'
                required: true
                type: boolean
                default: false
            ui_unit_testing:
                description: '↳ Custom UI task (needs "include UI user story" checked): Unit testing'
                required: true
                type: boolean
                default: false
            ui_demo_support:
                description: '↳ Custom UI task (needs "include UI user story" checked): Demo support'
                required: true
                type: boolean
                default: false
            ui_testcase_design:
                description: '↳ Custom UI task (needs "include UI user story" checked): Testcase design (Test plan)'
                required: true
                type: boolean
                default: false
            ui_functional_testing:
                description: '↳ Custom UI task (needs "include UI user story" checked): Functional testing'
                required: true
                type: boolean
                default: false
            ui_automation:
                description: '↳ Custom UI task (needs "include UI user story" checked): Automation'
                required: true
                type: boolean
                default: false
            ui_extra_tasks:
                description: "↳ Custom UI task (needs \"include UI user story\" checked): extra task/test-plan slugs (comma-separated, requires 'allow custom slugs'). Suffix @test-plan to mark as a test plan."
                required: false
                type: string
                default: ''
            allow_custom_slugs:
                description: 'Allow custom [a-z0-9-]+ child slugs (e.g. deployment) beyond the catalog'
                required: true
                type: boolean
                default: false

permissions:
    issues: write

concurrency:
    group: epic-to-stories-${{ github.repository }}-${{ inputs.epic_issue_number }}
    cancel-in-progress: false

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 23.9.0

            - name: Expand epic into user stories and tasks (inline script)
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  EPIC_ISSUE_NUMBER: ${{ inputs.epic_issue_number }}
                  STORY_PRESET: ${{ inputs.preset }}
                  ALLOW_CUSTOM_SLUGS: ${{ inputs.allow_custom_slugs }}
                  INCLUDE_API: ${{ inputs.include_api }}
                  API_IMPLEMENTATION: ${{ inputs.api_implementation }}
                  API_UNIT_TESTING: ${{ inputs.api_unit_testing }}
                  API_DEMO_SUPPORT: ${{ inputs.api_demo_support }}
                  API_TESTCASE_DESIGN: ${{ inputs.api_testcase_design }}
                  API_FUNCTIONAL_TESTING: ${{ inputs.api_functional_testing }}
                  API_AUTOMATION: ${{ inputs.api_automation }}
                  API_EXTRA_TASKS: ${{ inputs.api_extra_tasks }}
                  INCLUDE_UI: ${{ inputs.include_ui }}
                  UI_IMPLEMENTATION: ${{ inputs.ui_implementation }}
                  UI_UNIT_TESTING: ${{ inputs.ui_unit_testing }}
                  UI_DEMO_SUPPORT: ${{ inputs.ui_demo_support }}
                  UI_TESTCASE_DESIGN: ${{ inputs.ui_testcase_design }}
                  UI_FUNCTIONAL_TESTING: ${{ inputs.ui_functional_testing }}
                  UI_AUTOMATION: ${{ inputs.ui_automation }}
                  UI_EXTRA_TASKS: ${{ inputs.ui_extra_tasks }}
                  GITHUB_DEFAULT_ASSIGNEE: shaswatinetapp
                  PROJECTS_SYNC_PAT: ${{ secrets.PROJECTS_SYNC_PAT }}
              run: |
                  node <<'SYNC_SCRIPT_EOF'
                  const GITHUB_TOKEN = process.env.GITHUB_TOKEN;
                  const [owner, repo] = (process.env.GITHUB_REPOSITORY || "").split("/");
                  const GITHUB_ASSIGNEE = (process.env.GITHUB_DEFAULT_ASSIGNEE || "shaswatinetapp").trim();
                  
                  const STORY_CATALOG = {
                      "api-backend": { title: "API" },
                      ui: { title: "UI" },
                  };
                  
                  const STORY_ALIASES = { api: "api-backend" };
                  
                  const CHILD_CATALOG = {
                      implementation: { title: "Implementation", kind: "task" },
                      "unit-testing": { title: "Unit testing", kind: "task" },
                      "demo-support": { title: "Demo support", kind: "task" },
                      "testcase-design": { title: "Testcase design", kind: "test-plan" },
                      "functional-testing": { title: "Functional testing", kind: "task" },
                      automation: { title: "Automation", kind: "task" },
                  };
                  
                  const ALL_CHILDREN = Object.keys(CHILD_CATALOG);
                  const KEBAB_SLUG = /^[a-z0-9-]{1,40}$/;
                  
                  const PRESET_PLANS = {
                      custom: "",
                      full: `api: ${ALL_CHILDREN.join(", ")}\nui: ${ALL_CHILDREN.join(", ")}`,
                      "api-only": `api: ${ALL_CHILDREN.join(", ")}`,
                      "ui-only": `ui: ${ALL_CHILDREN.join(", ")}`,
                      minimal: "api: implementation, unit-testing, testcase-design\nui: implementation, unit-testing, testcase-design",
                  };
                  
                  const GITHUB_ISSUE_TYPE = {
                      EPIC: "Epic",
                      USER_STORY: "User Story",
                      TASK: "Task",
                      TEST_PLAN: "Test Plan",
                  };
                  
                  const EPIC_BRACKET_TAG = /\[(?:epic)\]/i;
                  
                  function resolveStorySlug(input) {
                      const s = String(input || "").trim().toLowerCase();
                      return STORY_ALIASES[s] || s;
                  }
                  
                  function slugToTitle(slug) {
                      return String(slug || "")
                          .split("-")
                          .filter(Boolean)
                          .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
                          .join(" ");
                  }
                  
                  function parseChildToken(token) {
                      const raw = String(token || "").trim().toLowerCase();
                      if (!raw) return null;
                      if (raw.endsWith("@test-plan")) {
                          const slug = raw.slice(0, -"@test-plan".length).replace(/-$/, "");
                          return { slug, forceTestPlan: true };
                      }
                      return { slug: raw, forceTestPlan: false };
                  }
                  
                  function resolveChildDef(slug, allowCustomSlugs, forceTestPlan) {
                      const catalog = CHILD_CATALOG[slug];
                      if (catalog) {
                          return { slug, title: catalog.title, kind: catalog.kind };
                      }
                      if (!allowCustomSlugs || !KEBAB_SLUG.test(slug)) {
                          const valid = [...ALL_CHILDREN].join(", ");
                          throw new Error(
                              `Unknown child slug "${slug}". Valid catalog slugs: ${valid}` +
                                  (allowCustomSlugs ? " (or any [a-z0-9-]+ slug when custom slugs enabled)" : "")
                          );
                      }
                      const kind =
                          forceTestPlan || slug === "testcase-design" || slug.endsWith("-test-plan")
                              ? "test-plan"
                              : "task";
                      return { slug, title: slugToTitle(slug), kind };
                  }
                  
                  function resolveStoryDef(inputSlug, allowCustomSlugs) {
                      const slug = resolveStorySlug(inputSlug);
                      const catalog = STORY_CATALOG[slug];
                      if (catalog) {
                          return { slug, title: catalog.title };
                      }
                      if (!allowCustomSlugs || !KEBAB_SLUG.test(slug)) {
                          const valid = [...Object.keys(STORY_CATALOG), ...Object.keys(STORY_ALIASES)].join(", ");
                          throw new Error(
                              `Unknown story slug "${inputSlug}" (resolved "${slug}"). Valid: ${valid}` +
                                  (allowCustomSlugs ? " (or any [a-z0-9-]+ slug when custom slugs enabled)" : "")
                          );
                      }
                      return { slug, title: slugToTitle(slug) };
                  }
                  
                  function parseStoryPlan(raw, preset, allowCustomSlugs) {
                      const presetKey = preset || "custom";
                      let text = String(raw || "").trim();
                      if (!text && presetKey !== "custom") {
                          text = PRESET_PLANS[presetKey] || "";
                      }
                      if (!text) {
                          throw new Error(
                              "Story plan is empty. Select tasks in the Custom checkboxes, or choose a non-custom preset."
                          );
                      }
                  
                      const stories = [];
                      const seenStorySlugs = new Set();
                  
                      // Note: buildCustomPlanFromForm joins multiple stories with ";"; presets use newlines
                      for (const line of text.split(/[\n;]+/)) {
                          const trimmed = line.trim();
                          if (!trimmed || trimmed.startsWith("#")) continue;
                  
                          const colon = trimmed.indexOf(":");
                          if (colon < 1) {
                              throw new Error(
                                  `Invalid story plan entry (expected "story-slug: child1, ..."): ${trimmed}`
                              );
                          }
                  
                          const inputStorySlug = trimmed.slice(0, colon).trim();
                          const childrenRaw = trimmed.slice(colon + 1).trim();
                          if (!childrenRaw) {
                              throw new Error(`Story "${inputStorySlug}" has no children listed.`);
                          }
                  
                          const story = resolveStoryDef(inputStorySlug, allowCustomSlugs);
                          if (seenStorySlugs.has(story.slug)) {
                              throw new Error(`Duplicate story slug "${story.slug}" in story plan.`);
                          }
                          seenStorySlugs.add(story.slug);
                  
                          const childTokens = childrenRaw.split(/[\s,]+/).filter(Boolean);
                          const children = [];
                          const seenChildSlugs = new Set();
                          for (const token of childTokens) {
                              const parsed = parseChildToken(token);
                              if (!parsed) continue;
                              const child = resolveChildDef(parsed.slug, allowCustomSlugs, parsed.forceTestPlan);
                              if (seenChildSlugs.has(child.slug)) continue;
                              seenChildSlugs.add(child.slug);
                              children.push(child);
                          }
                          if (!children.length) {
                              throw new Error(`Story "${inputStorySlug}" has no valid children.`);
                          }
                          stories.push({ ...story, children });
                      }
                  
                      if (!stories.length) {
                          throw new Error("Story plan parsed to zero stories.");
                      }
                      return stories;
                  }
                  
                  function buildCustomPlanFromForm(env) {
                      const bool = (v) => /^(1|true|yes)$/i.test(String(v || "").trim());
                      const storyParts = [];
                      for (const [flagVar, prefix, slug, label] of [
                          ["INCLUDE_API", "API", "api", "include API user story"],
                          ["INCLUDE_UI", "UI", "ui", "include UI user story"],
                      ]) {
                          const included = bool(env[flagVar]);
                          const tasks = [];
                          if (bool(env[`${prefix}_IMPLEMENTATION`])) tasks.push("implementation");
                          if (bool(env[`${prefix}_UNIT_TESTING`])) tasks.push("unit-testing");
                          if (bool(env[`${prefix}_DEMO_SUPPORT`])) tasks.push("demo-support");
                          if (bool(env[`${prefix}_TESTCASE_DESIGN`])) tasks.push("testcase-design");
                          if (bool(env[`${prefix}_FUNCTIONAL_TESTING`])) tasks.push("functional-testing");
                          if (bool(env[`${prefix}_AUTOMATION`])) tasks.push("automation");
                          const extra = String(env[`${prefix}_EXTRA_TASKS`] || "").trim();
                          if (extra) tasks.push(...extra.split(/[\s,]+/).filter(Boolean));
                          if (!included) {
                              if (tasks.length) {
                                  throw new Error(
                                      `Custom ${slug} task(s)/extra tasks selected (${tasks.join(", ")}) but "${label}" is unchecked. Check "${label}" or clear those selections.`
                                  );
                              }
                              continue;
                          }
                          if (!tasks.length) continue; // story included but nothing selected -> skip silently
                          storyParts.push(`${slug}: ${tasks.join(", ")}`);
                      }
                      return storyParts.join("; ");
                  }
                  
                  function stripEpicPrefix(title) {
                      const t = (title || "").trim();
                      if (!t) return t;
                      let stripped = t.replace(new RegExp(`^${EPIC_BRACKET_TAG.source}:?\\s*`, "i"), "").trim();
                      stripped = stripped
                          .replace(new RegExp(`\\s*${EPIC_BRACKET_TAG.source}\\s*`, "gi"), " ")
                          .replace(/\s+/g, " ")
                          .trim();
                      return stripped || t;
                  }
                  
                  function labelName(label) {
                      if (!label) return "";
                      return typeof label === "string" ? label : label.name || "";
                  }
                  
                  function isEpicIssue(issue) {
                      if (issue.type && issue.type.name === "Epic") return true;
                      const labels = issue.labels || [];
                      return labels.some((l) => labelName(l) === "Epic");
                  }
                  
                  async function fetchEpicIssue(issueNumber) {
                      return await restWithRetry("GET", `/repos/${owner}/${repo}/issues/${issueNumber}`, null, "issues.get");
                  }
                  
                  function buildChildBody({ epicNumber, slug, title }) {
                      return (
                          `User story created by \`epic-to-stories\` (GitHub only).\n\n` +
                          `**User story:** ${title}\n\n` +
                          `**Parent epic:** #${epicNumber}\n\n` +
                          `<!-- epic-sync:child:${epicNumber}:${slug} -->`
                      );
                  }
                  
                  function buildNestedBody({ epicNumber, storySlug, nestedSlug, storyTitle, userStoryNumber, kind }) {
                      const kindLabel = kind === "test-plan" ? "Test plan" : "Task";
                      return (
                          `${kindLabel} under user story **${storyTitle}** (issue #${userStoryNumber}), epic #${epicNumber}.\n\n` +
                          `<!-- epic-sync:nested:${epicNumber}:${storySlug}:${nestedSlug} -->`
                      );
                  }
                  
                  async function listSubIssues(issueNumber) {
                      return await restWithRetry(
                          "GET",
                          `/repos/${owner}/${repo}/issues/${issueNumber}/sub_issues?per_page=100`,
                          null,
                          "listSubIssues"
                      );
                  }
                  
                  function userStoryIssueTitle(defTitle, epicSummary) {
                      return `[USER STORY]: ${defTitle} - ${epicSummary}`;
                  }
                  
                  function nestedIssueTitlePrefix(kind) {
                      return kind === "test-plan" ? "[Test Plan]" : "[TASK]";
                  }
                  
                  function nestedIssueTitle(nest, defTitle, epicSummary) {
                      return `${nestedIssueTitlePrefix(nest.kind)}: ${nest.title} (${defTitle}) - ${epicSummary}`;
                  }
                  
                  function nestedIssueLabels(nest) {
                      return nest.kind === "test-plan" ? ["progression"] : ["Task"];
                  }
                  
                  function nestedIssuesLabelsMerged(nest, epic) {
                      return [...new Set([...nestedIssueLabels(nest), ...extraLabelsFromEpic(epic)])];
                  }
                  
                  const TYPE_LABEL_NAMES = new Set(["Epic", "User Story", "Story", "Task", "Test Plan"]);
                  
                  function extraLabelsFromEpic(epic) {
                      const raw = Array.isArray(epic.labels) ? epic.labels : [];
                      const names = raw.map(labelName).filter(Boolean);
                      return names.filter((n) => !TYPE_LABEL_NAMES.has(n));
                  }
                  
                  function nestedIssueType(nest) {
                      return nest.kind === "test-plan" ? GITHUB_ISSUE_TYPE.TEST_PLAN : GITHUB_ISSUE_TYPE.TASK;
                  }
                  
                  function findUserStoryIssue(subIssues, { epicNumber, slug, title, summary }) {
                      const wantMarker = `<!-- epic-sync:child:${epicNumber}:${slug} -->`;
                      const withEpic = userStoryIssueTitle(title, summary).trim().toLowerCase();
                      const titleUserNoEpic = `[USER STORY]: ${title}`.trim().toLowerCase();
                      const titleLegacy = `[STORY]: ${title}`.trim().toLowerCase();
                      const titleNorm = title.trim().toLowerCase();
                      return (
                          subIssues.find((issue) => {
                              if (issue.body && issue.body.includes(wantMarker)) return true;
                              const it = (issue.title || "").trim().toLowerCase();
                              if (it === withEpic || it === titleUserNoEpic || it === titleLegacy || it === titleNorm) return true;
                              if (it.startsWith(`[user story]: ${title}`.trim().toLowerCase())) return true;
                              return false;
                          }) || null
                      );
                  }
                  
                  function findNestedIssue(nestedSubs, { epicNumber, storySlug, nest, defTitle, summary }) {
                      const wantMarker = `<!-- epic-sync:nested:${epicNumber}:${storySlug}:${nest.slug} -->`;
                      const full = nestedIssueTitle(nest, defTitle, summary).trim().toLowerCase();
                      const noSummary = `${nestedIssueTitlePrefix(nest.kind)}: ${nest.title} (${defTitle})`.trim().toLowerCase();
                      return (
                          nestedSubs.find((issue) => {
                              if (issue.body && issue.body.includes(wantMarker)) return true;
                              const it = (issue.title || "").trim().toLowerCase();
                              if (it === full || it === noSummary) return true;
                              if (it.startsWith(noSummary)) return true;
                              return false;
                          }) || null
                      );
                  }
                  
                  function assigneesPayload() {
                      return GITHUB_ASSIGNEE ? { assignees: [GITHUB_ASSIGNEE] } : {};
                  }
                  
                  const SKIP_PROJECT_FIELD_NAMES = new Set([
                      "Title",
                      "Assignees",
                      "Labels",
                      "Milestone",
                      "Repository",
                      "Repositories",
                  ]);
                  
                  function milestoneFromEpic(epic) {
                      const m = epic.milestone;
                      if (m == null || m.number == null) return {};
                      return { milestone: m.number };
                  }
                  
                  async function rest(method, pathname, body) {
                      const url = `https://api.github.com${pathname}`;
                      const init = {
                          method,
                          headers: {
                              Authorization: `Bearer ${GITHUB_TOKEN}`,
                              Accept: "application/vnd.github+json",
                              "User-Agent": "epic-to-stories",
                              "X-GitHub-Api-Version": "2026-03-10",
                          },
                      };
                      if (body !== undefined && body !== null) {
                          init.headers["Content-Type"] = "application/json";
                          init.body = JSON.stringify(body);
                      }
                      const res = await fetch(url, init);
                      const text = await res.text();
                      let json = null;
                      if (text) {
                          try {
                              json = JSON.parse(text);
                          } catch {
                              /* non-JSON error body */
                          }
                      }
                      if (!res.ok) {
                          const msg = (json && json.message) || text.slice(0, 200);
                          const err = new Error(`REST ${method} ${pathname} -> HTTP ${res.status}: ${msg}`);
                          err.status = res.status;
                          err.response = json;
                          throw err;
                      }
                      return json;
                  }
                  
                  async function restWithRetry(method, pathname, body, label) {
                      const maxAttempts = 4;
                      for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                          try {
                              return await rest(method, pathname, body);
                          } catch (err) {
                              const msg = String((err && err.message) || "");
                              const status = err && err.status;
                              const transient =
                                  (status >= 500 && status < 600) ||
                                  (status === 403 && /secondary rate limit|abuse/i.test(msg)) ||
                                  status === 429 ||
                                  /ECONNRESET|ETIMEDOUT|EAI_AGAIN|fetch failed/i.test(msg);
                              if (!transient || attempt === maxAttempts) throw err;
                              const delay = 1000 * Math.pow(2, attempt - 1);
                              console.warn(
                                  `REST ${label || pathname} attempt ${attempt}/${maxAttempts} failed: ${msg}. Retrying in ${delay}ms.`
                              );
                              await sleep(delay);
                          }
                      }
                  }
                  
                  async function graphql(token, query, variables) {
                      const res = await fetch("https://api.github.com/graphql", {
                          method: "POST",
                          headers: {
                              Authorization: `Bearer ${token}`,
                              "Content-Type": "application/json",
                          },
                          body: JSON.stringify({ query, variables }),
                      });
                      const text = await res.text();
                      let json;
                      try {
                          json = text ? JSON.parse(text) : {};
                      } catch (parseErr) {
                          const snippet = text.slice(0, 200).replace(/\s+/g, " ").trim();
                          throw new Error(`GraphQL HTTP ${res.status}: non-JSON response (${parseErr.message}). Body: ${snippet}`);
                      }
                      if (!res.ok) {
                          throw new Error(`GraphQL HTTP ${res.status}: ${JSON.stringify(json)}`);
                      }
                      if (json.errors && json.errors.length) {
                          throw new Error(json.errors.map((e) => e.message).join("; "));
                      }
                      return json.data;
                  }
                  
                  async function sleep(ms) {
                      return new Promise((r) => setTimeout(r, ms));
                  }
                  
                  async function graphqlWithRetry(token, query, variables, label) {
                      const maxAttempts = 4;
                      for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                          try {
                              return await graphql(token, query, variables);
                          } catch (err) {
                              const msg = String((err && err.message) || "");
                              const transient =
                                  /HTTP 5\d\d/.test(msg) ||
                                  /secondary rate limit/i.test(msg) ||
                                  /abuse detection/i.test(msg) ||
                                  /rate limit/i.test(msg) ||
                                  /ECONNRESET|ETIMEDOUT|EAI_AGAIN|fetch failed/i.test(msg);
                              if (!transient || attempt === maxAttempts) throw err;
                              const delay = 1000 * Math.pow(2, attempt - 1);
                              console.warn(`GraphQL ${label || ""} attempt ${attempt}/${maxAttempts} failed: ${msg}. Retrying in ${delay}ms.`);
                              await sleep(delay);
                          }
                      }
                  }
                  
                  function buildFieldUpdate(fv) {
                      if (!fv) return null;
                      const field = fv.field;
                      const fname = field && field.name;
                      if (!field || !fname || SKIP_PROJECT_FIELD_NAMES.has(fname)) return null;
                      switch (fv.__typename) {
                          case "ProjectV2ItemFieldSingleSelectValue": {
                              if (fname.toLowerCase() === "status") {
                                  const options = field.options || [];
                                  const todoOption = options.find((o) => o && o.name && o.name.toLowerCase() === "todo");
                                  if (todoOption && todoOption.id) {
                                      return { fieldId: field.id, value: { singleSelectOptionId: todoOption.id } };
                                  }
                                  return null;
                              }
                              if (!fv.optionId) return null;
                              return { fieldId: field.id, value: { singleSelectOptionId: fv.optionId } };
                          }
                          case "ProjectV2ItemFieldIterationValue": {
                              if (!fv.iterationId) return null;
                              return { fieldId: field.id, value: { iterationId: fv.iterationId } };
                          }
                          case "ProjectV2ItemFieldNumberValue": {
                              if (fv.number == null) return null;
                              return { fieldId: field.id, value: { number: fv.number } };
                          }
                          case "ProjectV2ItemFieldTextValue": {
                              return { fieldId: field.id, value: { text: fv.text != null ? String(fv.text) : "" } };
                          }
                          case "ProjectV2ItemFieldDateValue": {
                              if (!fv.date) return null;
                              return { fieldId: field.id, value: { date: fv.date } };
                          }
                          default:
                              return null;
                      }
                  }
                  
                  async function fetchEpicProjectPlans(token, epicNumber) {
                      const query = `
                        query EpicIssueForSync($owner: String!, $name: String!, $number: Int!) {
                          repository(owner: $owner, name: $name) {
                            issue(number: $number) {
                              id
                              projectItems(first: 25) {
                                nodes {
                                  project { id title }
                                  fieldValues(first: 50) {
                                    nodes {
                                      __typename
                                      ... on ProjectV2ItemFieldSingleSelectValue {
                                        optionId
                                        field {
                                          ... on ProjectV2FieldCommon { id name }
                                          ... on ProjectV2SingleSelectField { options { id name } }
                                        }
                                      }
                                      ... on ProjectV2ItemFieldIterationValue {
                                        iterationId
                                        field { ... on ProjectV2FieldCommon { id name } }
                                      }
                                      ... on ProjectV2ItemFieldNumberValue {
                                        number
                                        field { ... on ProjectV2FieldCommon { id name } }
                                      }
                                      ... on ProjectV2ItemFieldTextValue {
                                        text
                                        field { ... on ProjectV2FieldCommon { id name } }
                                      }
                                      ... on ProjectV2ItemFieldDateValue {
                                        date
                                        field { ... on ProjectV2FieldCommon { id name } }
                                      }
                                    }
                                  }
                                }
                              }
                            }
                          }
                        }
                      `;
                      const data = await graphqlWithRetry(token, query, { owner, name: repo, number: epicNumber }, "EpicIssueForSync");
                      const issue = data.repository && data.repository.issue;
                      if (!issue) return [];
                      const nodes = (issue.projectItems && issue.projectItems.nodes) || [];
                      const plans = [];
                      for (const pi of nodes) {
                          if (!pi || !pi.project) continue;
                          const projectId = pi.project.id;
                          const updates = [];
                          const fvs = (pi.fieldValues && pi.fieldValues.nodes) || [];
                          for (const fv of fvs) {
                              const u = buildFieldUpdate(fv);
                              if (u) updates.push(u);
                          }
                          plans.push({ projectId, updates });
                      }
                      return plans;
                  }
                  
                  async function applyProjectPlans(token, issueNodeId, plans) {
                      if (!plans || !plans.length) return;
                      const addMutation = `
                        mutation($projectId: ID!, $contentId: ID!) {
                          addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                            item { id }
                          }
                        }
                      `;
                      const updateMutation = `
                        mutation($input: UpdateProjectV2ItemFieldValueInput!) {
                          updateProjectV2ItemFieldValue(input: $input) {
                            projectV2Item { id }
                          }
                        }
                      `;
                      for (const plan of plans) {
                          const addData = await graphqlWithRetry(
                              token,
                              addMutation,
                              { projectId: plan.projectId, contentId: issueNodeId },
                              "addProjectV2ItemById"
                          );
                          const itemId = addData.addProjectV2ItemById.item.id;
                          for (const u of plan.updates) {
                              await graphqlWithRetry(
                                  token,
                                  updateMutation,
                                  {
                                      input: {
                                          projectId: plan.projectId,
                                          itemId,
                                          fieldId: u.fieldId,
                                          value: u.value,
                                      },
                                  },
                                  "updateProjectV2ItemFieldValue"
                              );
                          }
                      }
                  }
                  
                  async function ensureIssueWithNodeId(issue) {
                      if (issue.node_id) return issue;
                      return await restWithRetry("GET", `/repos/${owner}/${repo}/issues/${issue.number}`, null, "issues.get");
                  }
                  
                  async function propagateProjectsToIssue(projectToken, projectPlans, issue) {
                      if (!projectToken || !projectPlans.length) return;
                      try {
                          const full = await ensureIssueWithNodeId(issue);
                          await applyProjectPlans(projectToken, full.node_id, projectPlans);
                      } catch (e) {
                          const num = issue && issue.number;
                          console.warn(
                              `Project/Sprint propagation failed for issue #${num}: ${e && e.message ? e.message : e}. Continuing (milestone + labels already applied).`
                          );
                      }
                  }
                  
                  function runParseSelfCheck() {
                      const plan = parseStoryPlan("api: implementation, testcase-design", "custom", false);
                      if (plan.length !== 1 || plan[0].slug !== "api-backend" || plan[0].title !== "API") {
                          throw new Error("api alias → api-backend failed");
                      }
                      if (plan[0].children.length !== 2) throw new Error("expected 2 children");
                  
                      let failed = false;
                      try {
                          parseStoryPlan("api: deployment", "custom", false);
                      } catch (e) {
                          failed = true;
                          if (!/Unknown child slug "deployment"/.test(e.message)) throw e;
                      }
                      if (!failed) throw new Error("expected unknown child in standard mode");
                  
                      const custom = parseStoryPlan("api: implementation, deployment", "custom", true);
                      if (custom[0].children.some((c) => c.slug === "deployment" && c.title === "Deployment") !== true) {
                          throw new Error("custom deployment child failed");
                      }
                  
                      const preset = parseStoryPlan("", "api-only", false);
                      if (preset.length !== 1 || preset[0].slug !== "api-backend") throw new Error("api-only preset failed");
                  
                      try {
                          parseStoryPlan("api: implementation\napi-backend: demo-support", "custom", false);
                          throw new Error("expected duplicate story error");
                      } catch (e) {
                          if (!/Duplicate story slug/.test(e.message)) throw e;
                      }
                  
                      const semi = parseStoryPlan(
                          "api: implementation, testcase-design; ui: implementation, demo-support, testcase-design, functional-testing, automation",
                          "custom",
                          false
                      );
                      if (semi.length !== 2 || semi[0].slug !== "api-backend" || semi[1].slug !== "ui") {
                          throw new Error("semicolon-separated story plan failed");
                      }
                      if (semi[0].children.length !== 2 || semi[1].children.length !== 5) {
                          throw new Error("semicolon-separated child counts failed");
                      }

                      const unitTesting = resolveChildDef("unit-testing", false, false);
                      if (unitTesting.title !== "Unit testing" || unitTesting.kind !== "task") {
                          throw new Error("unit-testing catalog child failed");
                      }
                  
                      const formPlan = buildCustomPlanFromForm({
                          INCLUDE_API: "true",
                          API_IMPLEMENTATION: "true",
                          API_TESTCASE_DESIGN: "true",
                          INCLUDE_UI: "false",
                      });
                      if (formPlan !== "api: implementation, testcase-design") {
                          throw new Error(`buildCustomPlanFromForm failed: got "${formPlan}"`);
                      }
                  
                      let orphanFailed = false;
                      try {
                          buildCustomPlanFromForm({ INCLUDE_UI: "false", UI_DEMO_SUPPORT: "true" });
                      } catch (e) {
                          orphanFailed = true;
                          if (!/but "include UI user story" is unchecked/.test(e.message)) throw e;
                      }
                      if (!orphanFailed) throw new Error("expected error for child selected without parent");
                  }
                  
                  async function main() {
                      if (!GITHUB_TOKEN) throw new Error("GITHUB_TOKEN is required");
                      const epicNumber = Number(process.env.EPIC_ISSUE_NUMBER);
                      if (!Number.isInteger(epicNumber) || epicNumber <= 0) {
                          throw new Error(`Invalid EPIC_ISSUE_NUMBER: ${process.env.EPIC_ISSUE_NUMBER}`);
                      }
                  
                      const allowCustomSlugs = /^(1|true|yes)$/i.test(String(process.env.ALLOW_CUSTOM_SLUGS || "").trim());
                      const preset = process.env.STORY_PRESET || "custom";
                      const rawStoryPlan = preset === "custom" ? buildCustomPlanFromForm(process.env) : "";
                      const storyPlan = parseStoryPlan(rawStoryPlan, preset, allowCustomSlugs);
                      console.log(
                          `Story plan: ${storyPlan.length} story/stories, custom slugs=${allowCustomSlugs}: ${storyPlan
                              .map((s) => `${s.slug}(${s.children.length})`)
                              .join(", ")}`
                      );
                  
                      const epic = await fetchEpicIssue(epicNumber);
                      if (!isEpicIssue(epic)) {
                          console.log(`Issue #${epicNumber} is not an Epic; skipping.`);
                          return;
                      }
                  
                      const summary = stripEpicPrefix(epic.title);
                      const projectToken = (process.env.PROJECTS_SYNC_PAT || "").trim();
                      let projectPlans = [];
                      if (projectToken) {
                          try {
                              projectPlans = await fetchEpicProjectPlans(projectToken, epicNumber);
                              console.log(`Loaded ${projectPlans.length} project row(s) from epic #${epicNumber} to propagate.`);
                          } catch (e) {
                              console.warn(`PROJECTS_SYNC_PAT: could not read epic projects (${e.message}). Skipping Project/Sprint copy.`);
                          }
                      } else {
                          console.log("PROJECTS_SYNC_PAT not set; skipping GitHub Project / Iteration propagation (milestone still applied).");
                      }
                  
                      const subIssues = await listSubIssues(epicNumber);
                      console.log(`Epic #${epicNumber} has ${subIssues.length} sub-issue(s) before sync.`);
                  
                      for (const def of storyPlan) {
                          const storyTitle = userStoryIssueTitle(def.title, summary);
                          let storyIssue = findUserStoryIssue(subIssues, {
                              epicNumber,
                              slug: def.slug,
                              title: def.title,
                              summary,
                          });
                  
                          if (!storyIssue) {
                              const story = await restWithRetry(
                                  "POST",
                                  `/repos/${owner}/${repo}/issues`,
                                  {
                                      title: storyTitle,
                                      body: buildChildBody({ epicNumber, slug: def.slug, title: def.title }),
                                      labels: [...extraLabelsFromEpic(epic)],
                                      type: GITHUB_ISSUE_TYPE.USER_STORY,
                                      ...milestoneFromEpic(epic),
                                      ...assigneesPayload(),
                                  },
                                  "createIssue"
                              );
                              storyIssue = story;
                              try {
                                  await restWithRetry(
                                      "POST",
                                      `/repos/${owner}/${repo}/issues/${epicNumber}/sub_issues`,
                                      { sub_issue_id: story.id },
                                      "addSubIssue"
                                  );
                                  console.log(`Created and linked user story #${story.number}: ${storyTitle}`);
                              } catch (e) {
                                  console.error(`Created user story #${story.number} but failed to link under epic: ${e.message}`);
                                  throw e;
                              }
                              subIssues.push(story);
                          } else {
                              await restWithRetry(
                                  "PATCH",
                                  `/repos/${owner}/${repo}/issues/${storyIssue.number}`,
                                  {
                                      title: storyTitle,
                                      body: buildChildBody({ epicNumber, slug: def.slug, title: def.title }),
                                      type: GITHUB_ISSUE_TYPE.USER_STORY,
                                      ...milestoneFromEpic(epic),
                                      ...assigneesPayload(),
                                  },
                                  "updateIssue"
                              );
                              console.log(`Updated user story #${storyIssue.number}: ${storyTitle}`);
                          }
                  
                          await propagateProjectsToIssue(projectToken, projectPlans, storyIssue);
                  
                          const nestedSubs = await listSubIssues(storyIssue.number);
                          for (const nest of def.children) {
                              const nestedTitle = nestedIssueTitle(nest, def.title, summary);
                              const existingNested = findNestedIssue(nestedSubs, {
                                  epicNumber,
                                  storySlug: def.slug,
                                  nest,
                                  defTitle: def.title,
                                  summary,
                              });
                              if (existingNested) {
                                  await restWithRetry(
                                      "PATCH",
                                      `/repos/${owner}/${repo}/issues/${existingNested.number}`,
                                      {
                                          title: nestedTitle,
                                          type: nestedIssueType(nest),
                                          ...milestoneFromEpic(epic),
                                          ...assigneesPayload(),
                                      },
                                      "updateIssue"
                                  );
                                  console.log(
                                      `Child issue #${existingNested.number} already present under user story #${storyIssue.number}; title, type, assignee, and milestone updated (labels unchanged).`
                                  );
                                  await propagateProjectsToIssue(projectToken, projectPlans, existingNested);
                                  continue;
                              }
                              const nestedIssue = await restWithRetry(
                                  "POST",
                                  `/repos/${owner}/${repo}/issues`,
                                  {
                                      title: nestedTitle,
                                      body: buildNestedBody({
                                          epicNumber,
                                          storySlug: def.slug,
                                          nestedSlug: nest.slug,
                                          storyTitle: def.title,
                                          userStoryNumber: storyIssue.number,
                                          kind: nest.kind,
                                      }),
                                      labels: nestedIssuesLabelsMerged(nest, epic),
                                      type: nestedIssueType(nest),
                                      ...milestoneFromEpic(epic),
                                      ...assigneesPayload(),
                                  },
                                  "createIssue"
                              );
                              try {
                                  await restWithRetry(
                                      "POST",
                                      `/repos/${owner}/${repo}/issues/${storyIssue.number}/sub_issues`,
                                      { sub_issue_id: nestedIssue.id },
                                      "addSubIssue"
                                  );
                                  console.log(
                                      `Created and linked child issue #${nestedIssue.number} under user story #${storyIssue.number}: ${nestedTitle}`
                                  );
                              } catch (e) {
                                  console.error(`Created child issue #${nestedIssue.number} but failed to link under user story: ${e.message}`);
                                  throw e;
                              }
                              await propagateProjectsToIssue(projectToken, projectPlans, nestedIssue);
                              nestedSubs.push(nestedIssue);
                          }
                      }
                  
                      console.log("Done.");
                  }
                  
                  runParseSelfCheck();
                  main().catch((err) => {
                      console.error(err);
                      process.exit(1);
                  });
