#prettier-ignore
---
AWSTemplateFormatVersion: '2010-09-09'
Description: This template creates AWS resources for validating Active Directory credentials
            under the provided VPC. You will be billed for the AWS resources used if you create
            a stack from this template.
Metadata:
    AWS::CloudFormation::Interface:
        ParameterGroups:
            - Label:
                  default: Network Configuration
              Parameters:
                  - VPCID
                  - Subnet1ID
                  - Subnet2ID
                  - Ec2RoleName
            - Label:
                  default: Amazon EC2 Configuration
              Parameters:
                  - KeyPairName
            - Label:
                  default: Amazon FSx for ONTAP Volume Configuration
              Parameters:
                  - PerformFSxCheck
                  - FSxFileSystemId
            - Label:
                  default: AWS Launch Wizard Configuration
              Parameters:
                  - EnableCloudWatchLogFeature
                  - ParentStackName
            - Label:
                  default: PGSQL Server Configuration
              Parameters:
                  - SQLDeploymentMode
        ParameterLabels:
            UniqueID:
                default: Unique ID for your resource tags
            AMI:
                default: AMI ID of the validation node
            InstanceType:
                default: Instance type of the validation node
            KeyPairName:
                default: Key pair Name
            Subnet1ID:
                default: Subnet ID 1
            Subnet2ID:
                default: Subnet ID 2
            PurposeTag:
                default: Tag your instances with purpose
            VPCID:
                default: VPC ID
            Ec2RoleName:
                default: Role name for EC2 instance profile
            EnableCloudWatchLogFeature:
                default: (optional) Enable monitoring by CloudWatch Logging
            ParentStackName:
                default: Stack name for parent cloudFormation stack
            PerformFSxCheck:
                default: Boolean to check whether to validate FSx for ONTAP credentials and reachability from subnet
            FSxFileSystemId:
                default: FSx for ONTAP Filesystem ID
            SQLDeploymentMode:
                default: PGSQL server deployment mode
Parameters:
    UniqueID:
        Default: UID123
        Description: Automation execution unique ID.
        Type: String
    AMI:
        Type: String
        Default: ami-061d37dd032d5c737
    InstanceType:
        Type: String
        Default: t3.micro
    KeyPairName:
        Description: Public/private key pairs allow you to securely connect to your instance
            after it launches.
        Type: AWS::EC2::KeyPair::KeyName
    Subnet1ID:
        Description: ID of private subnet in an Availability Zone 1 for the workload (For example, subnet-a0246dcd).
        Type: String
    Subnet2ID:
        Description: ID of private subnet in an Availability Zone 2 for the workload (For example, subnet-a0246dcd).
        Type: String
    VPCID:
        Description: ID of the VPC (for example, vpc-0343606e).
        Type: AWS::EC2::VPC::Id
    Ec2RoleName:
        Default: AmazonEC2RoleForLaunchWizard
        Description: Role name for EC2 instance profile.
        Type: String
    EnableCloudWatchLogFeature:
        Default: false
        Description: Enable AWS CloudWatch logging.
        Type: String
    ParentStackName:
        Description: Stack name for the parent CloudFormation stack.
        Type: String
    PerformFSxCheck:
        AllowedValues:
            - 'true'
            - 'false'
        Default: 'false'
        Description: A boolean to check whether to validate FSx for ONTAP credentials and reachability from the subnet.
        Type: String
    FSxFileSystemId:
        Description: ID for the FSx for ONTAP file system.
        Type: String
    SQLDeploymentMode:
        Description: PGSQL server deployment mode
        Type: String
        AllowedValues:
            - 'ha'
            - 'standalone'
        Default: 'ha'
Conditions:
    CreateNewRole: !Equals
        - !Ref 'Ec2RoleName'
        - ''
    LogFeatureEnabled: !Equals
        - !Ref 'EnableCloudWatchLogFeature'
        - 'true'
    IsHACluster: !Equals
        - !Ref 'SQLDeploymentMode'
        - 'ha'
Resources:
    ValidationInstanceProfile:
        Type: AWS::IAM::InstanceProfile
        Properties:
            Roles:
                - !Ref 'Ec2RoleName'
    DisableIMDSv1:
        Type: AWS::EC2::LaunchTemplate
        Properties:
            LaunchTemplateData:
                MetadataOptions:
                    HttpEndpoint: enabled
                    HttpTokens: required
    ValidationNode1:
        Type: AWS::EC2::Instance
        CreationPolicy:
            ResourceSignal:
                Count: '1'
                Timeout: PT45M
        Metadata:
            AWS::CloudFormation::Init:
                configSets:
                    config:
                        - InstallSSMAgent
                        - CreateDeploymentFolders
                        - ConfigureCWLogs
                        - FetchResources
                        - ScriptSignatureVerificationandExtract
                        - Finalize
                InstallSSMAgent:
                    commands:
                        a-install-ssm-agent:
                            command: !Sub |
                                for i in {1..3}; do
                                    sudo yum install -y https://s3.${AWS::Region}.amazonaws.com/amazon-ssm-${AWS::Region}/latest/linux_amd64/amazon-ssm-agent.rpm && break || sleep 1;
                                done
                        b-install-cloudwatch-agent:
                            command: !Sub |
                                for i in {1..3}; do
                                    sudo yum install -y amazon-cloudwatch-agent.x86_64 && break || sleep 1;
                                done
                CreateDeploymentFolders:
                    commands:
                        a-create-scripts-folder:
                            command: !Sub 'mkdir -p /home/ec2-user/cfn/scripts'
                        b-create-logs-folder:
                            command: !Sub 'sudo mkdir -p /var/log/netapp_wf'
                ConfigureCWLogs:
                    files:
                        /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json:
                            content: !Sub |
                                {{{ PgsqlCloudWatchConfig }}}
                            mode: '000644'
                            owner: cwagent
                            group: cwagent
                    commands:
                        a-configure-cwlogs:
                            command: !If
                                - LogFeatureEnabled
                                - sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s
                                - echo "CloudWatch Logs feature is disabled."
                FetchResources:
                    files:
                        /home/ec2-user/cfn/scripts/verify-signature.sh:
                            source: {{{ ScriptVerifySignature }}}
                            mode: '000755'
                            owner: ec2-user
                            group: ec2-user
                        /home/ec2-user/cfn/scripts/unzip-archive.sh:
                            source: {{{ ScriptUnzipArchive }}}
                            mode: '000755'
                            owner: ec2-user
                            group: ec2-user
                        /home/ec2-user/cfn/scripts/validation.zip:
                            source: {{{ ScriptValidation }}}
                            mode: '000755'
                            owner: ec2-user
                            group: ec2-user
                        /home/ec2-user/cfn/fsx_certs.zip:
                            source: {{{ FsxCertificates }}}
                            mode: '000755'
                            owner: ec2-user
                            group: ec2-user
                        /home/ec2-user/cfn/signig_files.zip:
                            source: {{{ ArtifactsSignatures }}}
                            mode: '000755'
                            owner: ec2-user
                            group: ec2-user
                ScriptSignatureVerificationandExtract:
                    commands:
                        a-change-to-sudo-user:
                            command: sudo su
                        b-unpack-signatures:
                            command: /home/ec2-user/cfn/scripts/unzip-archive.sh -s /home/ec2-user/cfn/signig_files.zip -d /home/ec2-user/cfn
                        c-verify-validation-signature:
                            command: !Join
                                - ''
                                - - /home/ec2-user/cfn/scripts/verify-signature.sh -f /home/ec2-user/cfn/scripts/validation.zip -s /home/ec2-user/cfn/signig_files/validation.zip.sig 
                                    -p /home/ec2-user/cfn/signig_files/validation.zip.pub -r ValidationNode1 -n "
                                  - !Ref 'AWS::StackName'
                                  - '"'
                        d-unpack-validation-scripts:
                            command: /home/ec2-user/cfn/scripts/unzip-archive.sh -s /home/ec2-user/cfn/scripts/validation.zip -d /home/ec2-user/cfn/scripts
                        e-unpack-fsx-certificates:
                            command: /home/ec2-user/cfn/scripts/unzip-archive.sh -s /home/ec2-user/cfn/fsx_certs.zip -d /home/ec2-user/cfn
                Finalize:
                    commands:
                        a-validate-vpc:
                            command: !Sub 
                                - '/home/ec2-user/cfn/scripts/validation/validate-vpc.sh ${subnetId} ${AWS::Region} ${AWS::StackName} ValidationNode1'
                                - subnetId: !Ref 'Subnet1ID'
                        b-store-credentials-in-parameter-store:
                            command: !Sub 
                                - aws ssm put-parameter
                                    --name "/netapp/wlmdb/${parentStackName}"
                                    --type "SecureString"
                                    --value "$(aws ssm get-parameter --name "/netapp/wlmdb/${ParentStackName}" --with-decryption --query "Parameter.Value" --output text)"
                                    --overwrite
                                - parentStackName: !Ref 'ParentStackName'
                        c-validate-fsx-connectivity:
                            command: !Sub 
                                - '/home/ec2-user/cfn/scripts/validation/validate-fsx.sh
                                    -e ${PerformFSxCheck}
                                    -f ${FSxFileSystemId}
                                    -r ${AWS::Region}
                                    -n ${AWS::StackName}
                                    -p ${ParentStackName}
                                    -s ValidationNode1'
                                -   PerformFSxCheck: !Ref 'PerformFSxCheck'
                                    FSxFileSystemId: !Ref 'FSxFileSystemId'
                                    ParentStackName: !Ref 'ParentStackName'
                        d-signal-resource:
                            command: !Sub 'cfn-signal -e $? --resource ValidationNode1
                                --stack ${AWS::StackName} --region ${AWS::Region}'
        Properties:
            ImageId: !Ref 'AMI'
            InstanceType: !Ref 'InstanceType'
            IamInstanceProfile: !Ref 'ValidationInstanceProfile'
            LaunchTemplate:
                LaunchTemplateId: !Ref 'DisableIMDSv1'
                Version: !GetAtt 'DisableIMDSv1.DefaultVersionNumber'
            NetworkInterfaces:
                - DeviceIndex: '0'
                  SubnetId: !Ref 'Subnet1ID'
            KeyName: !Ref 'KeyPairName'
            InstanceInitiatedShutdownBehavior: terminate
            UserData:
                Fn::Base64: !Sub |
                    #!/bin/bash -xe
                    sleep 10
                    token=$(curl -X PUT -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" -s http://169.254.169.254/latest/api/token)
                    echo "Token: $token"
                    instanceID=$(curl -H "X-aws-ec2-metadata-token: $token" -s http://169.254.169.254/latest/meta-data/instance-id)
                    echo "Instance ID: $instanceID"
                    FailureReason="CF endpoint is not reachable. Check your subnet outbound connectivity."
                    url=https://cloudformation.${AWS::Region}.amazonaws.com
                    StatusCode=$(curl -s -o /dev/null -w "%{http_code}" $url)
                    echo "Status code: $StatusCode"
                    if [ "$StatusCode" != "200" ]; then
                        echo $FailureReason
                        aws cloudformation signal-resource --stack ${AWS::StackName} --logical-resource-id ValidationNode1 --status FAILURE --reason "$FailureReason" --region ${AWS::Region}
                        exit 1
                    else
                        echo "CF endpoint is reachable."
                        /opt/aws/bin/cfn-init -v -c config --stack ${AWS::StackName} --resource ValidationNode1 --region ${AWS::Region}
                    fi
                    shutdown now
    ValidationNode2:
        Type: AWS::EC2::Instance
        Condition: IsHACluster
        CreationPolicy:
            ResourceSignal:
                Count: '1'
                Timeout: PT45M
        Metadata:
            AWS::CloudFormation::Init:
                configSets:
                    config:
                        - InstallSSMAgent
                        - CreateDeploymentFolders
                        - ConfigureCWLogs
                        - FetchResources
                        - ScriptSignatureVerificationandExtract
                        - Finalize
                InstallSSMAgent:
                    commands:
                        a-install-ssm-agent:
                            command: !Sub |
                                for i in {1..3}; do
                                    sudo yum install -y https://s3.${AWS::Region}.amazonaws.com/amazon-ssm-${AWS::Region}/latest/linux_amd64/amazon-ssm-agent.rpm && break || sleep 1;
                                done
                        b-install-cloudwatch-agent:
                            command: !Sub |
                                for i in {1..3}; do
                                    sudo yum install -y amazon-cloudwatch-agent.x86_64 && break || sleep 1;
                                done
                CreateDeploymentFolders:
                    commands:
                        a-create-scripts-folder:
                            command: !Sub 'mkdir -p /home/ec2-user/cfn/scripts'
                        b-create-logs-folder:
                            command: !Sub 'sudo mkdir -p /var/log/netapp_wf'
                ConfigureCWLogs:
                    files:
                        /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json:
                            content: !Sub |
                                {{{ PgsqlCloudWatchConfig }}}
                            mode: '000644'
                            owner: cwagent
                            group: cwagent
                    commands:
                        a-configure-cwlogs:
                            command: !If
                                - LogFeatureEnabled
                                - sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s
                                - echo "CloudWatch Logs feature is disabled."
                FetchResources:
                    files:
                        /home/ec2-user/cfn/scripts/verify-signature.sh:
                            source: {{{ ScriptVerifySignature }}}
                            mode: '000755'
                            owner: ec2-user
                            group: ec2-user
                        /home/ec2-user/cfn/scripts/unzip-archive.sh:
                            source: {{{ ScriptUnzipArchive }}}
                            mode: '000755'
                            owner: ec2-user
                            group: ec2-user
                        /home/ec2-user/cfn/scripts/validation.zip:
                            source: {{{ ScriptValidation }}}
                            mode: '000755'
                            owner: ec2-user
                            group: ec2-user
                        /home/ec2-user/cfn/fsx_certs.zip:
                            source: {{{ FsxCertificates }}}
                            mode: '000755'
                            owner: ec2-user
                            group: ec2-user
                        /home/ec2-user/cfn/signig_files.zip:
                            source: {{{ ArtifactsSignatures }}}
                            mode: '000755'
                            owner: ec2-user
                            group: ec2-user
                ScriptSignatureVerificationandExtract:
                    commands:
                        a-change-to-sudo-user:
                            command: sudo su
                        b-unpack-signatures:
                            command: /home/ec2-user/cfn/scripts/unzip-archive.sh -s /home/ec2-user/cfn/signig_files.zip -d /home/ec2-user/cfn
                        c-verify-validation-signature:
                            command: !Join
                                - ''
                                - - /home/ec2-user/cfn/scripts/verify-signature.sh -f /home/ec2-user/cfn/scripts/validation.zip -s /home/ec2-user/cfn/signig_files/validation.zip.sig 
                                    -p /home/ec2-user/cfn/signig_files/validation.zip.pub -r ValidationNode2 -n "
                                  - !Ref 'AWS::StackName'
                                  - '"'
                        d-unpack-validation-scripts:
                            command: /home/ec2-user/cfn/scripts/unzip-archive.sh -s /home/ec2-user/cfn/scripts/validation.zip -d /home/ec2-user/cfn/scripts
                        e-unpack-fsx-certificates:
                            command: /home/ec2-user/cfn/scripts/unzip-archive.sh -s /home/ec2-user/cfn/fsx_certs.zip -d /home/ec2-user/cfn
                Finalize:
                    commands:
                        a-validate-vpc:
                            command: !Sub 
                                - '/home/ec2-user/cfn/scripts/validation/validate-vpc.sh ${subnetId} ${AWS::Region} ${AWS::StackName} ValidationNode2'
                                - subnetId: !Ref 'Subnet2ID'
                        b-validate-fsx-connectivity:
                            command: !Sub 
                                - '/home/ec2-user/cfn/scripts/validation/validate-fsx.sh
                                    -e ${PerformFSxCheck}
                                    -f ${FSxFileSystemId}
                                    -r ${AWS::Region}
                                    -n ${AWS::StackName}
                                    -p ${ParentStackName}
                                    -s ValidationNode2'
                                -   PerformFSxCheck: !Ref 'PerformFSxCheck'
                                    FSxFileSystemId: !Ref 'FSxFileSystemId'
                                    ParentStackName: !Ref 'ParentStackName'
                        c-signal-resource:
                            command: !Sub 'cfn-signal -e $? --resource ValidationNode2
                                --stack ${AWS::StackName} --region ${AWS::Region}'
        Properties:
            ImageId: !Ref 'AMI'
            InstanceType: !Ref 'InstanceType'
            IamInstanceProfile: !Ref 'ValidationInstanceProfile'
            LaunchTemplate:
                LaunchTemplateId: !Ref 'DisableIMDSv1'
                Version: !GetAtt 'DisableIMDSv1.DefaultVersionNumber'
            NetworkInterfaces:
                - DeviceIndex: '0'
                  SubnetId: !Ref 'Subnet2ID'
            KeyName: !Ref 'KeyPairName'
            InstanceInitiatedShutdownBehavior: terminate
            UserData:
                Fn::Base64: !Sub |
                    #!/bin/bash -xe
                    sleep 10
                    token=$(curl -X PUT -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" -s http://169.254.169.254/latest/api/token)
                    echo "Token: $token"
                    instanceID=$(curl -H "X-aws-ec2-metadata-token: $token" -s http://169.254.169.254/latest/meta-data/instance-id)
                    echo "Instance ID: $instanceID"
                    FailureReason="CF endpoint is not reachable. Check your subnet outbound connectivity."
                    url=https://cloudformation.${AWS::Region}.amazonaws.com
                    StatusCode=$(curl -s -o /dev/null -w "%{http_code}" $url)
                    echo "Status code: $StatusCode"
                    if [ "$StatusCode" != "200" ]; then
                        echo $FailureReason
                        aws cloudformation signal-resource --stack ${AWS::StackName} --logical-resource-id ValidationNode2 --status FAILURE --reason "$FailureReason" --region ${AWS::Region}
                        exit 1
                    else
                        echo "CF endpoint is reachable."
                        /opt/aws/bin/cfn-init -v -c config --stack ${AWS::StackName} --resource ValidationNode2 --region ${AWS::Region}
                    fi
                    shutdown now
