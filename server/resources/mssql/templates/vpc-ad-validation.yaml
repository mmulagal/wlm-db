AWSTemplateFormatVersion: '2010-09-09'
Description: This template creates AWS resources for validating Active Directory credentials
    under the provided VPC. You will be billed for the AWS resources used if you create
    a stack from this template.
Metadata:
    AWS::CloudFormation::Interface:
        ParameterGroups:
            - Label:
                  default: Network Configuration
              Parameters:
                  - VPCID
                  - SubnetID
                  - DNSIpAddresses
                  - Ec2RoleName
            - Label:
                  default: Amazon EC2 Configuration
              Parameters:
                  - KeyPairName
            - Label:
                  default: Microsoft Active Directory Configuration
              Parameters:
                  - PerformADCheck
                  - DomainDNSName
                  - DomainAdminUser
                  - DomainAdminSecretName
            - Label:
                  default: AWS Launch Wizard Configuration
              Parameters:
                  - AssetsBucketName
                  - AssetsS3KeyPrefix
        ParameterLabels:
            UniqueID:
                default: unique ID for your resource tags
            AMI:
                default: AMI ID of the validation node
            DomainAdminSecretName:
                default: Domain Admin Password Secret String Name
            DomainAdminUser:
                default: Domain Admin User Name
            DomainDNSName:
                default: Domain DNS Name
            DNSIpAddresses:
                default: AD DNS Server1 IP address
            KeyPairName:
                default: Key Pair Name
            SubnetID:
                default: Subnet ID
            PurposeTag:
                default: Tag Your Instances with Purpose
            AssetsBucketName:
                default: Launch Wizard S3 Bucket Name
            AssetsS3KeyPrefix:
                default: Launch Wizard S3 Key Prefix
            VPCID:
                default: VPC ID
            Ec2RoleName:
                default: Role name for EC2 instance profile
            PerformADCheck:
                default: Boolean to check whether to perform Directory check
Parameters:
    UniqueID:
        Default: UID123
        Description: Automation Execution Unique ID.
        Type: String
    AMI:
        Type: String
        Default: ami-061d37dd032d5c737
    DomainAdminSecretName:
        Description: Domain Admin Password Secret String Name
        Type: String
    DomainAdminUser:
        Description: User name for the account that will be used as Domain Administrator.
            This is separate from the default "Administrator" account
        MaxLength: '20'
        MinLength: '5'
        Type: String
    DomainDNSName:
        Description: Fully qualified domain name (FQDN) e.g. example.com
        MaxLength: '255'
        MinLength: '2'
        Type: String
    DNSIpAddresses:
        Default: ''
        Description: Fixed private IPs for the Active Directory server
        Type: String
    KeyPairName:
        Description: Public/private key pairs allow you to securely connect to your instance
            after it launches
        Type: AWS::EC2::KeyPair::KeyName
    SubnetID:
        Description: ID of the private subnet 1 in Availability Zone 1 (e.g., subnet-a0246dcd)
        Type: AWS::EC2::Subnet::Id
    AssetsBucketName:
        Description: S3 bucket name for the LaunchWizard SQLHA assets. LaunchWizard SQLHA
            bucket name can include numbers, lowercase letters, uppercase letters, and hyphens
            (-). It cannot start or end with a hyphen (-).
        Type: String
    AssetsS3KeyPrefix:
        Description: S3 key prefix for the LaunchWizard SQLHA assets. LaunchWizard SQLHA
            key prefix can include numbers, lowercase letters, uppercase letters, hyphens
            (-), and forward slash (/).
        Type: String
    AssetsS3RegionCode:
        Default: s3.us-east-1
        Description: S3 region code.
        Type: String
    VPCID:
        Description: ID of the VPC (e.g., vpc-0343606e)
        Type: AWS::EC2::VPC::Id
    Ec2RoleName:
        Default: AmazonEC2RoleForLaunchWizard
        Description: Role name for EC2 instance profile
        Type: String
    PerformADCheck:
        AllowedValues:
            - 'true'
            - 'false'
        Default: 'false'
        Description: If Cloudwatch logging is enabled
        Type: String
Conditions:
    isGovRegion: !Or
        - !Equals
          - us-gov-west-1
          - !Ref 'AWS::Region'
        - !Equals
          - us-gov-east-1
          - !Ref 'AWS::Region'
    ADCheckEnabled: !Equals
        - !Ref 'PerformADCheck'
        - 'true'
    ADCheckNotEnabled: !Equals
        - !Ref 'PerformADCheck'
        - 'false'
    CreateNewRole: !Equals
        - !Ref 'Ec2RoleName'
        - ''
Resources:
    ValidationInstanceProfile:
        Type: AWS::IAM::InstanceProfile
        Properties:
            Roles:
                - !Ref 'Ec2RoleName'
    DomainMemberSG:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupDescription: Domain Members
            VpcId: !Ref 'VPCID'
            Tags:
                - Key: ResourceGroupID
                  Value: !Ref 'UniqueID'
    DisableIMDSv1:
        Type: AWS::EC2::LaunchTemplate
        Properties:
            LaunchTemplateData:
                MetadataOptions:
                    HttpEndpoint: enabled
                    HttpTokens: required
    ValidationNode1:
        Type: AWS::EC2::Instance
        Condition: ADCheckEnabled
        CreationPolicy:
            ResourceSignal:
                Count: '1'
                Timeout: PT30M
        Metadata:
            AWS::CloudFormation::Authentication:
                S3AccessCreds:
                    type: S3
                    roleName: !Ref 'Ec2RoleName'
                    buckets:
                        - !Ref 'AssetsBucketName'
            AWS::CloudFormation::Init:
                configSets:
                    config:
                        - FetchResources
                        - LaunchWizardCFNSetup
                        - Prep
                        - Finalize
                FetchResources:
                    files:
                        C:\cfn\scripts\Unzip-Archive.ps1:
                            source: {{ ScriptUnzipArchive }}
                        C:\cfn\modules\AWSLaunchWizardForCFN.zip:
                            source: {{ AmazonLaunchWizardForCFN }}
                        C:\cfn\scripts\Validate-VPC.ps1:
                            source: {{ ScriptVpcCheck }}
                        C:\cfn\scripts\Update-DNSServers.ps1:
                            source: {{ ScriptUpdateDnsServers }}
                        C:\cfn\scripts\Rename-Computer.ps1:
                            source: {{ ScriptRenameComputer }}
                        C:\cfn\scripts\Restart-Computer.ps1:
                            source: {{ ScriptRestartComputer }}
                LaunchWizardCFNSetup:
                    commands:
                        b-unpack-launchwizard-module:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\modules\AWSLaunchWizardForCFN.zip -Destination C:\Windows\system32\WindowsPowerShell\v1.0\Modules\
                            waitAfterCompletion: '0'
                Prep:
                    commands:
                        b-rename-computer:
                            command: !Join
                                - ''
                                - - powershell.exe -Command "C:\cfn\scripts\Rename-Computer.ps1 -Restart
                                    -NewName 'DomainJoin1'
                            waitAfterCompletion: forever
                        c-update-DNS:
                            command: !Join
                                - ''
                                - - powershell.exe -Command "C:\cfn\scripts\Update-DNSServers.ps1
                                    -DNSIpAddresses '
                                  - !Ref 'DNSIpAddresses'
                                  - '''"'
                            waitAfterCompletion: '0'
                Finalize:
                    commands:
                        a-reboot:
                            command: powershell.exe -Command "C:\cfn\scripts\Restart-Computer.ps1"
                            waitAfterCompletion: forever
                        b-validate-vpc:
                            command: !Join
                                - ''
                                - - 'powershell.exe -Command "C:\cfn\scripts\Validate-VPC.ps1 -subnet '
                                  - !Ref 'SubnetID'
                                  - ' -region '
                                  - !Ref 'AWS::Region'
                                  - '"'
                            waitAfterCompletion: '0'
                        c-signal-resource:
                            command: !Sub 'cfn-signal.exe -e %ERRORLEVEL% --resource ValidationNode1
                                --stack ${AWS::StackName} --region ${AWS::Region}'
                            waitAfterCompletion: '0'
        Properties:
            ImageId: !Ref 'AMI'
            IamInstanceProfile: !Ref 'ValidationInstanceProfile'
            LaunchTemplate:
                LaunchTemplateId: !Ref 'DisableIMDSv1'
                Version: !GetAtt 'DisableIMDSv1.DefaultVersionNumber'
            InstanceType: t2.micro
            NetworkInterfaces:
                - AssociatePublicIpAddress: 'true'
                  DeviceIndex: '0'
                  SubnetId: !Ref 'SubnetID'
                  GroupSet:
                      - !Ref 'DomainMemberSG'
            KeyName: !Ref 'KeyPairName'
            UserData: !Base64
                Fn::Join:
                    - ''
                    - - "<script>\n"
                      - 'cfn-init.exe -v -c config -s '
                      - !Ref 'AWS::StackId'
                      - ' -r ValidationNode1'
                      - ' --region '
                      - !Ref 'AWS::Region'
                      - ''
                      - </script>
    ValidationNode2:
        Type: AWS::EC2::Instance
        Condition: ADCheckNotEnabled
        CreationPolicy:
            ResourceSignal:
                Count: '1'
                Timeout: PT15M
        Metadata:
            AWS::CloudFormation::Authentication:
                S3AccessCreds:
                    type: S3
                    roleName: !Ref 'Ec2RoleName'
                    buckets:
                        - !Ref 'AssetsBucketName'
            AWS::CloudFormation::Init:
                configSets:
                    config:
                        - FetchResources
                        - LaunchWizardCFNSetup
                        - Finalize
                FetchResources:
                    files:
                        C:\cfn\scripts\Unzip-Archive.ps1:
                            source: {{ ScriptUnzipArchive }}
                        C:\cfn\modules\AWSLaunchWizardForCFN.zip:
                            source: {{ AmazonLaunchWizardForCFN }}
                        C:\cfn\scripts\Validate-VPC.ps1:
                            source: {{ ScriptVpcCheck }}
                LaunchWizardCFNSetup:
                    commands:
                        b-unpack-launchwizard-module:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\modules\AWSLaunchWizardForCFN.zip -Destination C:\Windows\system32\WindowsPowerShell\v1.0\Modules\
                            waitAfterCompletion: '0'
                Finalize:
                    commands:
                        a-validate-vpc:
                            command: !Join
                                - ''
                                - - 'powershell.exe -Command "C:\cfn\scripts\Validate-VPC.ps1 -subnet '
                                  - !Ref 'SubnetID'
                                  - ' -region '
                                  - !Ref 'AWS::Region'
                                  - '"'
                            waitAfterCompletion: '0'
                        b-signal-resource:
                            command: !Sub 'cfn-signal.exe -e %ERRORLEVEL% --resource ValidationNode2
                                --stack ${AWS::StackName} --region ${AWS::Region}'
                            waitAfterCompletion: '0'
        Properties:
            ImageId: !Ref 'AMI'
            IamInstanceProfile: !Ref 'ValidationInstanceProfile'
            LaunchTemplate:
                LaunchTemplateId: !Ref 'DisableIMDSv1'
                Version: !GetAtt 'DisableIMDSv1.DefaultVersionNumber'
            InstanceType: t2.micro
            NetworkInterfaces:
                - AssociatePublicIpAddress: 'true'
                  DeviceIndex: '0'
                  SubnetId: !Ref 'SubnetID'
                  GroupSet:
                      - !Ref 'DomainMemberSG'
            KeyName: !Ref 'KeyPairName'
            UserData: !Base64
                Fn::Join:
                    - ''
                    - - "<script>\n"
                      - 'cfn-init.exe -v -c config -s '
                      - !Ref 'AWS::StackId'
                      - ' -r ValidationNode2'
                      - ' --region '
                      - !Ref 'AWS::Region'
                      - ''
                      - </script>
