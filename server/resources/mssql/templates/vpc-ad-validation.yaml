#prettier-ignore
---
AWSTemplateFormatVersion: '2010-09-09'
Description: This template creates AWS resources for validating Active Directory credentials
            under the provided VPC. You will be billed for the AWS resources used if you create
            a stack from this template.
Metadata:
    AWS::CloudFormation::Interface:
        ParameterGroups:
            - Label:
                  default: Network Configuration
              Parameters:
                  - VPCID
                  - SubnetID
                  - DNSIpAddresses
                  - Ec2RoleName
                  - IsCustomAmi
            - Label:
                  default: Amazon EC2 Configuration
              Parameters:
                  - KeyPairName
            - Label:
                  default: Microsoft Active Directory Configuration
              Parameters:
                  - PerformADCheck
                  - DomainDNSName
                  - DomainAdminUser
                  - PreferredDomainController
            - Label:
                  default: Amazon FSx for ONTAP Volume Configuration
              Parameters:
                  - PerformFSxCheck
                  - FSxFileSystemId
            - Label:
                  default: AWS Launch Wizard Configuration
              Parameters:
                  - EnableCloudWatchLogFeature
                  - ParentStackName
            - Label:
                  default: Microsoft SQL Server Configuration
              Parameters:
                  - SQLDeploymentMode
        ParameterLabels:
            UniqueID:
                default: Unique ID for your resource tags
            AMI:
                default: AMI ID of the validation node
            InstanceType:
                default: Instance type of the validation node
            DomainAdminUser:
                default: Domain Admin user name
            DomainDNSName:
                default: Domain DNS name
            DNSIpAddresses:
                default: AD DNS server1 IP address
            KeyPairName:
                default: Key pair Name
            SubnetID:
                default: Subnet ID
            PurposeTag:
                default: Tag your instances with purpose
            VPCID:
                default: VPC ID
            Ec2RoleName:
                default: Role name for EC2 instance profile
            PerformADCheck:
                default: Boolean to check whether to perform Directory check
            EnableCloudWatchLogFeature:
                default: (optional) Enable monitoring by CloudWatch Logging
            ParentStackName:
                default: Stack name for parent cloudFormation stack
            PerformFSxCheck:
                default: Boolean to check whether to validate FSx for ONTAP credentials and reachability from subnet
            FSxFileSystemId:
                default: FSx for ONTAP Filesystem ID
            IsCustomAmi:
                default:  Boolean to indicate if AMI includes SQL license or BYOL license
            SQLDeploymentMode:
                default: SQL server deployment mode
            PreferredDomainController:
                default: (optional) Preferred domain controller to use for AD join
Parameters:
    UniqueID:
        Default: UID123
        Description: Automation execution unique ID.
        Type: String
    AMI:
        Type: String
        Default: ami-061d37dd032d5c737
    DomainAdminUser:
        Description: User name for the account that will be used as Domain Administrator.
            This is separate from the default "Administrator" account.
        MaxLength: '20'
        MinLength: '1'
        Type: String
    InstanceType:
        Type: String
        Default: t3.micro
    DomainDNSName:
        Description: Fully qualified domain name (FQDN). For example, example.com.
        MaxLength: '255'
        MinLength: '2'
        Type: String
    DNSIpAddresses:
        Default: ''
        Description: Fixed private IPs for the Active Directory server.
        Type: String
    KeyPairName:
        Description: Public/private key pairs allow you to securely connect to your instance
            after it launches.
        Type: AWS::EC2::KeyPair::KeyName
    SubnetID:
        Description: ID of private subnet in an Availability Zone 1 for the workload (For example,
            subnet-a0246dcd).
        Type: AWS::EC2::Subnet::Id
    VPCID:
        Description: ID of the VPC (for example, vpc-0343606e).
        Type: AWS::EC2::VPC::Id
    Ec2RoleName:
        Default: AmazonEC2RoleForLaunchWizard
        Description: Role name for EC2 instance profile.
        Type: String
    PerformADCheck:
        AllowedValues:
            - 'true'
            - 'false'
        Default: 'false'
        Description: If AWS CloudWatch logging is enabled.
        Type: String
    EnableCloudWatchLogFeature:
        Default: false
        Description: Enable AWS CloudWatch logging.
        Type: String
    ParentStackName:
        Description: Stack name for the parent CloudFormation stack.
        Type: String
    PerformFSxCheck:
        AllowedValues:
            - 'true'
            - 'false'
        Default: 'false'
        Description: A boolean to check whether to validate FSx for ONTAP credentials and reachability from the subnet.
        Type: String
    FSxFileSystemId:
        Description: ID for the FSx for ONTAP file system.
        Type: String
    IsCustomAmi:
        Description: Boolean to indicate if AMI includes SQL license or BYOL license
        Type: String
        AllowedValues:
            - 'true'
            - 'false'
        Default: 'false'
    SQLDeploymentMode:
        Description: SQL server deployment mode
        Type: String
        AllowedValues:
            - 'fci'
            - 'standalone'
        Default: 'fci'
    PreferredDomainController:
        Description: (optional) Preferred domain controller to use for AD join
        Type: String
        Default: default
Conditions:
    ADCheckEnabled: !Equals
        - !Ref 'PerformADCheck'
        - 'true'
    ADCheckNotEnabled: !Equals
        - !Ref 'PerformADCheck'
        - 'false'
    CreateNewRole: !Equals
        - !Ref 'Ec2RoleName'
        - ''
    LogFeatureEnabled: !Equals
        - !Ref 'EnableCloudWatchLogFeature'
        - 'true'
Resources:
    ValidationInstanceProfile:
        Type: AWS::IAM::InstanceProfile
        Properties:
            Roles:
                - !Ref 'Ec2RoleName'
    DomainMemberSG:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupDescription: Domain Members
            VpcId: !Ref 'VPCID'
            Tags:
                - Key: ResourceGroupID
                  Value: !Ref 'UniqueID'
    DisableIMDSv1:
        Type: AWS::EC2::LaunchTemplate
        Properties:
            LaunchTemplateData:
                MetadataOptions:
                    HttpEndpoint: enabled
                    HttpTokens: required
    ValidationNode1WaitHandler:
        Type: AWS::CloudFormation::WaitConditionHandle
        Condition: ADCheckEnabled
    ValidationNode1WaitCondition:
        Type: AWS::CloudFormation::WaitCondition
        Condition: ADCheckEnabled
        Properties:
            Handle: !Ref ValidationNode1WaitHandler
            Timeout: '3600'
            Count: 1
    ValidationNode1:
        Type: AWS::EC2::Instance
        Condition: ADCheckEnabled
        CreationPolicy:
            ResourceSignal:
                Count: '1'
                Timeout: PT60M
        Metadata:
            AWS::CloudFormation::Init:
                configSets:
                    config:
                        - ConfigureCWLogs
                        - FetchResources
                        - ScriptSignatureVerificationandExtract
                        - LaunchWizardCFNSetup
                        - Prep
                        - Finalize               
                ConfigureCWLogs:
                    files:
                        C:\cfn\config\amazon-cloudwatch-agent.json:
                            content: !Sub |
                                {
                                  "agent": {
                                    "region": "${AWS::Region}"
                                  },
                                  "logs": {
                                    "logs_collected": {
                                      "files": {
                                        "collect_list": [
                                          {
                                            "file_path": "C:\\cfn\\log\\**",
                                            "log_group_name": "${ParentStackName}",
                                            "log_stream_name": "{instance_id}",
                                            "timestamp_format": "%Y-%m-%d %H:%M:%S,%f"
                                          }
                                        ]
                                      }
                                    }
                                  }
                                }
                        C:\cfn\scripts\Install-CloudWatchAgent.ps1:
                            content: !Sub |
                                $ErrorActionPreference = 'Continue'
                                try {
                                    $agentCtl = 'C:\Program Files\Amazon\AmazonCloudWatchAgent\amazon-cloudwatch-agent-ctl.ps1'
                                    if (-not (Test-Path $agentCtl)) {
                                        Write-Output 'AmazonCloudWatchAgent not found. Installing via AWS-ConfigureAWSPackage...'
                                        if (-not (Get-Command Send-SSMCommand -ErrorAction SilentlyContinue)) {
                                            Import-Module AWSPowerShell -ErrorAction SilentlyContinue
                                        }
                                        $token = Invoke-RestMethod -Method PUT -Uri 'http://169.254.169.254/latest/api/token' -Headers @{ 'X-aws-ec2-metadata-token-ttl-seconds' = '21600' }
                                        $instanceId = Invoke-RestMethod -Uri 'http://169.254.169.254/latest/meta-data/instance-id' -Headers @{ 'X-aws-ec2-metadata-token' = $token }
                                        $commandId = (Send-SSMCommand -DocumentName 'AWS-ConfigureAWSPackage' -InstanceId $instanceId -Region '${AWS::Region}' -Parameter @{ action = 'Install'; name = 'AmazonCloudWatchAgent' }).CommandId
                                        # ponytail: bounded 5-minute poll instead of an SSM waiter; if the install runs long
                                        # this just moves on and CW Logs picks up on the next stack update/re-init.
                                        $deadline = (Get-Date).AddMinutes(5)
                                        do {
                                            Start-Sleep -Seconds 10
                                            $invocationStatus = (Get-SSMCommandInvocation -CommandId $commandId -InstanceId $instanceId -Region '${AWS::Region}' -ErrorAction SilentlyContinue).Status
                                        } while ($invocationStatus -in @('Pending', 'InProgress', 'Delayed', $null) -and (Get-Date) -lt $deadline)
                                        if ($invocationStatus -ne 'Success') {
                                            Write-Warning "AmazonCloudWatchAgent install did not confirm success (status: $invocationStatus)."
                                        }
                                    }
                                    if (Test-Path $agentCtl) {
                                        & $agentCtl -a fetch-config -m ec2 -s -c file:C:\cfn\config\amazon-cloudwatch-agent.json
                                    } else {
                                        Write-Warning 'AmazonCloudWatchAgent is not installed; skipping CloudWatch Logs configuration.'
                                    }
                                } catch {
                                    Write-Warning "Failed to configure AmazonCloudWatchAgent: $_"
                                }
                    commands:
                        a-installssmscript:
                            command: echo try{Start-Process ` -FilePath C:\SSMAgent_latest.exe ` -ArgumentList "/S"}catch{Write-Host $_.exception} > C:/install-ssm.ps1
                            waitAfterCompletion: '0'
                        b-installssm:
                            command: powershell.exe -Command C:/install-ssm.ps1
                            waitAfterCompletion: '30'
                        c-enableSSM:
                            command: powershell.exe -Command "Set-Service -Name AmazonSSMAgent -StartupType
                                Automatic"
                            waitAfterCompletion: '30'
                        d-restartSSMScript:
                            command: echo try{Restart-Service AmazonSSMAgent -Force -ErrorAction Continue}catch{Write-Host $_.exception} > C:/restart-ssm.ps1
                            waitAfterCompletion: '0'
                        e-restartSSM:
                            command: powershell.exe -Command C:/restart-ssm.ps1
                            waitAfterCompletion: '30'
                        f-configurecwagent:
                            command: !If
                                - LogFeatureEnabled
                                - powershell.exe -Command C:\cfn\scripts\Install-CloudWatchAgent.ps1
                                - echo "CloudWatch Logs feature is disabled."
                            waitAfterCompletion: '30'
                FetchResources:
                    files:
                        C:\cfn\scripts\Verify-Signature.ps1:
                            source: {{{ ScriptVerifySignature }}}
                        C:\cfn\scripts\Unzip-Archive.ps1:
                            source: {{{ ScriptUnzipArchive }}}
                        C:\cfn\modules\AWSLaunchWizardForCFN.zip:
                            source: {{{ AmazonLaunchWizardForCFN }}}
                        C:\cfn\scripts\validation.zip:
                            source: {{{ ScriptValidation }}}
                        C:\cfn\scripts\common.zip:
                            source: {{{ ScriptCommon }}}
                        C:\cfn\signig_files.zip:
                            source: {{{ ArtifactsSignatures }}}
                        C:\cfn\OpenSSL-Win64.zip:
                            source: {{{ OpenSSL }}}
                ScriptSignatureVerificationandExtract:
                    commands:
                        a-unpack-signatures:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\signig_files.zip -Destination C:\cfn
                            waitAfterCompletion: 0
                        b-unpack-openssl:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\OpenSSL-Win64.zip -Destination C:\cfn
                            waitAfterCompletion: 0
                        c-verify-validation-signature:
                            command: !Join
                                - ''
                                - - powershell.exe -Command C:\cfn\scripts\Verify-Signature.ps1 -FilePath C:\cfn\scripts\validation.zip -SignatureFilePath C:\cfn\signig_files\validation.sig 
                                    -PubFilePath C:\cfn\signig_files\validation.pub -ResourceID ValidationNode1 -Stackname '"
                                  - !Ref 'AWS::StackName'
                                  - '''"'
                            waitAfterCompletion: 0
                        d-unpack-validation-scripts:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\scripts\validation.zip -Destination C:\cfn\scripts
                            waitAfterCompletion: 0
                        e-verify-common-signature:
                            command: !Join
                                - ''
                                - - powershell.exe -Command C:\cfn\scripts\Verify-Signature.ps1 -FilePath C:\cfn\scripts\common.zip -SignatureFilePath C:\cfn\signig_files\common.sig 
                                    -PubFilePath C:\cfn\signig_files\common.pub -ResourceID ValidationNode1 -Stackname '"
                                  - !Ref 'AWS::StackName'
                                  - '''"'
                            waitAfterCompletion: 0
                        f-unpack-common-scripts:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\scripts\common.zip -Destination C:\cfn\scripts
                            waitAfterCompletion: 0
                LaunchWizardCFNSetup:
                    commands:
                        b-unpack-launchwizard-module:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\modules\AWSLaunchWizardForCFN.zip -Destination C:\Windows\system32\WindowsPowerShell\v1.0\Modules\
                            waitAfterCompletion: '0'
                Prep:
                    commands:
                        a-update-DNS:
                            command: !Join
                                - ''
                                - - 'powershell.exe -Command "C:\cfn\scripts\common\Update-DNSServers.ps1 -DNSIpAddresses '
                                  - ''''
                                  - !Ref 'DNSIpAddresses'
                                  - ''''
                                  - ' -Stackname '
                                  - !Ref 'AWS::StackName'
                                  - ' -ResourceID ValidationNode1'
                                  - ' -WaitHandler '
                                  - '"'
                                  - Fn::Base64: !Ref 'ValidationNode1WaitHandler'
                                  - '"'
                                  - '"'
                            waitAfterCompletion: '0'
                Finalize:
                    commands:
                        a-validate-vpc:
                            command: !Join
                                - ''
                                - - 'powershell.exe -Command "C:\cfn\scripts\validation\Validate-VPCConnectivity.ps1 -subnet '
                                  - !Ref 'SubnetID'
                                  - ' -region '
                                  - !Ref 'AWS::Region'
                                  - ' -Stackname '
                                  - !Ref 'AWS::StackName'
                                  - ' -ResourceID ValidationNode1'
                                  - ' -WaitHandler '
                                  - '"'
                                  - Fn::Base64: !Ref 'ValidationNode1WaitHandler'
                                  - '"'
                                  - '"'
                            waitAfterCompletion: '0'
                        b-validate-ad:
                            command: !Join
                                - ''
                                - - 'powershell.exe -Command "C:\cfn\scripts\validation\Validate-Credentials.ps1 -DomainName '
                                  - !Ref 'DomainDNSName'
                                  - ' -UserName '
                                  - !Ref 'DomainAdminUser'
                                  - ' -isSecretManagerSupported  0'
                                  - ' -Stackname '
                                  - !Ref 'AWS::StackName'
                                  - ' -Parentstackname '
                                  - !Ref 'ParentStackName'
                                  - ' -DCName '
                                  - !Ref 'PreferredDomainController'
                                  - ' -ResourceID ValidationNode1'
                                  - ' -WaitHandler '
                                  - '"'
                                  - Fn::Base64: !Ref 'ValidationNode1WaitHandler'
                                  - '"'
                                  - '"'
                            waitAfterCompletion: '0'                 
                        c-validate-fsx:
                            command: !Join
                                  - ''
                                  - - 'powershell.exe -Command "C:\cfn\scripts\validation\Validate-FsxConnectivity.ps1 -PerformFSxCheck '
                                    - !Ref 'PerformFSxCheck'
                                    - ' -FSxFileSystemId '
                                    - !Ref 'FSxFileSystemId'
                                    - ' -FSxRegion '
                                    - !Ref 'AWS::Region'
                                    - ' -Stackname '
                                    - !Ref 'AWS::StackName'
                                    - ' -Parentstackname '
                                    - !Ref 'ParentStackName'
                                    - ' -ResourceID ValidationNode1'
                                    - ' -WaitHandler '
                                    - '"'
                                    - Fn::Base64: !Ref 'ValidationNode1WaitHandler'
                                    - '"'
                                    - '"'
                            waitAfterCompletion: '0'
                        d-validate-ami:
                            command: !Join
                                  - ''
                                  - - 'powershell.exe -Command "C:\cfn\scripts\validation\Validate-Ami.ps1 -IsCustomAmi '
                                    - !Ref 'IsCustomAmi'
                                    - ' -Region '
                                    - !Ref 'AWS::Region'
                                    - ' -DomainDNSName '
                                    - !Ref 'DomainDNSName'
                                    - ' -SQLDeploymentMode '
                                    - !Ref 'SQLDeploymentMode'
                                    - ' -Stackname '
                                    - !Ref 'AWS::StackName'
                                    - ' -Parentstackname '
                                    - !Ref 'ParentStackName'
                                    - ' -ResourceID ValidationNode1'
                                    - ' -WaitHandler '
                                    - '"'
                                    - Fn::Base64: !Ref 'ValidationNode1WaitHandler'
                                    - '"'
                                    - '"'
                            waitAfterCompletion: '0'
                        e-signal-resource:
                            command: !Sub 'cfn-signal.exe -e %ERRORLEVEL% --resource ValidationNode1
                                --stack ${AWS::StackName} --region ${AWS::Region}'
                            waitAfterCompletion: '0'
        Properties:
            ImageId: !Ref 'AMI'
            InstanceType: !Ref 'InstanceType'
            IamInstanceProfile: !Ref 'ValidationInstanceProfile'
            LaunchTemplate:
                LaunchTemplateId: !Ref 'DisableIMDSv1'
                Version: !GetAtt 'DisableIMDSv1.DefaultVersionNumber'
            NetworkInterfaces:
                - DeviceIndex: '0'
                  SubnetId: !Ref 'SubnetID'
                  GroupSet:
                      - !Ref 'DomainMemberSG'
            KeyName: !Ref 'KeyPairName'
            InstanceInitiatedShutdownBehavior: terminate
            UserData: !Base64
                Fn::Join:
                    - ''
                    - - "<powershell>\n"
                      - '[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls -bor [Net.SecurityProtocolType]::Tls11 -bor [Net.SecurityProtocolType]::Tls12'
                      - "\n"
                      - '$token = Invoke-RestMethod -Headers @{"X-aws-ec2-metadata-token-ttl-seconds" = "21600"} -Method PUT -Uri "http://169.254.169.254/latest/api/token" '
                      - "\n"
                      - '$instanceID = Invoke-RestMethod -Headers @{"X-aws-ec2-metadata-token" = $token} -Method GET -Uri http://169.254.169.254/latest/meta-data/instance-id'
                      - "\n"
                      - '$FailureReason = "CF endpoint is not reachable. Check your subnet outbound connectivity."'
                      - "\n"
                      - 'try {'
                      - "\n"
                      - '$progressPreference = "silentlyContinue"'
                      - "\n"
                      - "$Response = Invoke-WebRequest -Uri 'https://cloudformation."
                      - !Ref 'AWS::Region'
                      - ".amazonaws.com' -UseBasicParsing"
                      - "\n"
                      - '$StatusCode = $Response.StatusCode'
                      - "\n"
                      - '}'
                      - "\n"
                      - 'catch { '
                      - "\n"
                      - "Write-Output $_"
                      - "\n"
                      - '$StatusCode = 0'
                      - "\n"
                      - '}'
                      - "\n"
                      - 'Write-Output $StatusCode'
                      - "\n"
                      - 'if ($StatusCode -eq 200) {'
                      - "\n"
                      - '$stackname = "'
                      - !Ref 'ParentStackName'
                      - '"'
                      - "\n"
                      - 'Write-SSMParameter  -Name "/netapp/wlmdb/$stackname" -Value (Get-SSMParameter -Name "/netapp/wlmdb/$stackname" -WithDecryption $True).Value -Type "SecureString" -Overwrite $true'
                      - "\n"
                      - 'try {'
                      - "\n"
                      - 'Get-Service AmazonSSMAgent -ErrorAction Stop'
                      - "\n"
                      - '}catch{'
                      - "\n"
                      - '[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls -bor [Net.SecurityProtocolType]::Tls11 -bor [Net.SecurityProtocolType]::Tls12'
                      - "\n"
                      - '$progressPreference = "silentlyContinue"'
                      - "\n"
                      - 'Invoke-WebRequest `https://amazon-ssm-'
                      - !Ref 'AWS::Region'
                      - '.s3.'
                      - !Ref 'AWS::Region'
                      - '.amazonaws.com/latest/windows_amd64/AmazonSSMAgentSetup.exe ` -OutFile C:\SSMAgent_latest.exe'
                      - "\n"
                      - '}'
                      - "\n"
                      - 'cfn-init.exe -v -c config -s '
                      - !Ref 'AWS::StackId'
                      - ' -r ValidationNode1'
                      - ' --region '
                      - !Ref 'AWS::Region'
                      - "\n"
                      - 'shutdown /s'
                      - '}'
                      - 'else {'
                      - "\n"
                      - "Start-Process 'cfn-signal.exe' -ArgumentList '-e 1 -r $FailureReason "
                      - Fn::Base64: !Ref 'ValidationNode1WaitHandler'
                      - "' -Wait -NoNewWindow "
                      - "\n"
                      - 'Send-CFNResourceSignal -StackName '
                      - !Ref 'AWS::StackId'
                      - ' -Status FAILURE -LogicalResourceId ValidationNode1 '
                      - '-UniqueId $instanceID'
                      - "\n"
                      - 'shutdown /s'
                      - "}\n"
                      - '</powershell>'
    ValidationNode2WaitHandler:
        Type: AWS::CloudFormation::WaitConditionHandle
        Condition: ADCheckNotEnabled
    ValidationNode2WaitCondition:
        Type: AWS::CloudFormation::WaitCondition
        Condition: ADCheckNotEnabled
        Properties:
            Handle: !Ref ValidationNode2WaitHandler
            Timeout: '1800'
            Count: 1
    ValidationNode2:
        Type: AWS::EC2::Instance
        Condition: ADCheckNotEnabled
        CreationPolicy:
            ResourceSignal:
                Count: '1'
                Timeout: PT30M
        Metadata:
            AWS::CloudFormation::Init:
                configSets:
                    config:
                        - ConfigureCWLogs
                        - FetchResources
                        - ScriptSignatureVerificationandExtract
                        - LaunchWizardCFNSetup
                        - Finalize
                ConfigureCWLogs:
                    files:
                        C:\cfn\config\amazon-cloudwatch-agent.json:
                            content: !Sub |
                                {
                                  "agent": {
                                    "region": "${AWS::Region}"
                                  },
                                  "logs": {
                                    "logs_collected": {
                                      "files": {
                                        "collect_list": [
                                          {
                                            "file_path": "C:\\cfn\\log\\**",
                                            "log_group_name": "${ParentStackName}",
                                            "log_stream_name": "{instance_id}",
                                            "timestamp_format": "%Y-%m-%d %H:%M:%S,%f"
                                          }
                                        ]
                                      }
                                    }
                                  }
                                }
                        C:\cfn\scripts\Install-CloudWatchAgent.ps1:
                            content: !Sub |
                                $ErrorActionPreference = 'Continue'
                                try {
                                    $agentCtl = 'C:\Program Files\Amazon\AmazonCloudWatchAgent\amazon-cloudwatch-agent-ctl.ps1'
                                    if (-not (Test-Path $agentCtl)) {
                                        Write-Output 'AmazonCloudWatchAgent not found. Installing via AWS-ConfigureAWSPackage...'
                                        if (-not (Get-Command Send-SSMCommand -ErrorAction SilentlyContinue)) {
                                            Import-Module AWSPowerShell -ErrorAction SilentlyContinue
                                        }
                                        $token = Invoke-RestMethod -Method PUT -Uri 'http://169.254.169.254/latest/api/token' -Headers @{ 'X-aws-ec2-metadata-token-ttl-seconds' = '21600' }
                                        $instanceId = Invoke-RestMethod -Uri 'http://169.254.169.254/latest/meta-data/instance-id' -Headers @{ 'X-aws-ec2-metadata-token' = $token }
                                        $commandId = (Send-SSMCommand -DocumentName 'AWS-ConfigureAWSPackage' -InstanceId $instanceId -Region '${AWS::Region}' -Parameter @{ action = 'Install'; name = 'AmazonCloudWatchAgent' }).CommandId
                                        # ponytail: bounded 5-minute poll instead of an SSM waiter; if the install runs long
                                        # this just moves on and CW Logs picks up on the next stack update/re-init.
                                        $deadline = (Get-Date).AddMinutes(5)
                                        do {
                                            Start-Sleep -Seconds 10
                                            $invocationStatus = (Get-SSMCommandInvocation -CommandId $commandId -InstanceId $instanceId -Region '${AWS::Region}' -ErrorAction SilentlyContinue).Status
                                        } while ($invocationStatus -in @('Pending', 'InProgress', 'Delayed', $null) -and (Get-Date) -lt $deadline)
                                        if ($invocationStatus -ne 'Success') {
                                            Write-Warning "AmazonCloudWatchAgent install did not confirm success (status: $invocationStatus)."
                                        }
                                    }
                                    if (Test-Path $agentCtl) {
                                        & $agentCtl -a fetch-config -m ec2 -s -c file:C:\cfn\config\amazon-cloudwatch-agent.json
                                    } else {
                                        Write-Warning 'AmazonCloudWatchAgent is not installed; skipping CloudWatch Logs configuration.'
                                    }
                                } catch {
                                    Write-Warning "Failed to configure AmazonCloudWatchAgent: $_"
                                }
                    commands:
                        a-installssmscript:
                            command: echo try{Start-Process ` -FilePath C:\SSMAgent_latest.exe ` -ArgumentList "/S"}catch{Write-Host $_.exception} > C:/install-ssm.ps1
                            waitAfterCompletion: '0'
                        b-installssm:
                            command: powershell.exe -Command C:/install-ssm.ps1
                            waitAfterCompletion: '30'
                        c-enableSSM:
                            command: powershell.exe -Command "Set-Service -Name AmazonSSMAgent -StartupType
                                Automatic"
                            waitAfterCompletion: '30'
                        d-restartSSMScript:
                            command: echo try{Restart-Service AmazonSSMAgent -Force -ErrorAction Continue}catch{Write-Host $_.exception} > C:/restart-ssm.ps1
                            waitAfterCompletion: '0'
                        e-restartSSM:
                            command: powershell.exe -Command C:/restart-ssm.ps1
                            waitAfterCompletion: '30'
                        f-configurecwagent:
                            command: !If
                                - LogFeatureEnabled
                                - powershell.exe -Command C:\cfn\scripts\Install-CloudWatchAgent.ps1
                                - echo "CloudWatch Logs feature is disabled."
                            waitAfterCompletion: '30'
                FetchResources:
                    files:
                        C:\cfn\scripts\Verify-Signature.ps1:
                            source: {{{ ScriptVerifySignature }}}
                        C:\cfn\scripts\Unzip-Archive.ps1:
                            source: {{{ ScriptUnzipArchive }}}
                        C:\cfn\modules\AWSLaunchWizardForCFN.zip:
                            source: {{{ AmazonLaunchWizardForCFN }}}
                        C:\cfn\scripts\validation.zip:
                            source: {{{ ScriptValidation }}}
                        C:\cfn\scripts\common.zip:
                            source: {{{ ScriptCommon }}}
                        C:\cfn\signig_files.zip:
                            source: {{{ ArtifactsSignatures }}}
                        C:\cfn\OpenSSL-Win64.zip:
                            source: {{{ OpenSSL }}}
                ScriptSignatureVerificationandExtract:
                    commands:
                        a-unpack-signatures:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\signig_files.zip -Destination C:\cfn
                            waitAfterCompletion: 0
                        b-unpack-openssl:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\OpenSSL-Win64.zip -Destination C:\cfn
                            waitAfterCompletion: 0
                        c-verify-validation-signature:
                            command: !Join
                                - ''
                                - - powershell.exe -Command C:\cfn\scripts\Verify-Signature.ps1 -FilePath C:\cfn\scripts\validation.zip -SignatureFilePath C:\cfn\signig_files\validation.sig 
                                    -PubFilePath C:\cfn\signig_files\validation.pub -ResourceID ValidationNode2 -Stackname '"
                                  - !Ref 'AWS::StackName'
                                  - '''"'
                            waitAfterCompletion: 0
                        d-unpack-validation-scripts:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\scripts\validation.zip -Destination C:\cfn\scripts
                            waitAfterCompletion: 0
                        e-verify-common-signature:
                            command: !Join
                                - ''
                                - - powershell.exe -Command C:\cfn\scripts\Verify-Signature.ps1 -FilePath C:\cfn\scripts\common.zip -SignatureFilePath C:\cfn\signig_files\common.sig 
                                    -PubFilePath C:\cfn\signig_files\common.pub -ResourceID ValidationNode2 -Stackname '"
                                  - !Ref 'AWS::StackName'
                                  - '''"'
                            waitAfterCompletion: 0
                        f-unpack-common-scripts:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\scripts\common.zip -Destination C:\cfn\scripts
                            waitAfterCompletion: 0
                LaunchWizardCFNSetup:
                    commands:
                        b-unpack-launchwizard-module:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\modules\AWSLaunchWizardForCFN.zip -Destination C:\Windows\system32\WindowsPowerShell\v1.0\Modules\
                            waitAfterCompletion: '0'
                Finalize:
                    commands:
                        a-validate-vpc:
                            command: !Join
                                - ''
                                - - 'powershell.exe -Command "C:\cfn\scripts\validation\Validate-VPCConnectivity.ps1 -subnet '
                                  - !Ref 'SubnetID'
                                  - ' -region '
                                  - !Ref 'AWS::Region'
                                  - ' -Stackname '
                                  - !Ref 'AWS::StackName'
                                  - ' -ResourceID ValidationNode2'
                                  - ' -WaitHandler '
                                  - '"'
                                  - Fn::Base64: !Ref 'ValidationNode2WaitHandler'
                                  - '"'
                                  - '"'
                            waitAfterCompletion: '0'
                        b-validate-fsx:
                            command: !Join
                                  - ''
                                  - - 'powershell.exe -Command "C:\cfn\scripts\validation\Validate-FsxConnectivity.ps1 -PerformFSxCheck '
                                    - !Ref 'PerformFSxCheck'
                                    - ' -FSxFileSystemId '
                                    - !Ref 'FSxFileSystemId'
                                    - ' -FSxRegion '
                                    - !Ref 'AWS::Region'
                                    - ' -Stackname '
                                    - !Ref 'AWS::StackName'
                                    - ' -Parentstackname '
                                    - !Ref 'ParentStackName'
                                    - ' -ResourceID ValidationNode2'
                                    - ' -WaitHandler '
                                    - '"'
                                    - Fn::Base64: !Ref 'ValidationNode2WaitHandler'
                                    - '"'
                                    - '"'
                            waitAfterCompletion: '0'
                        c-signal-resource:
                            command: !Sub 'cfn-signal.exe -e %ERRORLEVEL% --resource ValidationNode2
                                --stack ${AWS::StackName} --region ${AWS::Region}'
                            waitAfterCompletion: '0'
        Properties:
            ImageId: !Ref 'AMI'
            InstanceType: !Ref 'InstanceType'
            IamInstanceProfile: !Ref 'ValidationInstanceProfile'
            LaunchTemplate:
                LaunchTemplateId: !Ref 'DisableIMDSv1'
                Version: !GetAtt 'DisableIMDSv1.DefaultVersionNumber'
            NetworkInterfaces:
                - DeviceIndex: '0'
                  SubnetId: !Ref 'SubnetID'
                  GroupSet:
                      - !Ref 'DomainMemberSG'
            KeyName: !Ref 'KeyPairName'
            InstanceInitiatedShutdownBehavior: terminate
            UserData: !Base64
                Fn::Join:
                    - ''
                    - - "<powershell>\n"
                      - '[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls -bor [Net.SecurityProtocolType]::Tls11 -bor [Net.SecurityProtocolType]::Tls12'
                      - "\n"
                      - '$token = Invoke-RestMethod -Headers @{"X-aws-ec2-metadata-token-ttl-seconds" = "21600"} -Method PUT -Uri "http://169.254.169.254/latest/api/token" '
                      - "\n"
                      - '$instanceID = Invoke-RestMethod -Headers @{"X-aws-ec2-metadata-token" = $token} -Method GET -Uri http://169.254.169.254/latest/meta-data/instance-id'
                      - "\n"
                      - '$FailureReason = "CF endpoint is not reachable. Check your subnet outbound connectivity."'
                      - "\n"
                      - 'try {'
                      - "\n"
                      - '$progressPreference = "silentlyContinue"'
                      - "\n"
                      - "$Response = Invoke-WebRequest -Uri 'https://cloudformation."
                      - !Ref 'AWS::Region'
                      - ".amazonaws.com' -UseBasicParsing"
                      - "\n"
                      - '$StatusCode = $Response.StatusCode'
                      - "\n"
                      - '}'
                      - "\n"
                      - 'catch { '
                      - "\n"
                      - "Write-Output $_"
                      - "\n"
                      - '$StatusCode = 0'
                      - "\n"
                      - '}'
                      - "\n"
                      - 'Write-Output $StatusCode'
                      - "\n"
                      - 'if ($StatusCode -eq 200) {'
                      - "\n"
                      - 'try {'
                      - "\n"
                      - 'Get-Service AmazonSSMAgent -ErrorAction Stop'
                      - "\n"
                      - '}catch{'
                      - "\n"
                      - '[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls -bor [Net.SecurityProtocolType]::Tls11 -bor [Net.SecurityProtocolType]::Tls12'
                      - "\n"
                      - '$progressPreference = "silentlyContinue"'
                      - "\n"
                      - 'Invoke-WebRequest `https://amazon-ssm-'
                      - !Ref 'AWS::Region'
                      - '.s3.'
                      - !Ref 'AWS::Region'
                      - '.amazonaws.com/latest/windows_amd64/AmazonSSMAgentSetup.exe ` -OutFile C:\SSMAgent_latest.exe'
                      - "\n"
                      - '}'
                      - "\n"
                      - 'cfn-init.exe -v -c config -s '
                      - !Ref 'AWS::StackId'
                      - ' -r ValidationNode2'
                      - ' --region '
                      - !Ref 'AWS::Region'
                      - "\n"
                      - 'shutdown /s'
                      - '}'
                      - 'else {'
                      - "\n"
                      - "Start-Process 'cfn-signal.exe' -ArgumentList '-e 1 -r $FailureReason "
                      - Fn::Base64: !Ref 'ValidationNode2WaitHandler'
                      - "' -Wait -NoNewWindow "
                      - "\n"
                      - 'Send-CFNResourceSignal -StackName '
                      - !Ref 'AWS::StackId'
                      - ' -Status FAILURE -LogicalResourceId ValidationNode2 '
                      - '-UniqueId $instanceID'
                      - "\n"
                      - 'shutdown /s'
                      - "}\n"
                      - '</powershell>'
