AWSTemplateFormatVersion: '2010-09-09'
Description: This template creates AWS resources for validating Active Directory credentials
            under the provided VPC. You will be billed for the AWS resources used if you create
            a stack from this template.
Metadata:
    AWS::CloudFormation::Interface:
        ParameterGroups:
            - Label:
                  default: Network Configuration
              Parameters:
                  - VPCID
                  - SubnetID
                  - DNSIpAddresses
                  - Ec2RoleName
            - Label:
                  default: Amazon EC2 Configuration
              Parameters:
                  - KeyPairName
            - Label:
                  default: Microsoft Active Directory Configuration
              Parameters:
                  - PerformADCheck
                  - DomainDNSName
                  - DomainAdminUser
                  - DomainAdminSecretName
            - Label:
                  default: Amazon FSx for ONTAP Volume Configuration
              Parameters:
                  - PerformFSxCheck
                  - FSxFileSystemId
                  - FSxAdministratorPasswordSecret
            - Label:
                  default: AWS Launch Wizard Configuration
              Parameters:
                  - EnableCloudWatchLogFeature
                  - ParentStackName
        ParameterLabels:
            UniqueID:
                default: Unique ID for your resource tags
            AMI:
                default: AMI ID of the validation node
            DomainAdminSecretName:
                default: Domain Admin password secret string name
            DomainAdminUser:
                default: Domain Admin user name
            DomainDNSName:
                default: Domain DNS name
            DNSIpAddresses:
                default: AD DNS server1 IP address
            KeyPairName:
                default: Key pair Name
            SubnetID:
                default: Subnet ID
            PurposeTag:
                default: Tag your instances with purpose
            VPCID:
                default: VPC ID
            Ec2RoleName:
                default: Role name for EC2 instance profile
            PerformADCheck:
                default: Boolean to check whether to perform Directory check
            EnableCloudWatchLogFeature:
                default: (optional) Enable monitoring by CloudWatch Logging
            ParentStackName:
                default: Stack name for parent cloudFormation stack
            PerformFSxCheck:
                default: Boolean to check whether to validate FSx for ONTAP credentials and reachability from subnet
            FSxFileSystemId:
                default: FSx for ONTAP Filesystem ID
            FSxAdministratorPasswordSecret:
                default: Secret String for FSx for ONTAP user account
Parameters:
    UniqueID:
        Default: UID123
        Description: Automation execution unique ID.
        Type: String
    AMI:
        Type: String
        Default: ami-061d37dd032d5c737
    DomainAdminSecretName:
        Description: Secret string name for the domain admin password.
        Type: String
    DomainAdminUser:
        Description: User name for the account that will be used as Domain Administrator.
            This is separate from the default "Administrator" account.
        MaxLength: '20'
        MinLength: '5'
        Type: String
    DomainDNSName:
        Description: Fully qualified domain name (FQDN). For example, example.com.
        MaxLength: '255'
        MinLength: '2'
        Type: String
    DNSIpAddresses:
        Default: ''
        Description: Fixed private IPs for the Active Directory server.
        Type: String
    KeyPairName:
        Description: Public/private key pairs allow you to securely connect to your instance
            after it launches.
        Type: AWS::EC2::KeyPair::KeyName
    SubnetID:
        Description: ID of private subnet in an Availability Zone 1 for the workload (For example,
            subnet-a0246dcd).
        Type: AWS::EC2::Subnet::Id
    VPCID:
        Description: ID of the VPC (for example, vpc-0343606e).
        Type: AWS::EC2::VPC::Id
    Ec2RoleName:
        Default: AmazonEC2RoleForLaunchWizard
        Description: Role name for EC2 instance profile.
        Type: String
    PerformADCheck:
        AllowedValues:
            - 'true'
            - 'false'
        Default: 'false'
        Description: If AWS CloudWatch logging is enabled.
        Type: String
    EnableCloudWatchLogFeature:
        Default: false
        Description: Enable AWS CloudWatch logging.
        Type: String
    ParentStackName:
        Description: Stack name for the parent CloudFormation stack.
        Type: String
    PerformFSxCheck:
        AllowedValues:
            - 'true'
            - 'false'
        Default: 'false'
        Description: A boolean to check whether to validate FSx for ONTAP credentials and reachability from the subnet.
        Type: String
    FSxFileSystemId:
        Description: ID for the FSx for ONTAP file system.
        Type: String
    FSxAdministratorPasswordSecret:
        Description: Secret string for the FSx for ONTAP user account.
        Type: String
Conditions:
    isGovRegion: !Or
        - !Equals
          - us-gov-west-1
          - !Ref 'AWS::Region'
        - !Equals
          - us-gov-east-1
          - !Ref 'AWS::Region'
    ADCheckEnabled: !Equals
        - !Ref 'PerformADCheck'
        - 'true'
    ADCheckNotEnabled: !Equals
        - !Ref 'PerformADCheck'
        - 'false'
    CreateNewRole: !Equals
        - !Ref 'Ec2RoleName'
        - ''
    LogFeatureEnabled: !Equals
        - !Ref 'EnableCloudWatchLogFeature'
        - 'true'
Resources:
    ValidationInstanceProfile:
        Type: AWS::IAM::InstanceProfile
        Properties:
            Roles:
                - !Ref 'Ec2RoleName'
    DomainMemberSG:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupDescription: Domain Members
            VpcId: !Ref 'VPCID'
            Tags:
                - Key: ResourceGroupID
                  Value: !Ref 'UniqueID'
    DisableIMDSv1:
        Type: AWS::EC2::LaunchTemplate
        Properties:
            LaunchTemplateData:
                MetadataOptions:
                    HttpEndpoint: enabled
                    HttpTokens: required
    ValidationNode1WaitHandler:
        Type: AWS::CloudFormation::WaitConditionHandle
        Condition: ADCheckEnabled
    ValidationNode1WaitCondition:
        Type: AWS::CloudFormation::WaitCondition
        Condition: ADCheckEnabled
        Properties:
            Handle: !Ref ValidationNode1WaitHandler
            Timeout: '2700'
            Count: 1
    ValidationNode1:
        Type: AWS::EC2::Instance
        Condition: ADCheckEnabled
        CreationPolicy:
            ResourceSignal:
                Count: '1'
                Timeout: PT45M
        Metadata:
            AWS::CloudFormation::Init:
                configSets:
                    config:
                        - ConfigureCWLogs
                        - FetchResources
                        - LaunchWizardCFNSetup
                        - Prep
                        - Finalize               
                ConfigureCWLogs:
                    files:
                        C:\Program Files\Amazon\SSM\Plugins\awsCloudWatch\AWS.EC2.Windows.CloudWatch.json:
                            content: !If
                                - LogFeatureEnabled
                                - !Join
                                  - ''
                                  - - '{'
                                    - '  "IsEnabled" : true,'
                                    - '  "EngineConfiguration" : {'
                                    - '    "PollInterval" : "00:00:05",'
                                    - '    "Components" : [{'
                                    - '      "Id" : "ApplicationEventLog",'
                                    - '      "FullName" : "AWS.EC2.Windows.CloudWatch.EventLog.EventLogInputComponent,AWS.EC2.Windows.CloudWatch",'
                                    - '      "Parameters" : {'
                                    - '        "LogName" : "Application",'
                                    - '        "Levels" : "7"'
                                    - '      }'
                                    - '    },'
                                    - '    {'
                                    - '      "Id": "CfnInitLog",'
                                    - '      "FullName": "AWS.EC2.Windows.CloudWatch.CustomLog.CustomLogInputComponent,AWS.EC2.Windows.CloudWatch",'
                                    - '      "Parameters": {'
                                    - '        "LogDirectoryPath": "C:\\cfn\\log",'
                                    - '        "LogName" : "CfnInit",'
                                    - '        "Levels" : "7",'
                                    - '        "TimestampFormat": "yyyy-MM-dd HH:mm:ss,fff",'
                                    - '        "Encoding": "ASCII",'
                                    - '        "CultureName": "en-US",'
                                    - '        "TimeZoneKind": "Local"'
                                    - '      }'
                                    - '    },'
                                    - '    {'
                                    - '      "Id": "CloudWatchCfnInitLog",'
                                    - '      "FullName": "AWS.EC2.Windows.CloudWatch.CloudWatchLogsOutput,AWS.EC2.Windows.CloudWatch",'
                                    - '      "Parameters": {'
                                    - '        "AccessKey": "",'
                                    - '        "SecretKey": "",'
                                    - !Sub '        "Region": "${AWS::Region}",'
                                    - !Sub '        "LogGroup": "${ParentStackName}",'
                                    - '        "LogStream": "{instance_id}"'
                                    - '      }'
                                    - '    },'
                                    - '    {'
                                    - '      "Id" : "CloudWatch",'
                                    - '      "FullName" : "AWS.EC2.Windows.CloudWatch.CloudWatch.CloudWatchOutputComponent,AWS.EC2.Windows.CloudWatch",'
                                    - '      "Parameters" : {'
                                    - '        "AccessKey" : "",'
                                    - '        "SecretKey" : "",'
                                    - !Sub '        "Region": "${AWS::Region}",'
                                    - '        "NameSpace" : "Windows/Default"'
                                    - '      }'
                                    - '    }],'
                                    - '    "Flows": {'
                                    - '      "Flows": ['
                                    - '        "CfnInitLog,CloudWatchCfnInitLog"'
                                    - '      ]'
                                    - '    }'
                                    - '  }'
                                    - '}'
                                - ' { "IsEnabled" : false}'
                    commands:
                        a-enableSSM:
                            command: powershell.exe -Command "Set-Service -Name AmazonSSMAgent -StartupType
                                Automatic"
                            waitAfterCompletion: '30'
                        b-restartSSMScript:
                            command: echo try{Restart-Service AmazonSSMAgent -Force -ErrorAction Continue}catch{Write-Host $_.exception} > C:/restart-ssm.ps1
                            waitAfterCompletion: '0'
                        c-restartSSM:
                            command: powershell.exe -Command C:/restart-ssm.ps1
                            waitAfterCompletion: '30'
                FetchResources:
                    files:
                        C:\cfn\scripts\Unzip-Archive.ps1:
                            source: {{ ScriptUnzipArchive }}
                        C:\cfn\modules\AWSLaunchWizardForCFN.zip:
                            source: {{ AmazonLaunchWizardForCFN }}
                        C:\cfn\scripts\Validate-VPC.ps1:
                            source: {{ ScriptVpcCheck }}
                        C:\cfn\scripts\Update-DNSServers.ps1:
                            source: {{ ScriptUpdateDnsServers }}
                        C:\cfn\scripts\Rename-Computer.ps1:
                            source: {{ ScriptRenameComputer }}
                        C:\cfn\scripts\Restart-Computer.ps1:
                            source: {{ ScriptRestartComputer }}
                        C:\cfn\scripts\Validate-Credentials.ps1:
                            source: {{ ScriptAdValidation }}
                        C:\cfn\scripts\Validate-FsxConnectivity.ps1:
                            source: {{ ScriptFSxValidation }}
                LaunchWizardCFNSetup:
                    commands:
                        b-unpack-launchwizard-module:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\modules\AWSLaunchWizardForCFN.zip -Destination C:\Windows\system32\WindowsPowerShell\v1.0\Modules\
                            waitAfterCompletion: '0'
                Prep:
                    commands:
                        a-update-DNS:
                            command: !Join
                                - ''
                                - - powershell.exe -Command "C:\cfn\scripts\Update-DNSServers.ps1
                                    -DNSIpAddresses '
                                  - !Ref 'DNSIpAddresses'
                                  - '''"'
                            waitAfterCompletion: '0'
                Finalize:
                    commands:
                        a-validate-vpc:
                            command: !Join
                                - ''
                                - - 'powershell.exe -Command "C:\cfn\scripts\Validate-VPC.ps1 -subnet '
                                  - !Ref 'SubnetID'
                                  - ' -region '
                                  - !Ref 'AWS::Region'
                                  - ' -Stackname '
                                  - !Ref 'AWS::StackName'
                                  - ' -ResourceID ValidationNode1'
                                  - ' -WaitHandler '
                                  - '"'
                                  - Fn::Base64: !Ref 'ValidationNode1WaitHandler'
                                  - '"'
                                  - '"'
                            waitAfterCompletion: '0'
                        b-validate-ad:
                            command: !Join
                                - ''
                                - - 'powershell.exe -Command "C:\cfn\scripts\Validate-Credentials.ps1 -DomainName '
                                  - !Ref 'DomainDNSName'
                                  - ' -UserName '
                                  - !Ref 'DomainAdminUser'
                                  - ' -DomainAdminSecretName '
                                  - !Ref 'DomainAdminSecretName'
                                  - ' -isSecretManagerSupported  1'
                                  - ' -Stackname '
                                  - !Ref 'AWS::StackName'
                                  - ' -ResourceID ValidationNode1'
                                  - ' -WaitHandler '
                                  - '"'
                                  - Fn::Base64: !Ref 'ValidationNode1WaitHandler'
                                  - '"'
                                  - '"'
                            waitAfterCompletion: '0'
                        c-validate-fsx:
                            command: !Join
                                  - ''
                                  - - 'powershell.exe -Command "C:\cfn\scripts\Validate-FsxConnectivity.ps1 -PerformFSxCheck '
                                    - !Ref 'PerformFSxCheck'
                                    - ' -FSxFileSystemId '
                                    - !Ref 'FSxFileSystemId'
                                    - ' -FSxRegion '
                                    - !Ref 'AWS::Region'
                                    - ' -FSxAdministratorPasswordSecret '
                                    - !Ref 'FSxAdministratorPasswordSecret'
                                    - ' -Stackname '
                                    - !Ref 'AWS::StackName'
                                    - ' -ResourceID ValidationNode1'
                                    - ' -WaitHandler '
                                    - '"'
                                    - Fn::Base64: !Ref 'ValidationNode1WaitHandler'
                                    - '"'
                                    - '"'
                        d-signal-resource:
                            command: !Sub 'cfn-signal.exe -e %ERRORLEVEL% --resource ValidationNode1
                                --stack ${AWS::StackName} --region ${AWS::Region}'
                            waitAfterCompletion: '0'
        Properties:
            ImageId: !Ref 'AMI'
            IamInstanceProfile: !Ref 'ValidationInstanceProfile'
            LaunchTemplate:
                LaunchTemplateId: !Ref 'DisableIMDSv1'
                Version: !GetAtt 'DisableIMDSv1.DefaultVersionNumber'
            InstanceType: t2.micro
            NetworkInterfaces:
                - DeviceIndex: '0'
                  SubnetId: !Ref 'SubnetID'
                  GroupSet:
                      - !Ref 'DomainMemberSG'
            KeyName: !Ref 'KeyPairName'
            InstanceInitiatedShutdownBehavior: stop
            UserData: !Base64
                Fn::Join:
                    - ''
                    - - "<powershell>\n"
                      - '[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls -bor [Net.SecurityProtocolType]::Tls11 -bor [Net.SecurityProtocolType]::Tls12'
                      - "\n"
                      - '$token = Invoke-RestMethod -Headers @{"X-aws-ec2-metadata-token-ttl-seconds" = "21600"} -Method PUT -Uri "http://169.254.169.254/latest/api/token" '
                      - "\n"
                      - '$instanceID = Invoke-RestMethod -Headers @{"X-aws-ec2-metadata-token" = $token} -Method GET -Uri http://169.254.169.254/latest/meta-data/instance-id'
                      - "\n"
                      - '$FailureReason = "CF endpoint is not reachable. Check your subnet outbound connectivity."'
                      - "\n"
                      - 'try {'
                      - "\n"
                      - "$Response = Invoke-WebRequest -Uri 'https://cloudformation."
                      - !Ref 'AWS::Region'
                      - ".amazonaws.com' -UseBasicParsing"
                      - "\n"
                      - '$StatusCode = $Response.StatusCode'
                      - "\n"
                      - '}'
                      - "\n"
                      - 'catch { '
                      - "\n"
                      - "Write-Output $_"
                      - "\n"
                      - '$StatusCode = 0'
                      - "\n"
                      - '}'
                      - "\n"
                      - 'Write-Output $StatusCode'
                      - "\n"
                      - 'if ($StatusCode -eq 200) {'
                      - "\n"
                      - 'cfn-init.exe -v -c config -s '
                      - !Ref 'AWS::StackId'
                      - ' -r ValidationNode1'
                      - ' --region '
                      - !Ref 'AWS::Region'
                      - "\n"
                      - 'shutdown /s'
                      - '}'
                      - 'else {'
                      - "\n"
                      - "Start-Process 'cfn-signal.exe' -ArgumentList '-e 1 -r $FailureReason "
                      - Fn::Base64: !Ref 'ValidationNode1WaitHandler'
                      - "' -Wait -NoNewWindow "
                      - "\n"
                      - 'Send-CFNResourceSignal -StackName '
                      - !Ref 'AWS::StackId'
                      - ' -Status FAILURE -LogicalResourceId ValidationNode1 '
                      - '-UniqueId $instanceID'
                      - "\n"
                      - 'shutdown /s'
                      - "}\n"
                      - '</powershell>'
    ValidationNode2WaitHandler:
        Type: AWS::CloudFormation::WaitConditionHandle
        Condition: ADCheckNotEnabled
    ValidationNode2WaitCondition:
        Type: AWS::CloudFormation::WaitCondition
        Condition: ADCheckNotEnabled
        Properties:
            Handle: !Ref ValidationNode2WaitHandler
            Timeout: '900'
            Count: 1
    ValidationNode2:
        Type: AWS::EC2::Instance
        Condition: ADCheckNotEnabled
        CreationPolicy:
            ResourceSignal:
                Count: '1'
                Timeout: PT15M
        Metadata:
            AWS::CloudFormation::Init:
                configSets:
                    config:
                        - ConfigureCWLogs
                        - FetchResources
                        - LaunchWizardCFNSetup
                        - Finalize
                ConfigureCWLogs:
                    files:
                        C:\Program Files\Amazon\SSM\Plugins\awsCloudWatch\AWS.EC2.Windows.CloudWatch.json:
                            content: !If
                                - LogFeatureEnabled
                                - !Join
                                  - ''
                                  - - '{'
                                    - '  "IsEnabled" : true,'
                                    - '  "EngineConfiguration" : {'
                                    - '    "PollInterval" : "00:00:05",'
                                    - '    "Components" : [{'
                                    - '      "Id" : "ApplicationEventLog",'
                                    - '      "FullName" : "AWS.EC2.Windows.CloudWatch.EventLog.EventLogInputComponent,AWS.EC2.Windows.CloudWatch",'
                                    - '      "Parameters" : {'
                                    - '        "LogName" : "Application",'
                                    - '        "Levels" : "7"'
                                    - '      }'
                                    - '    },'
                                    - '    {'
                                    - '      "Id": "CfnInitLog",'
                                    - '      "FullName": "AWS.EC2.Windows.CloudWatch.CustomLog.CustomLogInputComponent,AWS.EC2.Windows.CloudWatch",'
                                    - '      "Parameters": {'
                                    - '        "LogDirectoryPath": "C:\\cfn\\log",'
                                    - '        "TimestampFormat": "yyyy-MM-dd HH:mm:ss,fff",'
                                    - '        "Encoding": "ASCII",'
                                    - '        "Filter": "cfn-init.log",'
                                    - '        "CultureName": "en-US",'
                                    - '        "TimeZoneKind": "Local"'
                                    - '      }'
                                    - '    },'
                                    - '    {'
                                    - '      "Id": "CloudWatchCfnInitLog",'
                                    - '      "FullName": "AWS.EC2.Windows.CloudWatch.CloudWatchLogsOutput,AWS.EC2.Windows.CloudWatch",'
                                    - '      "Parameters": {'
                                    - '        "AccessKey": "",'
                                    - '        "SecretKey": "",'
                                    - !Sub '        "Region": "${AWS::Region}",'
                                    - !Sub '        "LogGroup": "${ParentStackName}",'
                                    - '        "LogStream": "{instance_id}"'
                                    - '      }'
                                    - '    },'
                                    - '    {'
                                    - '      "Id" : "CloudWatch",'
                                    - '      "FullName" : "AWS.EC2.Windows.CloudWatch.CloudWatch.CloudWatchOutputComponent,AWS.EC2.Windows.CloudWatch",'
                                    - '      "Parameters" : {'
                                    - '        "AccessKey" : "",'
                                    - '        "SecretKey" : "",'
                                    - !Sub '        "Region": "${AWS::Region}",'
                                    - '        "NameSpace" : "Windows/Default"'
                                    - '      }'
                                    - '    }],'
                                    - '    "Flows": {'
                                    - '      "Flows": ['
                                    - '        "CfnInitLog,CloudWatchCfnInitLog"'
                                    - '      ]'
                                    - '    }'
                                    - '  }'
                                    - '}'
                                - ' { "IsEnabled" : false}'
                    commands:
                        a-enableSSM:
                            command: powershell.exe -Command "Set-Service -Name AmazonSSMAgent -StartupType
                                Automatic"
                            waitAfterCompletion: '30'
                        b-restartSSMScript:
                            command: echo try{Restart-Service AmazonSSMAgent -Force -ErrorAction Continue}catch{Write-Host $_.exception} > C:/restart-ssm.ps1
                            waitAfterCompletion: '0'
                        c-restartSSM:
                            command: powershell.exe -Command C:/restart-ssm.ps1
                            waitAfterCompletion: '30'
                FetchResources:
                    files:
                        C:\cfn\scripts\Unzip-Archive.ps1:
                            source: {{ ScriptUnzipArchive }}
                        C:\cfn\modules\AWSLaunchWizardForCFN.zip:
                            source: {{ AmazonLaunchWizardForCFN }}
                        C:\cfn\scripts\Validate-VPC.ps1:
                            source: {{ ScriptVpcCheck }}
                        C:\cfn\scripts\Validate-FsxConnectivity.ps1:
                            source: {{ ScriptFSxValidation }}
                LaunchWizardCFNSetup:
                    commands:
                        b-unpack-launchwizard-module:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\modules\AWSLaunchWizardForCFN.zip -Destination C:\Windows\system32\WindowsPowerShell\v1.0\Modules\
                            waitAfterCompletion: '0'
                Finalize:
                    commands:
                        a-validate-vpc:
                            command: !Join
                                - ''
                                - - 'powershell.exe -Command "C:\cfn\scripts\Validate-VPC.ps1 -subnet '
                                  - !Ref 'SubnetID'
                                  - ' -region '
                                  - !Ref 'AWS::Region'
                                  - ' -Stackname '
                                  - !Ref 'AWS::StackName'
                                  - ' -ResourceID ValidationNode2'
                                  - ' -WaitHandler '
                                  - '"'
                                  - Fn::Base64: !Ref 'ValidationNode2WaitHandler'
                                  - '"'
                                  - '"'
                            waitAfterCompletion: '0'
                        b-validate-fsx:
                            command: !Join
                                  - ''
                                  - - 'powershell.exe -Command "C:\cfn\scripts\Validate-FsxConnectivity.ps1 -PerformFSxCheck '
                                    - !Ref 'PerformFSxCheck'
                                    - ' -FSxFileSystemId '
                                    - !Ref 'FSxFileSystemId'
                                    - ' -FSxRegion '
                                    - !Ref 'AWS::Region'
                                    - ' -FSxAdministratorPasswordSecret '
                                    - !Ref 'FSxAdministratorPasswordSecret'
                                    - ' -Stackname '
                                    - !Ref 'AWS::StackName'
                                    - ' -ResourceID ValidationNode2'
                                    - ' -WaitHandler '
                                    - '"'
                                    - Fn::Base64: !Ref 'ValidationNode2WaitHandler'
                                    - '"'
                                    - '"'
                        c-signal-resource:
                            command: !Sub 'cfn-signal.exe -e %ERRORLEVEL% --resource ValidationNode2
                                --stack ${AWS::StackName} --region ${AWS::Region}'
                            waitAfterCompletion: '0'
        Properties:
            ImageId: !Ref 'AMI'
            IamInstanceProfile: !Ref 'ValidationInstanceProfile'
            LaunchTemplate:
                LaunchTemplateId: !Ref 'DisableIMDSv1'
                Version: !GetAtt 'DisableIMDSv1.DefaultVersionNumber'
            InstanceType: t2.micro
            NetworkInterfaces:
                - DeviceIndex: '0'
                  SubnetId: !Ref 'SubnetID'
                  GroupSet:
                      - !Ref 'DomainMemberSG'
            KeyName: !Ref 'KeyPairName'
            InstanceInitiatedShutdownBehavior: stop
            UserData: !Base64
                Fn::Join:
                    - ''
                    - - "<powershell>\n"
                      - '[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls -bor [Net.SecurityProtocolType]::Tls11 -bor [Net.SecurityProtocolType]::Tls12'
                      - "\n"
                      - '$token = Invoke-RestMethod -Headers @{"X-aws-ec2-metadata-token-ttl-seconds" = "21600"} -Method PUT -Uri "http://169.254.169.254/latest/api/token" '
                      - "\n"
                      - '$instanceID = Invoke-RestMethod -Headers @{"X-aws-ec2-metadata-token" = $token} -Method GET -Uri http://169.254.169.254/latest/meta-data/instance-id'
                      - "\n"
                      - '$FailureReason = "CF endpoint is not reachable. Check your subnet outbound connectivity."'
                      - "\n"
                      - 'try {'
                      - "\n"
                      - "$Response = Invoke-WebRequest -Uri 'https://cloudformation."
                      - !Ref 'AWS::Region'
                      - ".amazonaws.com' -UseBasicParsing"
                      - "\n"
                      - '$StatusCode = $Response.StatusCode'
                      - "\n"
                      - '}'
                      - "\n"
                      - 'catch { '
                      - "\n"
                      - "Write-Output $_"
                      - "\n"
                      - '$StatusCode = 0'
                      - "\n"
                      - '}'
                      - "\n"
                      - 'Write-Output $StatusCode'
                      - "\n"
                      - 'if ($StatusCode -eq 200) {'
                      - "\n"
                      - 'cfn-init.exe -v -c config -s '
                      - !Ref 'AWS::StackId'
                      - ' -r ValidationNode2'
                      - ' --region '
                      - !Ref 'AWS::Region'
                      - "\n"
                      - 'shutdown /s'
                      - '}'
                      - 'else {'
                      - "\n"
                      - "Start-Process 'cfn-signal.exe' -ArgumentList '-e 1 -r $FailureReason "
                      - Fn::Base64: !Ref 'ValidationNode2WaitHandler'
                      - "' -Wait -NoNewWindow "
                      - "\n"
                      - 'Send-CFNResourceSignal -StackName '
                      - !Ref 'AWS::StackId'
                      - ' -Status FAILURE -LogicalResourceId ValidationNode2 '
                      - '-UniqueId $instanceID'
                      - "\n"
                      - 'shutdown /s'
                      - "}\n"
                      - '</powershell>'
