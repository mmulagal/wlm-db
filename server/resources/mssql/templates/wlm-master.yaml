#prettier-ignore
---
AWSTemplateFormatVersion: "2010-09-09"
Description: This template deploys Windows SQL Server in the chosen deployment model (failover cluster instances or a standalone instance). 
            This template creates an Amazon EC2 Windows instance and related resources.
            You will be billed for the AWS resources used if you create a stack from this template.
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Network Configuration
        Parameters:
          - VPCID
          - VPCCIDR
          - PrivateSubnet1ID
          - RouteTable1Id
          - PrivateSubnet2ID
          - RouteTable2Id
          - S3EndpointExists
          - CloudformationEndpointExists
          - SsmEndpointExists
          - SqsEndpointExists
          - Ec2MessagesEndpointExists
          - SSMMessagesEndpointExists
          - S3EndpointRouteTables
      - Label:
          default: Amazon EC2 Configuration
        Parameters:
          - WorkloadInstanceType
          - NodeNetBIOSNames
          - KeyPairName
          - ValidationAmi
          - ValidationNodeInstanceType
          - CfDeployRoleName
          - EBSVolumeSize
      - Label:
          default: Microsoft Active Directory Configuration
        Parameters:
          - ADScenarioType
          - DomainDNSName
          - DomainAdminUser
          - DomainAdminPassword
          - DNSIpAddresses
          - DomainMemberSGID
      - Label:
          default: Amazon FSx for ONTAP configuration
        Parameters: 
          - DeploymentMode
          - FSxFileSystemName
          - FSxFileSystemId
          - FSxAdminUsername
          - FSxAdminPassword
          - FSxSvmName
          - FSxStorageCapacity
          - FSxDataVolumeName
          - FSxDataVolumeSize
          - FSxLogVolumeName
          - FSxLogVolumeSize
          - FSxTempDbVolumeName
          - FSxTempDbVolumeSize
          - FSxQuorumVolumeName
          - FSxQuorumVolumeSize
          - FSxDataLunSize
          - FSxVolumeThroughputCapacity
          - SQLigroupname
          - ONTAPSecurityGroupID
          - FileSystemEncryptionKeyId
          - FSxDiskIops
          - SQLSvmName
          - FsxVolumeSnapshotPolicy
      - Label:
          default: Microsoft SQL Server Configuration
        Parameters:
          - SQLDeploymentMode
          - SQLAMIID
          - SQLServiceAccountName
          - SQLServiceAccountPassword
          - SqlFSxWSFCName
          - SqlServerName
          - SqlCollation
          - IsCustomAmi
      - Label:
          default: CloudWatch, SNS Topic and Resource Tags configuration
        Parameters:
          - EnableCloudWatchLogFeature
          - NotificationARN
      - Label:
          default: WLM SQL Assets Configuration
        Parameters:
          - MSSQLMediaBucketName
          - MSSQLMediaPathKey
      - Label:
          default: Custom Resource configuration ( DO NOT EDIT )
        Parameters:
          - AccountId
          - CloudProviderAccountId
          - RoleCredentialsId
          - JwtToken
          - EncryptedFsxPassword
    ParameterLabels:
      DeploymentMode:
        default: File system deployment mode
      ApplicationName:
        default: Application name
      CfDeployRoleName:
        default: CloudFormation deployment role name
      UniqueID:
        default: Unique ID for WLMDB SQL resource group
      ADScenarioType:
        default: AD scenario type
      DNSIpAddresses:
        default: DNS IP addresses
      DomainAdminUser:
        default: Domain admin user name
      DomainAdminPassword:
        default: Domain admin password
      DomainDNSName:
        default: Domain DNS name
      SqlFSxWSFCName:
        default: Windows Server Failover Cluster name
      KeyPairName:
        default: Key pair name
      SQLAMIID:
        default: SQL server version
      SQLServiceAccountName:
        default: Service account name
      SQLServiceAccountPassword:
        default: Service account password
      SQLigroupname:
        default: SQL igroup name
      SqlServerName:
        default: SQL server name
      SqlCollation:
        default: SQL Server Collation
      IsCustomAmi:
        default: Boolean to indicate if AMI includes SQL license or BYOL license
      EBSVolumeSize:
        default: Size of the EBS Volume.
      VPCName:
        default: Name of VPC
      VPCCIDR:
        default: VPC CIDR
      VPCID:
        default: VPC ID
      FSxStorageCapacity:
        default: FSx for ONTAP storage capacity
      PrivateSubnet1ID:
        default: Private subnet ID for the first SQL node, for example, subnet-000dc866d93550eb0 
      PrivateSubnet2ID:
        default: Private subnet ID for the second SQL node, for example, subnet-000dc866d93550eb0 
      RouteTable1Id:
        default: ID of the route table for private subnet 1.
      RouteTable2Id:
        default: ID of the route table for private subnet 2.
      WorkloadInstanceType:
        default: Instance type for cluster nodes
      NodeNetBIOSNames:
        default: NetBIOS names of cluster nodes
      ONTAPSecurityGroupID:
        default: Security Group ID for FSx for ONTAP
      SQLSvmName:
        default: SVM for creating SQL volumes 
      FSxDiskIops:
        default: Provisioned SSD IOPS  
      FsxVolumeSnapshotPolicy:
        default: Snapshot policy for the volume
      EnableCloudWatchLogFeature:
        default: (optional) Enable monitoring by CloudWatch Logging
      NotificationARN:
        default: (optional) Notification ARN
      ValidationAmi:
       default: Validation node AMI image ID
      ValidationNodeInstanceType:
       default: Validation node instance type
      SQLDeploymentMode:
        default: SQL server deployment mode
      S3EndpointExists:
        default: Boolean to check if an S3 endpoint exists in the vpc.
      CloudformationEndpointExists:
        default: Boolean to check if a Cloudformation endpoint exists in the vpc.
      SsmEndpointExists:
        default: Boolean to check if a SSM endpoint exists in the vpc.
      SqsEndpointExists:
        default: Boolean to check if a SQS endpoint exists in the vpc.
Parameters: 
  UniqueID:
    Description: Automation execution unique ID.
    Type: String 

  {{{DeploymentMode}}}
  
  {{{SQLDeploymentMode}}}
        
  {{{CfDeployRoleName}}}

  {{{ADScenarioType}}}

  {{{DNSIpAddresses}}}

  {{{DomainAdminUser}}}

  {{{DomainAdminPassword}}}

  {{{DomainDNSName}}}

  {{{DomainMemberSGID}}}

  {{{KeyPairName}}}

  {{{MSSQLMediaBucketName}}}

  {{{MSSQLMediaPathKey}}}

  {{{SQLAMIID}}}

  {{{SQLServiceAccountName}}}
  
  {{{SQLServiceAccountPassword}}}

  {{{SQLigroupname}}}

  {{{SqlServerName}}}

  {{{SqlCollation}}}

  {{{IsCustomAmi}}}

  {{{EBSVolumeSize}}}

  {{{SqlFSxWSFCName}}}

  {{{VPCCIDR}}}

  {{{PrivateSubnet1ID}}}

  {{{PrivateSubnet2ID}}}

  {{{RouteTable1Id}}}
  
  {{{RouteTable2Id}}}
  
  {{{SQLSvmName}}}

  {{{WorkloadInstanceType}}}

  {{{NodeNetBIOSNames}}}
  
  {{{FSxStorageCapacity}}}
  
  {{{FSxDataVolumeSize}}}

  {{{FSxDataVolumeName}}}
  
  {{{FSxLogVolumeName}}}
  
  {{{FSxLogVolumeSize}}}
  
  {{{FSxTempDbVolumeName}}}
  
  {{{FSxTempDbVolumeSize}}}
  
  {{{FSxQuorumVolumeName}}}
  
  {{{FSxQuorumVolumeSize}}}

  {{{FSxDataLunSize}}}

  {{{FSxAdminUsername}}}
         
  {{{FSxAdminPassword}}}

  {{{FSxSvmName}}}
  
  {{{FSxFileSystemName}}}

  {{{FSxFileSystemId}}}
  
  {{{FSxDiskIops}}}
  
  {{{FSxVolumeThroughputCapacity}}}
  
  {{{FileSystemEncryptionKeyId}}}

  {{{FsxVolumeSnapshotPolicy}}}
  
  {{{VPCID}}}
  
  {{{ONTAPSecurityGroupID}}}
  
  {{{EnableCloudWatchLogFeature}}}

  {{{NotificationARN}}}
  
  {{{ValidationAmi}}}

  {{{ValidationNodeInstanceType}}}
  
  {{{RoleCredentialsId}}}
  
  {{{AccountId}}}
    
  {{{CloudProviderAccountId}}}
  
  {{{JwtToken}}}

  {{{EncryptedFsxPassword}}}
  
  {{{WlmdbAwsAccountId}}}
  
  {{{Metrics}}}

  {{{S3EndpointExists}}}

  {{{CloudformationEndpointExists}}}

  {{{SsmEndpointExists}}}

  {{{SqsEndpointExists}}}

  {{{CloudwatchLogsEndpointExists}}}

  {{{FsxEndpointExists}}}

  {{{Ec2EndpointExists}}}

  {{{Ec2MessagesEndpointExists}}}

  {{{SSMMessagesEndpointExists}}}

  {{{S3EndpointRouteTables}}}
       
Conditions:
  UseAWSDirectoryServiceEE:
    Fn::Equals:
      - Ref: ADScenarioType
      - AWS_MANAGED_AD
  NewOntapFsx: !Equals [!Ref "FSxFileSystemId", ""]
  ExistingOntapFsx:
    Fn::Not:
    - Condition: NewOntapFsx
  ExcludeNotification: !Equals [!Ref "NotificationARN", ""]
  IncludeNotification: !Not [Condition: ExcludeNotification]
  IsStandalone: !Equals [!Ref SQLDeploymentMode, 'standalone']
  IsFailoverCluster: !Not [Condition: IsStandalone]
  ShouldSendSaasNotification: !Not [!Equals [!Ref "RoleCredentialsId", ""]]
Resources:
  CredentialsSsmParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /netapp/wlmdb/${AWS::StackName}
      Description: SSM Parameter for active directory, FSxN and SQL service account credentials
      Type: String
      Value: !Sub '{
                        "fsx": {
                            "username": "${FSxAdminUsername}",
                            "password": "${FSxAdminPassword}"
                        },
                        "domain": {
                            "username": "${DomainAdminUser}",
                            "password": "${DomainAdminPassword}"
                        },
                        "sql": [{
                            "username": "${SQLServiceAccountName}",
                            "password": "${SQLServiceAccountPassword}",
                            "sqlinstancename": "MSSQL"
                        }]
                    }'

  EC2IAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref 'AWS::StackName'
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
        Version: '2012-10-17'
      Path: /
      Policies:
        - PolicyDocument:
            Statement:
              - Sid: CloudWatchDeploymentStatement
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:List*
                  - cloudwatch:Get*
                  - cloudwatch:Describe*
                Resource: '*'
              - Sid: CloudLogDeploymentCreateStatement
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:CreateLogGroup
                  - logs:GetLogEvents
                  - logs:GetLogDelivery
                  - logs:GetLogRecord
                  - logs:ListLogDeliveries
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                  - logs:TagResource
                Resource: '*'
              - Sid: CloudFormationDeploymentStatement
                Effect: Allow
                Action:
                  - cloudformation:ListStacks
                  - cloudformation:SignalResource
                Resource: 
                  - arn:aws:cloudformation:*:*:stack/WLMDB*
              - Sid: STSStatement
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: '*'
              - Sid: IAMStatement
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetPolicy
                  - iam:GetRolePolicy
                  - iam:PassRole
                  - iam:GetUser
                  - iam:GetPolicyVersion
                Resource: '*'
              - Sid: SSMListStatement
                Effect: Allow
                Action:
                  - ssm:DescribeAssociation
                  - ssm:GetDeployablePatchSnapshotForInstance
                  - ssm:GetDocument
                  - ssm:DescribeDocument
                  - ssm:GetManifest
                  - ssm:ListAssociations
                  - ssm:ListInstanceAssociations
                  - ssm:GetCommandInvocation
                  - ec2messages:GetEndpoint
                  - ec2messages:GetMessages
                Resource: '*'
              - Sid: SSMCreateStatement
                Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                  - ssm:PutInventory
                  - ssm:PutComplianceItems
                  - ssm:PutConfigurePackageResult
                  - ssm:UpdateAssociationStatus
                  - ssm:UpdateInstanceAssociationStatus
                  - ssm:UpdateInstanceInformation
                  - ssm:SendCommand
                Resource: '*'
              - Sid: EC2MessagesStatement
                Effect: Allow
                Action:
                  - ec2messages:AcknowledgeMessage
                  - ec2messages:DeleteMessage
                  - ec2messages:FailMessage
                  - ec2messages:SendReply
                Resource: '*'
              - Sid: FsxStatement
                Effect: Allow
                Action:
                  - fsx:DescribeFileSystems
                  - fsx:DescribeVolumes
                  - fsx:DescribeStorageVirtualMachines
                Resource: '*'
              - Sid: EC2Statement
                Effect: Allow
                Action:
                  - ec2:Get*
                  - ec2:Describe*
                Resource: '*'
              - Sid: EC2TaggingStatement
                Effect: Allow
                Action:
                  - ec2:CreateTags
                  - ec2:AuthorizeSecurityGroupIngress
                Resource: '*'
                Condition:
                  StringLike:
                    aws:ResourceTag/aws:cloudformation:stack-name:
                      - WLMDB*
              - Sid: SSMGetPutParameter
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:PutParameter
                  - ssm:GetParametersByPath
                Resource: 'arn:aws:ssm:*:*:parameter/netapp/wlmdb/*'
          PolicyName: !Join
            - ''
            - - !Ref 'AWS::StackName'
              - WLMDB_Policy_I
  TrackStackDeployment:
    Type: Custom::MyCustomResource
    Condition: ShouldSendSaasNotification
    Properties:
      ServiceToken: !Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb'
      AccountId: !Ref AccountId
      CloudProviderAccountId: !Ref CloudProviderAccountId
      CredentialsId: !Ref RoleCredentialsId
      JWToken: !Ref JwtToken
      Region: !Ref 'AWS::Region' 
      StackName: !Ref 'AWS::StackName'
      ResourceName: !Ref 'SqlServerName'
      SQLDeploymentType: 
          !If
            - IsFailoverCluster
            - 'FCI'
            - 'Standalone'
      FileSystemType: 'FSXN'
      DatabaseType: 'Microsoft SQL server'
      Metrics: !Ref Metrics
  WaitConditionHandle:
    Type: 'AWS::CloudFormation::WaitConditionHandle'
  TrackStackDeploymentWaitConditionHandle:
    Type: 'AWS::CloudFormation::WaitConditionHandle'
    Condition: ShouldSendSaasNotification
    DependsOn: TrackStackDeployment
  TrackStackDeploymentWaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    Properties:
      Handle:
        !If
        - ShouldSendSaasNotification
        - !Ref TrackStackDeploymentWaitConditionHandle
        - !Ref WaitConditionHandle
      Timeout: '3600'
      Count: '0'
  VpcEndpointStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - TrackStackDeploymentWaitCondition
    Properties:
      TemplateURL: {{{VpcEndpointTemplate}}}
      Parameters:
        VPCId:
          Ref: VPCID
        VPCCIDR:
          Ref: VPCCIDR
        PreferredSubnetId:
          Ref: PrivateSubnet1ID
        StandbySubnetId: !If [IsFailoverCluster, !Ref PrivateSubnet2ID, !Ref AWS::NoValue]      
        S3EndpointExists:
          Ref: S3EndpointExists
        CloudformationEndpointExists:
          Ref: CloudformationEndpointExists
        SsmEndpointExists:
          Ref: SsmEndpointExists
        SqsEndpointExists:
          Ref: SqsEndpointExists
        CloudwatchLogsEndpointExists:
          Ref: CloudwatchLogsEndpointExists
        FsxEndpointExists:
          Ref: FsxEndpointExists
        Ec2EndpointExists:
          Ref: Ec2EndpointExists
        Ec2MessagesEndpointExists:
          Ref: Ec2MessagesEndpointExists
        SSMMessagesEndpointExists:
          Ref: SSMMessagesEndpointExists
        S3EndpointRouteTables:
          Ref: S3EndpointRouteTables
      NotificationARNs:
        Fn::If:
        - IncludeNotification
        - Fn::If: 
          - ShouldSendSaasNotification
          - [Ref: NotificationARN, !Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
          - [Ref: NotificationARN]
        - Fn::If: 
          - ShouldSendSaasNotification
          - [!Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
          - []
      {{{Tags}}}
  ValidationStack1:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - VpcEndpointStack
      - EC2IAMRole
    Properties:
      TemplateURL: {{{ValidationTemplate}}}
      Parameters:
        DomainAdminUser:
          Ref: DomainAdminUser
        DomainDNSName:
          Ref: DomainDNSName
        DNSIpAddresses:
          Ref: DNSIpAddresses
        KeyPairName:
          Ref: KeyPairName
        SubnetID:
          Ref: PrivateSubnet1ID
        VPCID:
          Ref: VPCID
        Ec2RoleName:
          Ref: AWS::StackName
        PerformADCheck: "true"
        AMI:
          Ref: ValidationAmi
        InstanceType:
          Ref: ValidationNodeInstanceType
        EnableCloudWatchLogFeature:
          Ref: EnableCloudWatchLogFeature
        ParentStackName:
          Ref: AWS::StackName
        PerformFSxCheck:
          Fn::If:
          - ExistingOntapFsx
          - 'true'
          - 'false'
        FSxFileSystemId: 
          Fn::If:
          - ExistingOntapFsx
          - Ref: FSxFileSystemId
          - 'fs-id'
        IsCustomAmi:
          Ref: IsCustomAmi
      NotificationARNs:
        Fn::If:
        - IncludeNotification
        - Fn::If: 
          - ShouldSendSaasNotification
          - [Ref: NotificationARN, !Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
          - [Ref: NotificationARN]
        - Fn::If: 
          - ShouldSendSaasNotification
          - [!Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
          - []
      {{{Tags}}}
  ValidationStack2:
    Type: AWS::CloudFormation::Stack
    Condition: IsFailoverCluster
    DependsOn:
      - VpcEndpointStack
      - EC2IAMRole
    Properties:
      TemplateURL: {{{ValidationTemplate}}}
      Parameters:
        DomainAdminUser:
          Ref: DomainAdminUser
        DomainDNSName:
          Ref: DomainDNSName
        DNSIpAddresses:
          Ref: DNSIpAddresses
        KeyPairName:
          Ref: KeyPairName
        SubnetID:
          Ref: PrivateSubnet2ID
        VPCID:
          Ref: VPCID
        Ec2RoleName:
          Ref: AWS::StackName
        PerformADCheck: "false"  
        AMI:
          Ref: ValidationAmi
        InstanceType:
          Ref: ValidationNodeInstanceType
        EnableCloudWatchLogFeature:
          Ref: EnableCloudWatchLogFeature
        ParentStackName:
          Ref: AWS::StackName
        PerformFSxCheck:
          Fn::If:
          - ExistingOntapFsx
          - 'true'
          - 'false'
        FSxFileSystemId: 
          Fn::If:
          - ExistingOntapFsx
          - Ref: FSxFileSystemId
          - 'fs-id'
      NotificationARNs:
        Fn::If:
        - IncludeNotification
        - Fn::If: 
          - ShouldSendSaasNotification
          - [Ref: NotificationARN, !Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
          - [Ref: NotificationARN]
        - Fn::If: 
          - ShouldSendSaasNotification
          - [!Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
          - []
      {{{Tags}}}
  FCIWaitHandler: 
    Type: AWS::CloudFormation::WaitConditionHandle
    Condition: IsFailoverCluster
    DependsOn: 
      - TrackStackDeploymentWaitCondition
      - ValidationStack2
      - ValidationStack1
  SIWaitHandler: 
    Type: AWS::CloudFormation::WaitConditionHandle
    Condition: IsStandalone
    DependsOn: 
      - TrackStackDeploymentWaitCondition
      - ValidationStack1
  WaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    Properties: 
      Handle: !If [IsFailoverCluster, !Ref FCIWaitHandler, !Ref SIWaitHandler]
      Timeout: '7200'
      Count: 0
  NewFSxStack:
    Type: AWS::CloudFormation::Stack
    Condition: NewOntapFsx
    DependsOn: WaitCondition
    Properties:
      TemplateURL: {{{ FSXNewTemplate }}}
      Parameters:
        DeploymentMode:
          Ref: DeploymentMode
        FSxFileSystemName:
          Ref: FSxFileSystemName
        FSxVolumeThroughputCapacity:
          Ref: FSxVolumeThroughputCapacity
        FSxStorageCapacity:
          Ref: FSxStorageCapacity
        FSxDataVolumeName:
          Ref: FSxDataVolumeName
        FSxDataVolumeSize:
          Ref: FSxDataVolumeSize
        FSxLogVolumeName:
          Ref: FSxLogVolumeName
        FSxLogVolumeSize:
          Ref: FSxLogVolumeSize
        FSxTempDbVolumeName:
          Ref: FSxTempDbVolumeName
        FSxTempDbVolumeSize:
          Ref: FSxTempDbVolumeSize
        FSxClusterQuorumVolumeName:
          Ref: FSxQuorumVolumeName
        FSxClusterQuorumVolumeSize:
          Ref: FSxQuorumVolumeSize
        FSxAdministratorPassword:
          Ref: FSxAdminPassword
        FSxSvmName:
          Ref: SQLSvmName
        VPCID:
          Ref: VPCID
        VPCCIDR:
          Ref: VPCCIDR
        PreferredSubnetId:
          Ref: PrivateSubnet1ID
        PreferredRouteTableId:
          Ref: RouteTable1Id
        StandbySubnetId:
          Ref: PrivateSubnet2ID
        StandbyRouteTableId:
          Ref: RouteTable2Id
        FSxKmsKeyId:
          Ref: FileSystemEncryptionKeyId
        FSxDiskIops:
          Ref: FSxDiskIops 
        ParentStackName:
          Ref: AWS::StackName
      NotificationARNs:
        Fn::If:
        - IncludeNotification
        - Fn::If: 
          - ShouldSendSaasNotification
          - [Ref: NotificationARN, !Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
          - [Ref: NotificationARN]
        - Fn::If: 
          - ShouldSendSaasNotification
          - [!Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
          - []
      {{{Tags}}}
  ExistingFSxStack:
    Type: AWS::CloudFormation::Stack
    Condition: ExistingOntapFsx
    DependsOn: WaitCondition
    Properties:
      TemplateURL: {{{FSXExistingTemplate}}}
      Parameters:
        DeploymentMode:
          Ref: DeploymentMode
        FSxSvmName:
          Ref: SQLSvmName
        FSxFileSystemId:
          Ref: FSxFileSystemId
        FSxDataVolumeName:
          Ref: FSxDataVolumeName
        FSxDataVolumeSize:
          Ref: FSxDataVolumeSize
        FSxLogVolumeName:
          Ref: FSxLogVolumeName
        FSxLogVolumeSize:
          Ref: FSxLogVolumeSize
        FSxTempDbVolumeName:
          Ref: FSxTempDbVolumeName
        FSxTempDbVolumeSize:
          Ref: FSxTempDbVolumeSize
        FSxClusterQuorumVolumeName:
          Ref: FSxQuorumVolumeName
        FSxClusterQuorumVolumeSize:
          Ref: FSxQuorumVolumeSize
      NotificationARNs:
        Fn::If:
        - IncludeNotification
        - Fn::If: 
          - ShouldSendSaasNotification
          - [Ref: NotificationARN, !Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
          - [Ref: NotificationARN]
        - Fn::If: 
          - ShouldSendSaasNotification
          - [!Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
          - []
      {{{Tags}}}
  SQLServerStack:
    Type: AWS::CloudFormation::Stack
    Condition: IsFailoverCluster
    DependsOn: WaitCondition
    Properties:
      TemplateURL: {{{SQLTemplate}}}
      Parameters:
        UniqueID:
          Ref: UniqueID
        Ec2RoleName:
          Ref: AWS::StackName
        ADDnsIpAddresses:
          Fn::Select:
            - "0"
            - Fn::Split:
                - ","
                - Ref: DNSIpAddresses
        DomainAdminUser:
          Ref: DomainAdminUser
        DomainDNSName:
          Ref: DomainDNSName
        DomainMemberSGID:
          Ref: DomainMemberSGID
        KeyPairName:
          Ref: KeyPairName
        PrivateSubnet1ID:
          Ref: PrivateSubnet1ID
        RouteTable1Id:
          Ref: RouteTable1Id
        RouteTable2Id:
          Ref: RouteTable2Id
        PrivateSubnet2ID:
          Ref: PrivateSubnet2ID
        FSxDataLunSize:
          Ref: FSxDataLunSize
        MSSQLMediaBucketName:
          Ref: MSSQLMediaBucketName
        MSSQLMediaPathKey:
          Ref: MSSQLMediaPathKey
        AMIID:
          Ref: SQLAMIID
        SqlFSxWSFCName:
          Ref: SqlFSxWSFCName
        SqlFSxFCIName:
          Ref: SqlServerName
        SqlCollation:
          Ref: SqlCollation
        EBSVolumeSize:
          Ref: EBSVolumeSize
        SQLAdminAccounts:
          Ref: SQLServiceAccountName
        VPCID:
          Ref: VPCID
        VPCCIDR:
          Ref: VPCCIDR
        WorkloadInstanceType:
          Ref: WorkloadInstanceType
        SqlFSxServerNetBIOSName1:
          Fn::Select:
            - "0"
            - Fn::Split:
                - ","
                - Ref: NodeNetBIOSNames
        SqlFSxServerNetBIOSName2:
          Fn::Select:
            - "1"
            - Fn::Split:
                - ","
                - Ref: NodeNetBIOSNames
        FSxFileSystemId:
          !If
            - NewOntapFsx
            - !GetAtt "NewFSxStack.Outputs.FSxFileSystemLogicalId"
            - !GetAtt "ExistingFSxStack.Outputs.FSxFileSystemId"
        SQLSvmName:
          Ref: SQLSvmName
        FSxDataVolumeName:
          Ref: FSxDataVolumeName
        FSxTempDbVolumeName:
          Ref: FSxTempDbVolumeName
        FSxQuorumVolumeName:
          Ref: FSxQuorumVolumeName
        FSxDataLunSize:
          Ref: FSxDataLunSize
        SQLigroupname:
          Ref: SQLigroupname
        ONTAPSecurityGroupID:
          !If
            - NewOntapFsx
            - !GetAtt "NewFSxStack.Outputs.FsxSecurityGroupID"
            - !Ref "ONTAPSecurityGroupID"
        EnableCloudWatchLogFeature:
          Ref: EnableCloudWatchLogFeature
        ParentStackName:
          Ref: AWS::StackName
        NumberOfNodes: "2"
        FSxLogVolumeName:
          Ref: FSxLogVolumeName
        FsxVolumeSnapshotPolicy:
          Ref: FsxVolumeSnapshotPolicy
      NotificationARNs:
        Fn::If:
        - IncludeNotification
        - Fn::If: 
          - ShouldSendSaasNotification
          - [Ref: NotificationARN, !Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
          - [Ref: NotificationARN]
        - Fn::If: 
          - ShouldSendSaasNotification
          - [!Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
          - []
      {{{Tags}}}
  SQLStandaloneStack:
