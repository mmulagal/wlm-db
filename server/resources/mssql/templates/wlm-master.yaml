        DomainDNSName:
          Ref: DomainDNSName
        DomainMemberSGID:
          Ref: DomainMemberSGID
        KeyPairName:
          Ref: KeyPairName
        PrivateSubnetID:
          Ref: PrivateSubnet1ID
        RouteTableId:
          Ref: RouteTable1Id
        FSxDataLunSize:
          Ref: FSxDataLunSize
        MSSQLMediaBucketName:
          Ref: MSSQLMediaBucketName
        MSSQLMediaPathKey:
          Ref: MSSQLMediaPathKey
        AMIID:
          Ref: SQLAMIID
        SQLAdminAccounts:
          Ref: SQLServiceAccountName
        VPCID:
          Ref: VPCID
        VPCCIDR:
          Ref: VPCCIDR
        WorkloadInstanceType:
          Ref: WorkloadInstanceType
        SqlFSxServerNetBIOSName:
          Fn::Select:
            - "0"
            - Fn::Split:
                - ","
                - Ref: NodeNetBIOSNames
        FSxFileSystemId:
          !If
            - NewOntapFsx
            - !GetAtt "NewFSxStack.Outputs.FSxFileSystemLogicalId"
            - !GetAtt "ExistingFSxStack.Outputs.FSxFileSystemId"
        SQLSvmName:
          Ref: SQLSvmName
        FSxDataVolumeName:
          Ref: FSxDataVolumeName
        FSxTempDbVolumeName:
          Ref: FSxTempDbVolumeName
        FSxDataLunSize:
          Ref: FSxDataLunSize
        SQLigroupname:
          Ref: SQLigroupname
        ONTAPSecurityGroupID:
          !If
            - NewOntapFsx
            - !GetAtt "NewFSxStack.Outputs.FsxSecurityGroupID"
            - !Ref "ONTAPSecurityGroupID"
        EnableCloudWatchLogFeature:
          Ref: EnableCloudWatchLogFeature
        NumberOfNodes: "1"
        FSxLogVolumeName:
          Ref: FSxLogVolumeName
        ParentStackName:
          Ref: AWS::StackName
        SqlServerName:
          Ref: SqlServerName
        SqlCollation:
          Ref: SqlCollation
        EBSVolumeSize:
          Ref: EBSVolumeSize
        FsxVolumeSnapshotPolicy:
          Ref: FsxVolumeSnapshotPolicy
      NotificationARNs:
        Fn::If:
        - IncludeNotification
        - Fn::If: 
          - ShouldSendSaasNotification
          - [Ref: NotificationARN, !Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
          - [Ref: NotificationARN]
        - Fn::If: 
          - ShouldSendSaasNotification
          - [!Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
          - []
      {{{Tags}}}
  PostStackDeployment:
    Type: Custom::MyCustomResource
    Condition: ShouldSendSaasNotification
    Properties:
      ServiceToken: !Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb'
      AccountId: !Ref AccountId
      CloudProviderAccountId: !Ref CloudProviderAccountId
      CredentialsId: !Ref RoleCredentialsId
      JWToken: !Ref JwtToken
      Region: !Ref 'AWS::Region' 
      StackName: !Ref 'AWS::StackName'
      DatabaseType: 'Microsoft SQL server'
      FSxSvmId:
          !If
            - NewOntapFsx
            - !GetAtt "NewFSxStack.Outputs.FSxSvmId"
            - !GetAtt "ExistingFSxStack.Outputs.FSxSvmId"
      Metrics: !Ref Metrics

      FSxFileSystemId:
          !If
            - NewOntapFsx
            - !GetAtt "NewFSxStack.Outputs.FSxFileSystemLogicalId"
            - !GetAtt "ExistingFSxStack.Outputs.FSxFileSystemId"
      Node1InstanceId: 
          !If
            - IsFailoverCluster
            - !GetAtt "SQLServerStack.Outputs.SQLFSx1InstanceId"
            - !GetAtt "SQLStandaloneStack.Outputs.SqlNodeId"
      Node2InstanceId: 
          !If
            - IsFailoverCluster
            - !GetAtt "SQLServerStack.Outputs.SQLFSx2InstanceId"
            - !Ref AWS::NoValue
      ResourceName: !Ref 'SqlServerName'
      SQLDeploymentType: 
          !If
            - IsFailoverCluster
            - 'FCI'
            - 'Standalone'
      FileSystemType: 'FSXN'
      ActiveDirectoryName: !Ref DomainDNSName
      ActiveDirectoryAddress: !Ref DNSIpAddresses
      EncryptedFsxPassword: !Ref 'EncryptedFsxPassword'
