---
AWSTemplateFormatVersion: "2010-09-09"
Description:
  This template deploys Windows SQL Server in chosen deployment model (Failover Cluster or Standalone). 
  **WARNING** This template creates Amazon EC2 Windows instance and related
  resources. You will be billed for the AWS resources used if you create a stack from
  this template.
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Network Configuration
        Parameters:
          - VPCID
          - VPCCIDR
          - PrivateSubnet1ID
          - RouteTable1Id
          - PrivateSubnet2ID
          - RouteTable2Id
      - Label:
          default: Amazon EC2 Configuration
        Parameters:
          - WorkloadInstanceType
          - NodeNetBIOSNames
          - KeyPairName
          - ValidationAmi
          - Ec2RoleName
      - Label:
          default: Microsoft Active Directory Configuration
        Parameters:
          - ADScenarioType
          - DomainDNSName
          - DomainAdminUser
          - DomainAdminPassword
          - DNSIpAddresses
          - DomainMemberSGID
      - Label:
          default: Amazon FSx for ONTAP Volume Configuration
        Parameters: 
          - DeploymentMode
          - FSxFileSystemName
          - FSxFileSystemId
          - FSxAdminUsername
          - FSxAdminPassword
          - FSxSvmName
          - FSxStorageCapacity
          - FSxDataVolumeName
          - FSxDataVolumeSize
          - FSxLogVolumeName
          - FSxLogVolumeSize
          - FSxTempDbVolumeName
          - FSxTempDbVolumeSize
          - FSxQuorumVolumeName
          - FSxQuorumVolumeSize
          - FSxDataLunSize
          - FSxVolumeThroughputCapacity
          - SQLigroupname
          - ONTAPSecurityGroupID
          - FileSystemEncryptionKeyId
          - FSxDiskIops
          - SQLSvmName
      - Label:
          default: Microsoft SQL Server Configuration
        Parameters:
          - SQLDeploymentMode
          - SQLAMIID
          - SQLServiceAccountName
          - SQLServiceAccountPassword
          - SqlFSxWSFCName
          - SqlServerName
      - Label:
          default: CloudWatch, SNS Topic and Resource Tags configuration
        Parameters:
          - EnableCloudWatchLogFeature
          - NotificationARN
      - Label:
          default: WLM SQL Assets Configuration
        Parameters:
          - AssetsBucketName
          - AssetsS3KeyPrefix
          - AssetsS3RegionCode
          - MSSQLMediaBucketName
          - MSSQLMediaPathKey
      - Label:
          default: Custom Resource configuration ( DO NOT EDIT )
        Parameters:
          - AccountId
          - CloudProviderAccountId
          - RoleCredentialsId
          - JwtToken
          - EncryptedFsxUsername
          - EncryptedFsxPassword
    ParameterLabels:
      DeploymentMode:
        default: File system deployment mode
      ApplicationName:
        default: Application Name
      Ec2RoleName:
        default: ""
      UniqueID:
        default: Unique ID for BlueXP WLM SQL resource group
      ADScenarioType:
        default: AD Scenario Type
      DNSIpAddresses:
        default: DNS IP Addresses
      DomainAdminUser:
        default: Domain Admin User Name
      DomainAdminPassword:
        default: Domain Admin Password
      DomainDNSName:
        default: Domain DNS Name
      SqlFSxWSFCName:
        default: Windows Server Failover Cluster name
      KeyPairName:
        default: Key Pair Name
      AssetsBucketName:
        default: Launch Wizard S3 Bucket Name
      AssetsS3KeyPrefix:
        default: Launch Wizard S3 Key Prefix
      SQLAMIID:
        default: SQL Server Version
      SQLServiceAccountName:
        default: Service Account Name
      SQLServiceAccountPassword:
        default: Service Account Password
      SQLigroupname:
        default: SQL igroup Name
      SqlServerName:
        default: SQL Server Name
      VPCName:
        default: Name your VPC
      VPCCIDR:
        default: VPC CIDR
      VPCID:
        default: VPC ID
      FSxStorageCapacity:
        default: SSD storage capacity
      PrivateSubnet1ID:
        default: Private Subnet 1 ID for the first SQL node for existing VPC e.g subnet-000dc866d93550eb0
      PrivateSubnet2ID:
        default: Private Subnet 2 ID for the second SQL node for existing VPC e.g subnet-000dc866d93550eb0
      RouteTable1Id:
        default: Route Table ID of private subnet 1
      RouteTable2Id:
        default: Route Table ID of private subnet 2
      WorkloadInstanceType:
        default: Instance Type for Cluster Nodes
      NodeNetBIOSNames:
        default: Cluster Nodes NetBIOS Names
      ONTAPSecurityGroupID:
        default: Security Group ID for FSxN
      SQLSvmName:
        default: SVM for creating SQL volumes 
      FSxDiskIops:
        default: Provisioned SSD IOPS  
      EnableCloudWatchLogFeature:
        default: (optional) Enable monitoring by CloudWatch Logging
      NotificationARN:
        default: (optional) Notification ARN
      ValidationAmi:
       default: Validation node AMI image id
      SQLDeploymentMode:
        default: SQL server deployment mode
Parameters: 
  DeploymentMode:
        Description: File system deployment mode
        Type: String
        Default: MULTI_AZ_1
        AllowedValues: [SINGLE_AZ_1, MULTI_AZ_1]
  
  SQLDeploymentMode:
        Description: SQL server deployment mode
        Type: String
        Default: fci
        AllowedValues: [fci, standalone]

  Ec2RoleName:
    Description: EC2 instance role name
    Type: String

  UniqueID:
    Description: Automation Execution Unique ID.
    Type: String

  ADScenarioType:
    AllowedValues:
      - AWS_MANAGED_AD
      - USER_MANAGED_AD
    Description:
      "Select the type of AD DS deployment to use: AWS Directory Service
      for Microsoft AD or managing your own Amazon EC2 AD instances."
    Type: String

  DNSIpAddresses:
    Description: Fixed private IPs for the Active Directory servers
    Type: String
    MinLength: 1

  DomainAdminUser:
    AllowedPattern: "([a-zA-Z0-9]+(\\.|_|-|@)*)+"
    Description:
      'User name for the account that will be added as Domain Administrator.
      This is separate from the default "Administrator" account. Note: This user will
      always default to "Admin" when using AWS Directory Service regardless of the
      value provided.'
    MaxLength: "20"
    MinLength: "5"
    Type: String

  DomainAdminPassword:
    Description: Password for Domain Adminstrator.
    Type: String
    NoEcho: true
    MinLength: 8

  DomainDNSName:
    AllowedPattern: "[a-zA-Z0-9\\-]+\\..+"
    Description:
      Fully qualified domain name (FQDN) of the forest root domain e.g.
      example.com
    MaxLength: "255"
    MinLength: "2"
    Type: String

  DomainMemberSGID:
    Description: Security group ID of the members group for existing AD
    Type: String

  KeyPairName:
    Description:
      Public/private key pairs allow you to securely connect to your instance
      after it launches
    Type: AWS::EC2::KeyPair::KeyName

  AssetsBucketName:
    Description:
      S3 bucket name for WLMDB assets. 
    Type: String
    Default: staging.wlmdb.workloads.netapp.com

  AssetsS3RegionCode:
    Description: S3 region code.
    Type: String
    Default: s3.us-east-1

  AssetsS3KeyPrefix:
    Description:
      S3 key prefix for the Launch Wizard assets. Launch Wizard key prefix
      can include numbers, lowercase letters, uppercase letters, hyphens (-), and
      forward slash (/).
    Type: String
    Default: templates


  MSSQLMediaBucketName:
    Default: LaunchWizard-sqlha
    Description:
      S3 bucket name for the Launch Wizard assets. Launch Wizard bucket
      name can include numbers, lowercase letters, uppercase letters, and hyphens
      (-). It cannot start or end with a hyphen (-).
    Type: String

  MSSQLMediaPathKey:
    Description:
      S3 key prefix for the media for SQL Server for FCI. Launch Wizard
      key prefix can include numbers, lowercase letters, uppercase letters, hyphens
      (-), and forward slash (/).
    Type: String
    Default: launchwizardscripts/sqlmedia/sqlserver.iso

  SQLAMIID:
    Description: Version of SQL Windows AMI ID
    Type: String
    MinLength: 1

  SQLServiceAccountName:
    AllowedPattern: "([a-zA-Z0-9]+(\\.|_|-|@)*)+"
    Description:
      User name for the SQL Server Service Account. This Account is a Domain
      User.
    MaxLength: "20"
    MinLength: "5"
    Type: String
  
  SQLServiceAccountPassword:
    Description: Password for the SQL Server Service Account.
    Type: String
    NoEcho: true
    MinLength: 8

  SQLigroupname:
    Description: SQL igroupname
    Type: String
    MinLength: 1

  SqlServerName:
    Description: SQL Server Name
    Type: String
    MinLength: 1

  SqlFSxWSFCName:
    AllowedPattern: "[a-zA-Z0-9\\-]+"
    Description:  Windows Server Failover Cluster name
    MaxLength: "15"
    MinLength: "4"
    Type: String
    Default: WSFCluster1

  VPCCIDR:
    AllowedPattern: "^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\\/(1[6-9]|2[0-8]))$"
    ConstraintDescription: CIDR block parameter must be in the form x.x.x.x/16-28
    Default: 10.0.0.0/16
    Description: CIDR Block for the VPC
    Type: String

  PrivateSubnet1ID:
    Description: ID of private subnet 1 in Availability Zone 1 for the Workload (e.g., subnet-a0246dcd)
    Type: String
    MinLength: 1

  PrivateSubnet2ID:
    Description: ID of private subnet 2 in Availability Zone 2 for the Workload (e.g., subnet-a0246dcd)
    Type: String

  RouteTable1Id:
    Description: Comma seperated list of all route table ids' for SQL subnets.
    Type: String
    MinLength: 1
  
  RouteTable2Id:
    Description: Comma seperated list of all route table ids' for SQL subnets.
    Type: String
  
  SQLSvmName:
    Description: SQL Storage Machine Virtual Name
    Type: String
    MinLength: 1

  WorkloadInstanceType:
    Description: Amazon EC2 instance type for the WSFC Nodes
    Type: String
    MinLength: 1

  NodeNetBIOSNames:
    Type: String
    Description: NetBIOS name of Nodes (each one up to 15 characters)
    MinLength: 1
  
  FSxStorageCapacity:
    Description: Storage capacity of the file system. Minimum 1024 GiB, maximum 192 TiB.
    Type: Number
    MinValue: 1024
    MaxValue: 196608
  
  FSxDataVolumeSize:
    Description: Size of the data volume, in megabytes (MiB).
    Type: Number

  FSxDataVolumeName:
    Description: FSx data volume name
    Type: String
    MinLength: 1
  
  FSxLogVolumeName:
    Description: FSx log volume name
    Type: String
    MinLength: 1
  
  FSxLogVolumeSize:
    Description: Size of the log volume, in megabytes (MiB).
    Type: Number
  
  FSxTempDbVolumeName:
    Description: FSx TempDB volume name
    Type: String
    MinLength: 1
  
  FSxTempDbVolumeSize:
    Description: FSx TempDB volume size, in megabytes (MiB)
    Type: Number
  
  FSxQuorumVolumeName:
    Description: FSx quorum volume name
    Type: String
    Default: wlmdb-quorum
  
  FSxQuorumVolumeSize:
    Description: Size of the cluster quorum volume, in megabytes (MiB).
    Type: Number
    Default: 100

  FSxDataLunSize:
    Description: Size of the SQL data lun, in megabytes (MiB)
    Type: Number

  FSxAdminUsername:
    Description: FSxN username
    Type: String
    MinLength: 1
         
  FSxAdminPassword:
    Description: Password for FSxAdminUsername.
    Type: String
    NoEcho: true
    MinLength: 8

  FSxSvmName:
    Type: String
    MinLength: 1
    MaxLength: 47
  
  FSxFileSystemName:
    Type: String
    Description: Fsx Filesystem name 

  FSxFileSystemId:
    Description: FSx Filesystem ID
    Type: String
  
  FSxDiskIops:
    Description: The total number of SSD IOPS provisioned for the file system.  Maximum 80,000 IOPS.
    Default: 3
    Type: Number
    MinValue: 3
    MaxValue: 80000
  
  FSxVolumeThroughputCapacity:
    Description: Throughput capacity of FSx volume
    Type: Number
    Default: 128
    AllowedValues: [128, 256, 512, 1024, 2048]
  
  FileSystemEncryptionKeyId:
    Description: ID of the AWS Key Management Service key.
    Type: String
  
  VPCID:
    Description: Existing VPC ID for deployment
    Type: String
    MinLength: 1
  
  ONTAPSecurityGroupID:
    Description: ONTAP Security Group ID
    Type: String
  
  EnableCloudWatchLogFeature:
    Default: false
    Description: Enable CloudWatch Log Feature
    Type: String
    AllowedValues:
      - true
      - false

  NotificationARN:
    Description: (optional) Amazon SNS topic ARNs to publish stack related events
    Type: String
  
  ValidationAmi:
    Description: Validation node AMI image id
    Type: String
    MinLength: 1
  
  RoleCredentialsId:
    Description: WLM account credentials id to deploy and manage resources (DO NOT EDIT)
    Type: String
    NoEcho: true
  
  AccountId:
    Description: WLM tenancy account id (DO NOT EDIT)
    Type: String
    NoEcho: true
    
  CloudProviderAccountId:
    Description: AWS CloudProviderAccountId id (DO NOT EDIT)
    Type: String
    NoEcho: true
  
  JwtToken:
    Description: JWT Token to grant access to a resource (DO NOT EDIT)
    Type: String
    NoEcho: true
  
  EncryptedFsxUsername:
    Description: Encrypted value of FSX username filled by user in the DB deployment wizard (DO NOT EDIT)
    Type: String
    NoEcho: true
  
  EncryptedFsxPassword:
    Description: Encrypted value of FSX password filled by user in the DB deployment wizard (DO NOT EDIT)
    Type: String
    NoEcho: true

  WlmdbAwsAccountId:
    Description: WLMDB AWS Account ID (DO NOT EDIT)
    Type: String
    NoEcho: true
    
Conditions:
  UseAWSDirectoryServiceEE:
    Fn::Equals:
      - Ref: ADScenarioType
      - AWS_MANAGED_AD
  NewOntapFsx: !Equals [!Ref "FSxFileSystemId", ""]
  ExistingOntapFsx:
    Fn::Not:
    - Condition: NewOntapFsx
  ExcludeNotification: !Equals [!Ref "NotificationARN", ""]
  IncludeNotification: !Not [Condition: ExcludeNotification]
  IsStandalone: !Equals [!Ref SQLDeploymentMode, 'standalone']
  IsFailoverCluster: !Not [Condition: IsStandalone]
Resources:
  DomainAdminSecretName:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-domain
      Description: Secret for Domain Account
      SecretString: !Sub '{ "username": "${DomainAdminUser}", "password": "${DomainAdminPassword}" }'

  FSxNSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-fsx
      Description: Secret for FSxN filesystem
      SecretString: !Sub '{ "username": "${FSxAdminUsername}", "password": "${FSxAdminPassword}" }'

  SQLServiceAccountSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-sql
      Description: Secret for SQL Service Account
      SecretString: !Sub '{ "username": "${SQLServiceAccountName}", "password": "${SQLServiceAccountPassword}" }'
  
  EC2IAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref 'AWS::StackName'
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
        Version: '2012-10-17'
      Path: /
      Policies:
        - PolicyDocument:
            Statement:
              - Sid: SecretManagerListStatement
                Effect: Allow
                Action:
                  - secretsmanager:ListSecrets
                  - secretsmanager:GetSecretValue
                Resource: '*'
              - Sid: CloudWatchDeploymentStatement
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:List*
                  - cloudwatch:Get*
                  - cloudwatch:Describe*
                Resource: '*'
              - Sid: CloudLogDeploymentCreateStatement
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:CreateLogGroup
                  - logs:GetLogEvents
                  - logs:GetLogDelivery
                  - logs:GetLogRecord
                  - logs:ListLogDeliveries
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                  - logs:TagResource
                Resource: '*'
              - Sid: CloudFormationDeploymentStatement
                Effect: Allow
                Action:
                  - cloudformation:ListStacks
                  - cloudformation:SignalResource
                Resource: 
                  - arn:aws:cloudformation:*:*:stack/WLMDB*
              - Sid: STSStatement
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: '*'
              - Sid: IAMStatement
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetPolicy
                  - iam:GetRolePolicy
                  - iam:PassRole
                  - iam:GetUser
                  - iam:GetPolicyVersion
                Resource: '*'
              - Sid: SSMListStatement
                Effect: Allow
                Action:
                  - ssm:DescribeAssociation
                  - ssm:GetDeployablePatchSnapshotForInstance
                  - ssm:GetDocument
                  - ssm:DescribeDocument
                  - ssm:GetManifest
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:ListAssociations
                  - ssm:ListInstanceAssociations
                  - ssm:GetParametersByPath
                  - ssm:GetCommandInvocation
                  - ec2messages:GetEndpoint
                  - ec2messages:GetMessages
                Resource: '*'
              - Sid: SSMCreateStatement
                Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                  - ssm:PutInventory
                  - ssm:PutComplianceItems
                  - ssm:PutConfigurePackageResult
                  - ssm:UpdateAssociationStatus
                  - ssm:UpdateInstanceAssociationStatus
                  - ssm:UpdateInstanceInformation
                  - ssm:SendCommand
                Resource: '*'
              - Sid: EC2MessagesStatement
                Effect: Allow
                Action:
                  - ec2messages:AcknowledgeMessage
                  - ec2messages:DeleteMessage
                  - ec2messages:FailMessage
                  - ec2messages:SendReply
                Resource: '*'
              - Sid: FsxStatement
                Effect: Allow
                Action:
                  - fsx:DescribeFileSystems
                  - fsx:DescribeVolumes
                  - fsx:DescribeStorageVirtualMachines
                Resource: '*'
              - Sid: EC2Statement
                Effect: Allow
                Action:
                  - ec2:Get*
                  - ec2:Describe*
                Resource: '*'
              - Sid: EC2TaggingStatement
                Effect: Allow
                Action:
                  - ec2:CreateTags
                  - ec2:AuthorizeSecurityGroupIngress
                Resource: '*'
                Condition:
                  StringLike:
                    aws:ResourceTag/aws:cloudformation:stack-name:
                      - WLMDB*
          PolicyName: !Join
            - ''
            - - !Ref 'AWS::StackName'
              - WLMDB_Policy_I

  TrackStackDeployment:
    Type: Custom::MyCustomResource
    Properties:
      ServiceToken: !Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb'
      AccountId: !Ref AccountId
      CloudProviderAccountId: !Ref CloudProviderAccountId
      CredentialsId: !Ref RoleCredentialsId
      JWToken: !Ref JwtToken
      Region: !Ref 'AWS::Region' 
      StackName: !Ref 'AWS::StackName'
      ResourceName: !Ref 'SqlServerName'
      SQLDeploymentType: 
          !If
            - IsFailoverCluster
            - 'FCI'
            - 'Standalone'
      FileSystemType: 'FSx for ONTAP'
      DatabaseType: 'Microsoft SQL server'
  ValidationStack1:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - TrackStackDeployment
      - EC2IAMRole
    Properties:
      TemplateURL: {{ValidationTemplate}}
      Parameters:
        DomainAdminSecretName:
          Ref: DomainAdminSecretName
        DomainAdminUser:
          Ref: DomainAdminUser
        DomainDNSName:
          Ref: DomainDNSName
        DNSIpAddresses:
          Ref: DNSIpAddresses
        KeyPairName:
          Ref: KeyPairName
        SubnetID:
          Ref: PrivateSubnet1ID
        VPCID:
          Ref: VPCID
        Ec2RoleName:
          Ref: AWS::StackName
        PerformADCheck: "true"
        AssetsBucketName:
          Ref: AssetsBucketName
        AssetsS3KeyPrefix:
          Ref: AssetsS3KeyPrefix
        AssetsS3RegionCode:
          Ref: AssetsS3RegionCode
        AMI:
          Ref: ValidationAmi
        EnableCloudWatchLogFeature:
          Ref: EnableCloudWatchLogFeature
        ParentStackName:
          Ref: AWS::StackName
      NotificationARNs:
        Fn::If:
        - IncludeNotification
        - [Ref: NotificationARN, !Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
        - [!Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
      {{Tags}}
  ValidationStack2:
    Type: AWS::CloudFormation::Stack
    Condition: IsFailoverCluster
    DependsOn:
      - TrackStackDeployment
      - EC2IAMRole
    Properties:
      TemplateURL: {{ValidationTemplate}}
      Parameters:
        DomainAdminSecretName:
          Ref: DomainAdminSecretName
        DomainAdminUser:
          Ref: DomainAdminUser
        DomainDNSName:
          Ref: DomainDNSName
        DNSIpAddresses:
          Ref: DNSIpAddresses
        KeyPairName:
          Ref: KeyPairName
        SubnetID:
          Ref: PrivateSubnet2ID
        VPCID:
          Ref: VPCID
        Ec2RoleName:
          Ref: AWS::StackName
        PerformADCheck: "false"  
        AssetsBucketName:
          Ref: AssetsBucketName
        AssetsS3KeyPrefix:
          Ref: AssetsS3KeyPrefix
        AssetsS3RegionCode:
          Ref: AssetsS3RegionCode
        AMI:
          Ref: ValidationAmi
        EnableCloudWatchLogFeature:
          Ref: EnableCloudWatchLogFeature
        ParentStackName:
          Ref: AWS::StackName
      NotificationARNs:
        Fn::If:
        - IncludeNotification
        - [Ref: NotificationARN, !Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
        - [!Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
      {{Tags}}
  FCIWaitHandler: 
    Type: AWS::CloudFormation::WaitConditionHandle
    Condition: IsFailoverCluster
    DependsOn: 
      - TrackStackDeployment
      - ValidationStack2
      - ValidationStack1
  SIWaitHandler: 
    Type: AWS::CloudFormation::WaitConditionHandle
    Condition: IsStandalone
    DependsOn: 
      - TrackStackDeployment
      - ValidationStack1
  WaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    Properties: 
      Handle: !If [IsFailoverCluster, !Ref FCIWaitHandler, !Ref SIWaitHandler]
      Timeout: '7200'
      Count: 0
  FSxNSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-fsx
      Description: Secret for FSxN filesystem
      SecretString: !Sub '{ "username": "${FSxAdminUsername}", "password": "${FSxAdminPassword}" }'
  NewFSxStack:
    Type: AWS::CloudFormation::Stack
    Condition: NewOntapFsx
    DependsOn: WaitCondition
    Properties:
      TemplateURL: {{ FSXNewTemplate }}
      Parameters:
        DeploymentMode:
          Ref: DeploymentMode
        FSxFileSystemName:
          Ref: FSxFileSystemName
        FSxAdministratorPasswordSecret:
          Ref: FSxNSecret
        FSxVolumeThroughputCapacity:
          Ref: FSxVolumeThroughputCapacity
        FSxStorageCapacity:
          Ref: FSxStorageCapacity
        FSxDataVolumeName:
          Ref: FSxDataVolumeName
        FSxDataVolumeSize:
          Ref: FSxDataVolumeSize
        FSxLogVolumeName:
          Ref: FSxLogVolumeName
        FSxLogVolumeSize:
          Ref: FSxLogVolumeSize
        FSxTempDbVolumeName:
          Ref: FSxTempDbVolumeName
        FSxTempDbVolumeSize:
          Ref: FSxTempDbVolumeSize
        FSxClusterQuorumVolumeName:
          Ref: FSxQuorumVolumeName
        FSxClusterQuorumVolumeSize:
          Ref: FSxQuorumVolumeSize
        FSxSvmName:
          Ref: SQLSvmName
        VPCID:
          Ref: VPCID
        VPCCIDR:
          Ref: VPCCIDR
        PreferredSubnetId:
          Ref: PrivateSubnet1ID
        PreferredRouteTableId:
          Ref: RouteTable1Id
        StandbySubnetId:
          Ref: PrivateSubnet2ID
        StandbyRouteTableId:
          Ref: RouteTable2Id
        FSxKmsKeyId:
          Ref: FileSystemEncryptionKeyId
        FSxDiskIops:
          Ref: FSxDiskIops 
      NotificationARNs:
        Fn::If:
        - IncludeNotification
        - [Ref: NotificationARN, !Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
        - [!Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
      {{Tags}}
  ExistingFSxStack:
    Type: AWS::CloudFormation::Stack
    Condition: ExistingOntapFsx
    DependsOn: WaitCondition
    Properties:
      TemplateURL: {{FSXExistingTemplate}}
      Parameters:
        DeploymentMode:
          Ref: DeploymentMode
        FSxSvmName:
          Ref: SQLSvmName
        FSxFileSystemId:
          Ref: FSxFileSystemId
        FSxDataVolumeName:
          Ref: FSxDataVolumeName
        FSxDataVolumeSize:
          Ref: FSxDataVolumeSize
        FSxLogVolumeName:
          Ref: FSxLogVolumeName
        FSxLogVolumeSize:
          Ref: FSxLogVolumeSize
        FSxTempDbVolumeName:
          Ref: FSxTempDbVolumeName
        FSxTempDbVolumeSize:
          Ref: FSxTempDbVolumeSize
        FSxClusterQuorumVolumeName:
          Ref: FSxQuorumVolumeName
        FSxClusterQuorumVolumeSize:
          Ref: FSxQuorumVolumeSize
      NotificationARNs:
        Fn::If:
        - IncludeNotification
        - [Ref: NotificationARN, !Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
        - [!Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
