---
AWSTemplateFormatVersion: "2010-09-09"
Description: This template deploys Windows SQL Server in the chosen deployment model (failover cluster instances or a standalone instance). 
            This template creates an Amazon EC2 Windows instance and related resources.
            You will be billed for the AWS resources used if you create a stack from this template.
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Network Configuration
        Parameters:
          - VPCID
          - VPCCIDR
          - PrivateSubnet1ID
          - RouteTable1Id
          - PrivateSubnet2ID
          - RouteTable2Id
      - Label:
          default: Amazon EC2 Configuration
        Parameters:
          - WorkloadInstanceType
          - NodeNetBIOSNames
          - KeyPairName
          - ValidationAmi
          - CfDeployRoleName
      - Label:
          default: Microsoft Active Directory Configuration
        Parameters:
          - ADScenarioType
          - DomainDNSName
          - DomainAdminUser
          - DomainAdminPassword
          - DNSIpAddresses
          - DomainMemberSGID
      - Label:
          default: Amazon FSx for ONTAP configuration
        Parameters: 
          - DeploymentMode
          - FSxFileSystemName
          - FSxFileSystemId
          - FSxAdminUsername
          - FSxAdminPassword
          - FSxSvmName
          - FSxStorageCapacity
          - FSxDataVolumeName
          - FSxDataVolumeSize
          - FSxLogVolumeName
          - FSxLogVolumeSize
          - FSxTempDbVolumeName
          - FSxTempDbVolumeSize
          - FSxQuorumVolumeName
          - FSxQuorumVolumeSize
          - FSxDataLunSize
          - FSxVolumeThroughputCapacity
          - SQLigroupname
          - ONTAPSecurityGroupID
          - FileSystemEncryptionKeyId
          - FSxDiskIops
          - SQLSvmName
      - Label:
          default: Microsoft SQL Server Configuration
        Parameters:
          - SQLDeploymentMode
          - SQLAMIID
          - SQLServiceAccountName
          - SQLServiceAccountPassword
          - SqlFSxWSFCName
          - SqlServerName
      - Label:
          default: CloudWatch, SNS Topic and Resource Tags configuration
        Parameters:
          - EnableCloudWatchLogFeature
          - NotificationARN
      - Label:
          default: WLM SQL Assets Configuration
        Parameters:
          - AssetsBucketName
          - AssetsS3KeyPrefix
          - AssetsS3RegionCode
          - MSSQLMediaBucketName
          - MSSQLMediaPathKey
      - Label:
          default: Custom Resource configuration ( DO NOT EDIT )
        Parameters:
          - AccountId
          - CloudProviderAccountId
          - RoleCredentialsId
          - JwtToken
          - EncryptedFsxPassword
    ParameterLabels:
      DeploymentMode:
        default: File system deployment mode
      ApplicationName:
        default: Application name
      CfDeployRoleName:
        default: CloudFormation deployment role name
      UniqueID:
        default: Unique ID for WLMDB SQL resource group
      ADScenarioType:
        default: AD scenario type
      DNSIpAddresses:
        default: DNS IP addresses
      DomainAdminUser:
        default: Domain admin user name
      DomainAdminPassword:
        default: Domain admin password
      DomainDNSName:
        default: Domain DNS name
      SqlFSxWSFCName:
        default: Windows Server Failover Cluster name
      KeyPairName:
        default: Key pair name
      AssetsBucketName:
        default: WLMDB S3 bucket name
      AssetsS3KeyPrefix:
        default: WLMDB S3 key prefix
      SQLAMIID:
        default: SQL server version
      SQLServiceAccountName:
        default: Service account name
      SQLServiceAccountPassword:
        default: Service account password
      SQLigroupname:
        default: SQL igroup name
      SqlServerName:
        default: SQL server name
      VPCName:
        default: Name of VPC
      VPCCIDR:
        default: VPC CIDR
      VPCID:
        default: VPC ID
      FSxStorageCapacity:
        default: FSx for ONTAP storage capacity
      PrivateSubnet1ID:
        default: Private subnet ID for the first SQL node, for example, subnet-000dc866d93550eb0 
      PrivateSubnet2ID:
        default: Private subnet ID for the second SQL node, for example, subnet-000dc866d93550eb0 
      RouteTable1Id:
        default: ID of the route table for private subnet 1.
      RouteTable2Id:
        default: ID of the route table for private subnet 2.
      WorkloadInstanceType:
        default: Instance type for cluster nodes
      NodeNetBIOSNames:
        default: NetBIOS names of cluster nodes
      ONTAPSecurityGroupID:
        default: Security Group ID for FSx for ONTAP
      SQLSvmName:
        default: SVM for creating SQL volumes 
      FSxDiskIops:
        default: Provisioned SSD IOPS  
      EnableCloudWatchLogFeature:
        default: (optional) Enable monitoring by CloudWatch Logging
      NotificationARN:
        default: (optional) Notification ARN
      ValidationAmi:
       default: Validation node AMI image ID
      SQLDeploymentMode:
        default: SQL server deployment mode
Parameters: 
  UniqueID:
    Description: Automation execution unique ID.
    Type: String 

  {{DeploymentMode}}
  
  {{SQLDeploymentMode}}
        
  {{CfDeployRoleName}}

  {{ADScenarioType}}

  {{DNSIpAddresses}}

  {{DomainAdminUser}}

  {{DomainAdminPassword}}

  {{DomainDNSName}}

  {{DomainMemberSGID}}

  {{KeyPairName}}

  {{AssetsBucketName}}

  {{AssetsS3RegionCode}}

  {{AssetsS3KeyPrefix}}

  {{MSSQLMediaBucketName}}

  {{MSSQLMediaPathKey}}

  {{SQLAMIID}}

  {{SQLServiceAccountName}}
  
  {{SQLServiceAccountPassword}}

  {{SQLigroupname}}

  {{SqlServerName}}

  {{SqlFSxWSFCName}}

  {{VPCCIDR}}

  {{PrivateSubnet1ID}}

  {{PrivateSubnet2ID}}

  {{RouteTable1Id}}
  
  {{RouteTable2Id}}
  
  {{SQLSvmName}}

  {{WorkloadInstanceType}}

  {{NodeNetBIOSNames}}
  
  {{FSxStorageCapacity}}
  
  {{FSxDataVolumeSize}}

  {{FSxDataVolumeName}}
  
  {{FSxLogVolumeName}}
  
  {{FSxLogVolumeSize}}
  
  {{FSxTempDbVolumeName}}
  
  {{FSxTempDbVolumeSize}}
  
  {{FSxQuorumVolumeName}}
  
  {{FSxQuorumVolumeSize}}

  {{FSxDataLunSize}}

  {{FSxAdminUsername}}
         
  {{FSxAdminPassword}}

  {{FSxSvmName}}
  
  {{FSxFileSystemName}}

  {{FSxFileSystemId}}
  
  {{FSxDiskIops}}
  
  {{FSxVolumeThroughputCapacity}}
  
  {{FileSystemEncryptionKeyId}}
  
  {{VPCID}}
  
  {{ONTAPSecurityGroupID}}
  
  {{EnableCloudWatchLogFeature}}

  {{NotificationARN}}
  
  {{ValidationAmi}}
  
  {{RoleCredentialsId}}
  
  {{AccountId}}
    
  {{CloudProviderAccountId}}
  
  {{JwtToken}}

  {{EncryptedFsxPassword}}
  
  {{WlmdbAwsAccountId}}
  
  {{Metrics}}
       
Conditions:
  UseAWSDirectoryServiceEE:
    Fn::Equals:
      - Ref: ADScenarioType
      - AWS_MANAGED_AD
  NewOntapFsx: !Equals [!Ref "FSxFileSystemId", ""]
  ExistingOntapFsx:
    Fn::Not:
    - Condition: NewOntapFsx
  ExcludeNotification: !Equals [!Ref "NotificationARN", ""]
  IncludeNotification: !Not [Condition: ExcludeNotification]
  IsStandalone: !Equals [!Ref SQLDeploymentMode, 'standalone']
  IsFailoverCluster: !Not [Condition: IsStandalone]
Resources:
  DomainAdminSecretName:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-domain
      Description: Secret for Domain Account
      SecretString: !Sub '{ "username": "${DomainAdminUser}", "password": "${DomainAdminPassword}" }'

  FSxNSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-fsx
      Description: Secret for FSxN filesystem
      SecretString: !Sub '{ "username": "${FSxAdminUsername}", "password": "${FSxAdminPassword}" }'

  SQLServiceAccountSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-sql
      Description: Secret for SQL Service Account
      SecretString: !Sub '{ "username": "${SQLServiceAccountName}", "password": "${SQLServiceAccountPassword}" }'
  
  EC2IAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref 'AWS::StackName'
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
        Version: '2012-10-17'
      Path: /
      Policies:
        - PolicyDocument:
            Statement:
              - Sid: SecretManagerListStatement
                Effect: Allow
                Action:
                  - secretsmanager:ListSecrets
                  - secretsmanager:GetSecretValue
                Resource: '*'
              - Sid: CloudWatchDeploymentStatement
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:List*
                  - cloudwatch:Get*
                  - cloudwatch:Describe*
                Resource: '*'
              - Sid: CloudLogDeploymentCreateStatement
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:CreateLogGroup
                  - logs:GetLogEvents
                  - logs:GetLogDelivery
                  - logs:GetLogRecord
                  - logs:ListLogDeliveries
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                  - logs:TagResource
                Resource: '*'
              - Sid: CloudFormationDeploymentStatement
                Effect: Allow
                Action:
                  - cloudformation:ListStacks
                  - cloudformation:SignalResource
                Resource: 
                  - arn:aws:cloudformation:*:*:stack/WLMDB*
              - Sid: STSStatement
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: '*'
              - Sid: IAMStatement
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetPolicy
                  - iam:GetRolePolicy
                  - iam:PassRole
                  - iam:GetUser
                  - iam:GetPolicyVersion
                Resource: '*'
              - Sid: SSMListStatement
                Effect: Allow
                Action:
                  - ssm:DescribeAssociation
                  - ssm:GetDeployablePatchSnapshotForInstance
                  - ssm:GetDocument
                  - ssm:DescribeDocument
                  - ssm:GetManifest
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:ListAssociations
                  - ssm:ListInstanceAssociations
                  - ssm:GetParametersByPath
                  - ssm:GetCommandInvocation
                  - ec2messages:GetEndpoint
                  - ec2messages:GetMessages
                Resource: '*'
              - Sid: SSMCreateStatement
                Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                  - ssm:PutInventory
                  - ssm:PutComplianceItems
                  - ssm:PutConfigurePackageResult
                  - ssm:UpdateAssociationStatus
                  - ssm:UpdateInstanceAssociationStatus
                  - ssm:UpdateInstanceInformation
                  - ssm:SendCommand
                Resource: '*'
              - Sid: EC2MessagesStatement
                Effect: Allow
                Action:
                  - ec2messages:AcknowledgeMessage
                  - ec2messages:DeleteMessage
                  - ec2messages:FailMessage
                  - ec2messages:SendReply
                Resource: '*'
              - Sid: FsxStatement
                Effect: Allow
                Action:
                  - fsx:DescribeFileSystems
                  - fsx:DescribeVolumes
                  - fsx:DescribeStorageVirtualMachines
                Resource: '*'
              - Sid: EC2Statement
                Effect: Allow
                Action:
                  - ec2:Get*
                  - ec2:Describe*
                Resource: '*'
              - Sid: EC2TaggingStatement
                Effect: Allow
                Action:
                  - ec2:CreateTags
                  - ec2:AuthorizeSecurityGroupIngress
                Resource: '*'
                Condition:
                  StringLike:
                    aws:ResourceTag/aws:cloudformation:stack-name:
                      - WLMDB*
          PolicyName: !Join
            - ''
            - - !Ref 'AWS::StackName'
              - WLMDB_Policy_I

  TrackStackDeployment:
    Type: Custom::MyCustomResource
    Properties:
      ServiceToken: !Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb'
      AccountId: !Ref AccountId
      CloudProviderAccountId: !Ref CloudProviderAccountId
      CredentialsId: !Ref RoleCredentialsId
      JWToken: !Ref JwtToken
      Region: !Ref 'AWS::Region' 
      StackName: !Ref 'AWS::StackName'
      ResourceName: !Ref 'SqlServerName'
      SQLDeploymentType: 
          !If
            - IsFailoverCluster
            - 'FCI'
            - 'Standalone'
      FileSystemType: 'FSx for ONTAP'
      DatabaseType: 'Microsoft SQL server'
      Metrics: !Ref Metrics
  ValidationStack1:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - TrackStackDeployment
      - EC2IAMRole
    Properties:
      TemplateURL: {{ValidationTemplate}}
      Parameters:
        DomainAdminSecretName:
          Ref: DomainAdminSecretName
        DomainAdminUser:
          Ref: DomainAdminUser
        DomainDNSName:
          Ref: DomainDNSName
        DNSIpAddresses:
          Ref: DNSIpAddresses
        KeyPairName:
          Ref: KeyPairName
        SubnetID:
          Ref: PrivateSubnet1ID
        VPCID:
          Ref: VPCID
        Ec2RoleName:
          Ref: AWS::StackName
        PerformADCheck: "true"
        AssetsBucketName:
          Ref: AssetsBucketName
        AssetsS3KeyPrefix:
          Ref: AssetsS3KeyPrefix
        AssetsS3RegionCode:
          Ref: AssetsS3RegionCode
        AMI:
          Ref: ValidationAmi
        EnableCloudWatchLogFeature:
          Ref: EnableCloudWatchLogFeature
        ParentStackName:
          Ref: AWS::StackName
        PerformFSxCheck:
          Fn::If:
          - ExistingOntapFsx
          - 'true'
          - 'false'
        FSxFileSystemId: 
          Fn::If:
          - ExistingOntapFsx
          - Ref: FSxFileSystemId
          - 'fs-id'
        FSxAdministratorPasswordSecret:
          Ref: FSxNSecret
      NotificationARNs:
        Fn::If:
        - IncludeNotification
        - [Ref: NotificationARN, !Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
        - [!Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
      {{Tags}}
  ValidationStack2:
    Type: AWS::CloudFormation::Stack
    Condition: IsFailoverCluster
    DependsOn:
      - TrackStackDeployment
      - EC2IAMRole
    Properties:
      TemplateURL: {{ValidationTemplate}}
      Parameters:
        DomainAdminSecretName:
          Ref: DomainAdminSecretName
        DomainAdminUser:
          Ref: DomainAdminUser
        DomainDNSName:
          Ref: DomainDNSName
        DNSIpAddresses:
          Ref: DNSIpAddresses
        KeyPairName:
          Ref: KeyPairName
        SubnetID:
          Ref: PrivateSubnet2ID
        VPCID:
          Ref: VPCID
        Ec2RoleName:
          Ref: AWS::StackName
        PerformADCheck: "false"  
        AssetsBucketName:
          Ref: AssetsBucketName
        AssetsS3KeyPrefix:
          Ref: AssetsS3KeyPrefix
        AssetsS3RegionCode:
          Ref: AssetsS3RegionCode
        AMI:
          Ref: ValidationAmi
        EnableCloudWatchLogFeature:
          Ref: EnableCloudWatchLogFeature
        ParentStackName:
          Ref: AWS::StackName
        PerformFSxCheck:
          Fn::If:
          - ExistingOntapFsx
          - 'true'
          - 'false'
        FSxFileSystemId: 
          Fn::If:
          - ExistingOntapFsx
          - Ref: FSxFileSystemId
          - 'fs-id'
        FSxAdministratorPasswordSecret:
          Ref: FSxNSecret
      NotificationARNs:
        Fn::If:
        - IncludeNotification
        - [Ref: NotificationARN, !Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
        - [!Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
      {{Tags}}
  FCIWaitHandler: 
    Type: AWS::CloudFormation::WaitConditionHandle
    Condition: IsFailoverCluster
    DependsOn: 
      - TrackStackDeployment
      - ValidationStack2
      - ValidationStack1
  SIWaitHandler: 
    Type: AWS::CloudFormation::WaitConditionHandle
    Condition: IsStandalone
    DependsOn: 
      - TrackStackDeployment
      - ValidationStack1
  WaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    Properties: 
      Handle: !If [IsFailoverCluster, !Ref FCIWaitHandler, !Ref SIWaitHandler]
      Timeout: '7200'
      Count: 0
  FSxNSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-fsx
      Description: Secret for FSxN filesystem
      SecretString: !Sub '{ "username": "${FSxAdminUsername}", "password": "${FSxAdminPassword}" }'
  NewFSxStack:
    Type: AWS::CloudFormation::Stack
    Condition: NewOntapFsx
    DependsOn: WaitCondition
    Properties:
      TemplateURL: {{ FSXNewTemplate }}
      Parameters:
        DeploymentMode:
          Ref: DeploymentMode
        FSxFileSystemName:
          Ref: FSxFileSystemName
        FSxAdministratorPasswordSecret:
          Ref: FSxNSecret
        FSxVolumeThroughputCapacity:
          Ref: FSxVolumeThroughputCapacity
        FSxStorageCapacity:
          Ref: FSxStorageCapacity
        FSxDataVolumeName:
          Ref: FSxDataVolumeName
        FSxDataVolumeSize:
          Ref: FSxDataVolumeSize
        FSxLogVolumeName:
          Ref: FSxLogVolumeName
        FSxLogVolumeSize:
          Ref: FSxLogVolumeSize
        FSxTempDbVolumeName:
          Ref: FSxTempDbVolumeName
        FSxTempDbVolumeSize:
          Ref: FSxTempDbVolumeSize
        FSxClusterQuorumVolumeName:
          Ref: FSxQuorumVolumeName
        FSxClusterQuorumVolumeSize:
          Ref: FSxQuorumVolumeSize
        FSxSvmName:
          Ref: SQLSvmName
        VPCID:
          Ref: VPCID
        VPCCIDR:
          Ref: VPCCIDR
        PreferredSubnetId:
          Ref: PrivateSubnet1ID
        PreferredRouteTableId:
          Ref: RouteTable1Id
        StandbySubnetId:
          Ref: PrivateSubnet2ID
        StandbyRouteTableId:
          Ref: RouteTable2Id
        FSxKmsKeyId:
          Ref: FileSystemEncryptionKeyId
        FSxDiskIops:
          Ref: FSxDiskIops 
      NotificationARNs:
        Fn::If:
        - IncludeNotification
        - [Ref: NotificationARN, !Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
        - [!Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
      {{Tags}}
  ExistingFSxStack:
    Type: AWS::CloudFormation::Stack
    Condition: ExistingOntapFsx
    DependsOn: WaitCondition
    Properties:
      TemplateURL: {{FSXExistingTemplate}}
      Parameters:
        DeploymentMode:
          Ref: DeploymentMode
        FSxSvmName:
          Ref: SQLSvmName
        FSxFileSystemId:
          Ref: FSxFileSystemId
        FSxDataVolumeName:
          Ref: FSxDataVolumeName
        FSxDataVolumeSize:
          Ref: FSxDataVolumeSize
        FSxLogVolumeName:
          Ref: FSxLogVolumeName
        FSxLogVolumeSize:
          Ref: FSxLogVolumeSize
        FSxTempDbVolumeName:
          Ref: FSxTempDbVolumeName
        FSxTempDbVolumeSize:
          Ref: FSxTempDbVolumeSize
        FSxClusterQuorumVolumeName:
          Ref: FSxQuorumVolumeName
        FSxClusterQuorumVolumeSize:
          Ref: FSxQuorumVolumeSize
      NotificationARNs:
        Fn::If:
        - IncludeNotification
        - [Ref: NotificationARN, !Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
        - [!Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
      {{Tags}}
  SQLServerStack:
    Type: AWS::CloudFormation::Stack
    Condition: IsFailoverCluster
    DependsOn: WaitCondition
    Properties:
      TemplateURL: {{SQLTemplate}}
      Parameters:
        UniqueID:
          Ref: UniqueID
        Ec2RoleName:
          Ref: AWS::StackName
        ADDnsIpAddresses:
          Fn::Select:
            - "0"
            - Fn::Split:
                - ","
                - Ref: DNSIpAddresses
        DomainAdminSecretName:
          Ref: DomainAdminSecretName
        DomainAdminUser:
          Ref: DomainAdminUser
        DomainDNSName:
          Ref: DomainDNSName
        DomainMemberSGID:
          Ref: DomainMemberSGID
        KeyPairName:
          Ref: KeyPairName
        PrivateSubnet1ID:
          Ref: PrivateSubnet1ID
        RouteTable1Id:
          Ref: RouteTable1Id
        RouteTable2Id:
          Ref: RouteTable2Id
        PrivateSubnet2ID:
          Ref: PrivateSubnet2ID
        AssetsBucketName:
          Ref: AssetsBucketName
        FSxDataLunSize:
          Ref: FSxDataLunSize
        AssetsS3RegionCode:
          Ref: AssetsS3RegionCode
        AssetsS3KeyPrefix:
          Ref: AssetsS3KeyPrefix
        MSSQLMediaBucketName:
          Ref: MSSQLMediaBucketName
        MSSQLMediaPathKey:
          Ref: MSSQLMediaPathKey
        AMIID:
          Ref: SQLAMIID
        SqlFSxWSFCName:
          Ref: SqlFSxWSFCName
        SqlFSxFCIName:
          Ref: SqlServerName
        SQLAdminAccounts:
          Ref: SQLServiceAccountName
        SQLServiceAccountSecret:
          Ref: SQLServiceAccountSecret
        VPCID:
          Ref: VPCID
        VPCCIDR:
          Ref: VPCCIDR
        WorkloadInstanceType:
          Ref: WorkloadInstanceType
        SqlFSxServerNetBIOSName1:
          Fn::Select:
            - "0"
            - Fn::Split:
                - ","
                - Ref: NodeNetBIOSNames
        SqlFSxServerNetBIOSName2:
          Fn::Select:
            - "1"
            - Fn::Split:
                - ","
                - Ref: NodeNetBIOSNames
        FSxFileSystemId:
          !If
            - NewOntapFsx
            - !GetAtt "NewFSxStack.Outputs.FSxFileSystemLogicalId"
            - !GetAtt "ExistingFSxStack.Outputs.FSxFileSystemId"
        FsxAdminPassword:
          Ref: FSxNSecret
        SQLSvmName:
          Ref: SQLSvmName
        FSxDataVolumeName:
          Ref: FSxDataVolumeName
        FSxTempDbVolumeName:
          Ref: FSxTempDbVolumeName
        FSxQuorumVolumeName:
          Ref: FSxQuorumVolumeName
        FSxDataLunSize:
          Ref: FSxDataLunSize
        SQLigroupname:
          Ref: SQLigroupname
        ONTAPSecurityGroupID:
          !If
            - NewOntapFsx
            - !GetAtt "NewFSxStack.Outputs.FsxSecurityGroupID"
            - !Ref "ONTAPSecurityGroupID"
        EnableCloudWatchLogFeature:
          Ref: EnableCloudWatchLogFeature
        ParentStackName:
          Ref: AWS::StackName
        NumberOfNodes: "2"
        FSxLogVolumeName:
          Ref: FSxLogVolumeName
      NotificationARNs:
        Fn::If:
        - IncludeNotification
        - [Ref: NotificationARN, !Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
        - [!Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
      {{Tags}}
  SQLStandaloneStack:
    Type: AWS::CloudFormation::Stack
    Condition: IsStandalone
    DependsOn: WaitCondition
    Properties:
      TemplateURL: {{SQLStandaloneTemplate}}
      Parameters:
        UniqueID:
          Ref: UniqueID
        Ec2RoleName:
          Ref: AWS::StackName
        ADDnsIpAddresses:
          Fn::Select:
            - "0"
            - Fn::Split:
                - ","
                - Ref: DNSIpAddresses
        DomainAdminSecretName:
          Ref: DomainAdminSecretName
        DomainAdminUser:
          Ref: DomainAdminUser
        DomainDNSName:
          Ref: DomainDNSName
        DomainMemberSGID:
          Ref: DomainMemberSGID
        KeyPairName:
          Ref: KeyPairName
        PrivateSubnetID:
          Ref: PrivateSubnet1ID
        RouteTableId:
          Ref: RouteTable1Id
        AssetsBucketName:
          Ref: AssetsBucketName
        FSxDataLunSize:
          Ref: FSxDataLunSize
        AssetsS3RegionCode:
          Ref: AssetsS3RegionCode
        AssetsS3KeyPrefix:
          Ref: AssetsS3KeyPrefix
        MSSQLMediaBucketName:
          Ref: MSSQLMediaBucketName
        MSSQLMediaPathKey:
          Ref: MSSQLMediaPathKey
        AMIID:
          Ref: SQLAMIID
        SQLAdminAccounts:
          Ref: SQLServiceAccountName
        SQLServiceAccountSecret:
          Ref: SQLServiceAccountSecret
        VPCID:
          Ref: VPCID
        VPCCIDR:
          Ref: VPCCIDR
        WorkloadInstanceType:
          Ref: WorkloadInstanceType
        SqlFSxServerNetBIOSName:
          Fn::Select:
            - "0"
            - Fn::Split:
                - ","
                - Ref: NodeNetBIOSNames
        FSxFileSystemId:
          !If
            - NewOntapFsx
            - !GetAtt "NewFSxStack.Outputs.FSxFileSystemLogicalId"
            - !GetAtt "ExistingFSxStack.Outputs.FSxFileSystemId"
        FsxAdminPassword:
          Ref: FSxNSecret
        SQLSvmName:
          Ref: SQLSvmName
        FSxDataVolumeName:
          Ref: FSxDataVolumeName
        FSxTempDbVolumeName:
          Ref: FSxTempDbVolumeName
        FSxDataLunSize:
          Ref: FSxDataLunSize
        SQLigroupname:
          Ref: SQLigroupname
        ONTAPSecurityGroupID:
          !If
            - NewOntapFsx
            - !GetAtt "NewFSxStack.Outputs.FsxSecurityGroupID"
            - !Ref "ONTAPSecurityGroupID"
        EnableCloudWatchLogFeature:
          Ref: EnableCloudWatchLogFeature
        NumberOfNodes: "1"
        FSxLogVolumeName:
          Ref: FSxLogVolumeName
        ParentStackName:
          Ref: AWS::StackName
        SqlServerName:
          Ref: SqlServerName
      NotificationARNs:
        Fn::If:
        - IncludeNotification
        - [Ref: NotificationARN, !Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
        - [!Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb']
      {{Tags}}
  PostStackDeployment:
    Type: Custom::MyCustomResource
    Properties:
      ServiceToken: !Sub 'arn:aws:sns:${AWS::Region}:${WlmdbAwsAccountId}:wlmdb'
      AccountId: !Ref AccountId
      CloudProviderAccountId: !Ref CloudProviderAccountId
      CredentialsId: !Ref RoleCredentialsId
      JWToken: !Ref JwtToken
      Region: !Ref 'AWS::Region' 
      StackName: !Ref 'AWS::StackName'
      DomainAdminSecretName: !Sub ${AWS::StackName}-domain
      FSxNSecret: !Sub ${AWS::StackName}-fsx
      SQLServiceAccountSecret: !Sub ${AWS::StackName}-sql
      DatabaseType: 'Microsoft SQL server'
      FSxSvmId:
          !If
            - NewOntapFsx
            - !GetAtt "NewFSxStack.Outputs.FSxSvmId"
            - !GetAtt "ExistingFSxStack.Outputs.FSxSvmId"
      Metrics: !Ref Metrics

      FSxFileSystemId:
          !If
            - NewOntapFsx
            - !GetAtt "NewFSxStack.Outputs.FSxFileSystemLogicalId"
            - !GetAtt "ExistingFSxStack.Outputs.FSxFileSystemId"
      ActiveInstanceIp: 
          !If
            - IsFailoverCluster
            - !GetAtt "SQLServerStack.Outputs.SQLFSx1InstanceIPMAD"
            - !GetAtt "SQLStandaloneStack.Outputs.SqlNodeIp"
      ActiveInstanceId: 
          !If
            - IsFailoverCluster
            - !GetAtt "SQLServerStack.Outputs.SQLFSx1InstanceId"
            - !GetAtt "SQLStandaloneStack.Outputs.SqlNodeId"
      ActiveInstanceName: 
          Fn::Select:
            - "0"
            - Fn::Split:
              - ","
              - Ref: NodeNetBIOSNames
      StandbyInstanceIp: 
          !If
            - IsFailoverCluster
            - !GetAtt "SQLServerStack.Outputs.SQLFSx2InstanceIPMAD"
            - !Ref AWS::NoValue
      StandbyInstanceId: 
          !If
            - IsFailoverCluster
            - !GetAtt "SQLServerStack.Outputs.SQLFSx2InstanceId"
            - !Ref AWS::NoValue
      StandbyInstanceName: 
          !If
            - IsFailoverCluster
            - Fn::Select:
              - "1"
              - Fn::Split:
                - ","
                - Ref: NodeNetBIOSNames
            - !Ref AWS::NoValue
      ResourceName: !Ref 'SqlServerName'
      SQLDeploymentType: 
          !If
            - IsFailoverCluster
            - 'FCI'
            - 'Standalone'
      FileSystemType: 'FSx for ONTAP'
      ActiveDirectoryName: !Ref DomainDNSName
      ActiveDirectoryAddress: !Ref DNSIpAddresses
      EncryptedFsxPassword: !Ref 'EncryptedFsxPassword'
