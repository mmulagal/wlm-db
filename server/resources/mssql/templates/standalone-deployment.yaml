#prettier-ignore
---
AWSTemplateFormatVersion: '2010-09-09'
Description: This template deploys a SQL Server standalone instance using FSx for NetApp ONTAP in an existing VPC. 
            This template creates EC2 instances and the required resources. You will be billed for AWS resources if you create a stack from this template.
Metadata:
    AWS::CloudFormation::Interface:
        ParameterGroups:
            - Label:
                  default: Network Configuration
              Parameters:
                  - VPCID
                  - VPCCIDR
                  - PrivateSubnetID
                  - RouteTableId
            - Label:
                  default: Microsoft Active Directory Configuration
              Parameters:
                  - DomainDNSName
                  - DomainAdminUser
                  - ADDnsIpAddresses
                  - DomainMemberSGID
            - Label:
                  default: Amazon EC2 Configuration
              Parameters:
                  - SqlFSxServerNetBIOSName
                  - KeyPairName
                  - WorkloadInstanceType
            - Label:
                  default: Amazon FSx for ONTAP Volume Configuration
              Parameters:
                  - FSxFileSystemId
                  - SQLSvmName
                  - FSxDataLunSize
                  - FSxDataVolumeName
                  - FSxLogVolumeName
                  - FSxTempDbVolumeName
                  - SQLigroupname
                  - ONTAPSecurityGroupID
            - Label:
                  default: Microsoft SQL Server configurations
              Parameters:
                  - MSSQLMediaBucketName
                  - MSSQLMediaPathKey
                  - NumberOfNodes
                  - SQLAdminAccounts
                  - AMIID
                  - BYOLAMI
                  - SqlServerName
            - Label:
                  default: AWS Configuration
              Parameters:
                  - EnableCloudWatchLogFeature
                  - ParentStackName
        ParameterLabels:
            KeyPairName:
                default: Key Pair Name for the EC2 instance
            PrivateSubnetID:
                default: Private Subnet ID for the SQL node for existing VPC. For example, subnet-000dc866d93550eb0
            RouteTableId:
                default: Route Table ID of private subnet
            AMIID:
                default: ID of the AMI used to launch Instances
            VPCID:
                default: VPC ID if the instances are launched in an existing VPC. For example, vpc-04e3ac96d2f5ac570
            VPCCIDR:
                default: VPCCIDR for instances launched in existing VPC. Also used for setting
                    up security groups. For example, 10.0.0.8/16
            WorkloadInstanceType:
                default: Workload Servers Instance Type for SQL EC2 Instances. For example, r4.xlarge
            DomainAdminUser:
                default: Domain Admin User Name. For example, Administrator
            DomainDNSName:
                default: Domain DNS Name. For example, example.com
            DomainMemberSGID:
                default: Security Group ID for AD Domain Members. For example, sg-0b7b0431023b4208a
            SqlFSxServerNetBIOSName:
                default: Server NetBIOS Name. For example, SQLFSX01
            FileShareVolumeSize:
                default: FSx for ONTAP capacity in GB. For example, 1024
            FileShareThroughputCapacity:
                default: Data throughput capacity (MB/s). For example, 16 MBps
            ADDnsIpAddresses:
                default: Comma separated list of DNS addresses for existing AD. For example, 10.0.0.10,10.0.16.10
            SQLStorageVMName:
                default: SQL Storage VM Name for ONTAP
            ONTAPSecurityGroupID:
                default: Security Group ID for FSxN
            FSxDataLunSize:
                default: Estimated SQL Data size
            SQLigroupname:
                default: SQL igroup name
            FSxDataVolumeName:
                default: SQL data volume name
            FSxLogVolumeName:
                default: SQL log volume name
            FSxTempDbVolumeName:
                default: SQL tempdb volume name
            FSxFileSystemId:
                default: File system ID for FSxN
            SQLSvmName:
                default: SVM for creating SQL volumes
            NumberOfNodes:
                default: Number of SQL Nodes
            EnableCloudWatchLogFeature:
                default: (optional) Enable monitoring by CloudWatch Logging
            ParentStackName:
                default: Stack name for parent CloudFormation stack
            SqlServerName:
                default: SQL Server Name
Parameters:
    ParentStackName:
        Description: Stack name for the parent CloudFormation stack.
        Type: String
    Ec2RoleName:
        Default: AmazonEC2RoleForLaunchWizard
        Description: EC2 instance role name.
        Type: String
    EnableCloudWatchLogFeature:
        Default: false
        Description: Enable AWS CloudWatch logging.
        Type: String
    LogGroupName:
        Default: SQLDLOG
        Description: A name for the log group.
        Type: String
    UniqueID:
        Default: SQL123
        Description: Automation execution unique ID.
        Type: String
    AMIID:
        Description: ID of the AMI to use.
        Type: String
        Default: ami-06c634c2148dc0856
    BYOLAMI:
        Default: 'false'
        Description: Whether the AMI is license included or bring your own license.
        Type: String
    KeyPairName:
        Description: Name of an existing EC2 key pair. All instances will launch with
            this key pair.
        Type: AWS::EC2::KeyPair::KeyName
    PrivateSubnetID:
        Description: ID of private subnet in an Availability Zone 1 for the workload (For example, subnet-a0246dcd).
        Type: String
    VPCID:
        Description: ID of your existing VPC for deployment.
        Type: String
    VPCCIDR:
        AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$
        ConstraintDescription: CIDR block parameter must be in the form x.x.x.x/16-28
        Description: CIDR block for the VPC.
        Type: String
    SqlFSxServerNetBIOSName:
        AllowedPattern: '[a-zA-Z0-9\-]+'
        Default: SqlFSx1
        Description: NetBIOS name of the SQL Server (up to 15 characters).
        MaxLength: '15'
        MinLength: '1'
        Type: String
    DomainAdminUser:
        AllowedPattern: ([a-zA-Z0-9]+(\.|_|-|@)*)+
        Default: admin
        Description: User name for the account that will be used as Domain Administrator.
            This is separate from the default "Administrator" account.
        MaxLength: '25'
        MinLength: '5'
        Type: String
    DomainDNSName:
        AllowedPattern: '[a-zA-Z0-9\-]+\..+'
        Description: Fully qualified domain name (FQDN). For example, example.com.
        MaxLength: '255'
        MinLength: '2'
        Type: String
    ADDnsIpAddresses:
        Description: A comma separated list of DNS IP addresses.
        MaxLength: '255'
        MinLength: '2'
        Type: String
    DomainMemberSGID:
        Description: ID of the domain member security group (for example, sg-9cb7d0e5).
        Type: String
    WorkloadInstanceType:
        Default: r5.large
        Description: EC2 instance type for the workload instances.
        Type: String
    MSSQLMediaBucketName:
        Description: The S3 bucket name from where the SQL Server media can be downloaded. 
                    This string can include numbers, lowercase letters, uppercase letters, and hyphens (-). 
                    It cannot start or end with a hyphen (-).
        Type: String
    MSSQLMediaPathKey:
        Default: launchwizardscripts/sqlmedia/sqlserver.iso
        Description: The S3 bucket key from where the SQL Server media can be downloaded. 
                    This string can include numbers, lowercase letters, uppercase letters, hyphens (-), and a forward slash (/).
        Type: String
    SQLAdminAccounts:
        Default: sqlsa
        Description: User name for the SQL Server DB service account administrator. 
                    It can be the AD domain admin or other local or domain users.
        MaxLength: '25'
        MinLength: '5'
        Type: String
    NumberOfNodes:
        Default: '1'
        Description: The number of SQL Server nodes to create.
        Type: String
    RouteTableId:
        Description: Comma separated list of all route table IDs for SQL Server subnets.
        Type: String
    SQLSvmName:
        Description: Name of the storage virtual machine (SVM) that will host the SQL Server workload.
        Type: String
        Default: SQLVM
    SQLigroupname:
        Description: igroup name for the SQL Server.
        Type: String
        Default: SQLIQN
    FSxDataVolumeName:
        Description: The name of the volume for SQL Server data.
        Type: String
        Default: SQLData
    FSxLogVolumeName:
        Description: The name of the volume for the SQL Server log.
        Type: String
        Default: SQLLog
    FSxTempDbVolumeName:
        Description: The name of the volume for the tempdb system database.
        Type: String
        Default: SQLTempDb
    FSxDataLunSize:
        Description: The size of the LUN for SQL data, in GB.
        Type: String
    ONTAPSecurityGroupID:
        Description: ID of the FSx for ONTAP security group.
        Type: String
    FSxFileSystemId:
        Description: ID for the FSx for ONTAP file system.
        Type: String
    SqlServerName:
        Description: Name for the SQL Server.
        Type: String
Conditions:
    ADSGNotSelected: !Equals
        - !Ref 'DomainMemberSGID'
        - ''
    LogFeatureEnabled: !Equals
        - !Ref 'EnableCloudWatchLogFeature'
        - 'true'
Rules:
    KeyPairsNotEmpty:
        Assertions:
            - Assert: !Not
                  - !EachMemberEquals
                    - !RefAll 'AWS::EC2::KeyPair::KeyName'
                    - ''
              AssertDescription: Kay Pair must not be empty
    SubnetsInVPC:
        Assertions:
            - Assert: !EachMemberIn
                  - !ValueOfAll
                    - AWS::EC2::Subnet::Id
                    - VpcId
                  - !RefAll 'AWS::EC2::VPC::Id'
              AssertDescription: All subnets must be in the VPC
Resources:
    DisableIMDSv1:
        Type: AWS::EC2::LaunchTemplate
        Properties:
            LaunchTemplateData:
                MetadataOptions:
                    HttpEndpoint: enabled
                    HttpTokens: required
    LaunchWizardSqlFSxProfile:
        Type: AWS::IAM::InstanceProfile
        Properties:
            Roles:
                - !Ref 'Ec2RoleName'
            Path: /
    NetworkInterface:
        Type: AWS::EC2::NetworkInterface
        Properties:
            SecondaryPrivateIpAddressCount: 2
            SubnetId: !Ref 'PrivateSubnetID'
            GroupSet: !If
                - ADSGNotSelected
                - !Split
                  - ','
                  - !Join
                    - ','
                    - - !Ref 'WorkloadSecurityGroup'
                      - !Ref 'ONTAPSecurityGroupID'
                - !Split
                  - ','
                  - !Join
                    - ','
                    - - !Ref 'WorkloadSecurityGroup'
                      - !Ref 'ONTAPSecurityGroupID'
                      - !Ref 'DomainMemberSGID'
            Tags:
                - Key: Name
                  Value: !Ref 'SqlFSxServerNetBIOSName'
                - Key: SQLServerName
                  Value: !Ref 'SqlServerName'
    SqlNode:
        Type: AWS::EC2::Instance
        CreationPolicy:
            ResourceSignal:
                Count: '1'
                Timeout: PT90M
        Metadata:
            AWS::CloudFormation::Init:
                configSets:
                    config:
                        - ConfigureCWLogs
                        - FetchResources
                        - ScriptSignatureVerificationandExtract
                        - InitialSetup
                        - ontapconfig
                        - InstancePrep
                        - SQLIncludedConfigure
                        - Configure
                        - Cleanup
                        - Finalize
                ConfigureCWLogs:
                    files:
                        C:\Program Files\Amazon\SSM\Plugins\awsCloudWatch\AWS.EC2.Windows.CloudWatch.json:
                            content: !If
                                - LogFeatureEnabled
                                - !Join
                                  - ''
                                  - - '{'
                                    - '  "IsEnabled" : true,'
                                    - '  "EngineConfiguration" : {'
                                    - '    "PollInterval" : "00:00:05",'
                                    - '    "Components" : [{'
                                    - '      "Id" : "ApplicationEventLog",'
                                    - '      "FullName" : "AWS.EC2.Windows.CloudWatch.EventLog.EventLogInputComponent,AWS.EC2.Windows.CloudWatch",'
                                    - '      "Parameters" : {'
                                    - '        "LogName" : "Application",'
                                    - '        "Levels" : "7"'
                                    - '      }'
                                    - '    },'
                                    - '    {'
                                    - '      "Id": "CfnInitLog",'
                                    - '      "FullName": "AWS.EC2.Windows.CloudWatch.CustomLog.CustomLogInputComponent,AWS.EC2.Windows.CloudWatch",'
                                    - '      "Parameters": {'
                                    - '        "LogDirectoryPath": "C:\\cfn\\log",'
                                    - '        "LogName" : "CfnInit",'
                                    - '        "Levels" : "7",'
                                    - '        "TimestampFormat": "yyyy-MM-dd HH:mm:ss,fff",'
                                    - '        "Encoding": "ASCII",'
                                    - '        "CultureName": "en-US",'
                                    - '        "TimeZoneKind": "Local"'
                                    - '      }'
                                    - '    },'
                                    - '    {'
                                    - '      "Id": "CloudWatchCfnInitLog",'
                                    - '      "FullName": "AWS.EC2.Windows.CloudWatch.CloudWatchLogsOutput,AWS.EC2.Windows.CloudWatch",'
                                    - '      "Parameters": {'
                                    - '        "AccessKey": "",'
                                    - '        "SecretKey": "",'
                                    - !Sub '        "Region": "${AWS::Region}",'
                                    - !Sub '        "LogGroup": "${ParentStackName}",'
                                    - '        "LogStream": "{instance_id}"'
                                    - '      }'
                                    - '    },'
                                    - '    {'
                                    - '      "Id" : "CloudWatch",'
                                    - '      "FullName" : "AWS.EC2.Windows.CloudWatch.CloudWatch.CloudWatchOutputComponent,AWS.EC2.Windows.CloudWatch",'
                                    - '      "Parameters" : {'
                                    - '        "AccessKey" : "",'
                                    - '        "SecretKey" : "",'
                                    - !Sub '        "Region": "${AWS::Region}",'
                                    - '        "NameSpace" : "Windows/Default"'
                                    - '      }'
                                    - '    }],'
                                    - '    "Flows": {'
                                    - '      "Flows": ['
                                    - '        "CfnInitLog,CloudWatchCfnInitLog"'
                                    - '      ]'
                                    - '    }'
                                    - '  }'
                                    - '}'
                                - ' { "IsEnabled" : false}'
                    commands:
                        a-enableSSM:
                            command: powershell.exe -Command "Set-Service -Name AmazonSSMAgent -StartupType
                                Automatic"
                            waitAfterCompletion: '30'
                        b-restartSSM:
                            command: powershell.exe -Command "Restart-Service AmazonSSMAgent -Force"
                            waitAfterCompletion: '30'
                FetchResources:
                    files:
                        C:\cfn\scripts\Verify-Signature.ps1:
                            source: {{{ ScriptVerifySignature }}}
                        C:\cfn\scripts\Unzip-Archive.ps1:
                            source: {{{ ScriptUnzipArchive }}}
                        C:\cfn\scripts\common.zip:
                            source: {{{ ScriptCommon }}}
                        C:\cfn\scripts\sqlfci.zip:
                            source: {{{ ScriptSQLFCI }}}
                        C:\cfn\scripts\sqlontap.zip:
                            source: {{{ ScriptSQLONTAP }}}
                        C:\cfn\scripts\dbcreate.zip:
                            source: {{{ ScriptDBCREATE}}}
                        C:\cfn\DSC.zip:
                            source: {{{ DSC }}}
                        C:\cfn\Installer\powershell.zip:
                            source: {{{ PowerShell }}}
                        C:\cfn\modules\AWSLaunchWizardForCFN.zip:
                            source: {{{ AmazonLaunchWizardForCFN }}}
                        C:\cfn\modules\AWSLaunchWizardForSSM.zip:
                            source: {{{ AmazonLaunchWizardForSSM }}}
                        C:\cfn\Installer\sqlspcu.zip:
                            source: {{{ Sqlspcu }}}
                        C:\cfn\Installer\dependent-packages.zip:
                            source: {{{ DependentPackages }}}
                ScriptSignatureVerificationandExtract:
                    commands:
                        a-unpack-common-scripts:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\scripts\common.zip -Destination C:\cfn\scripts
                            waitAfterCompletion: '0'
                        b-unpack-DSC-scripts:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\DSC.zip -Destination C:\cfn
                            waitAfterCompletion: '0'
                        c-unpack-sqlfci-scripts:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\scripts\sqlfci.zip -Destination C:\cfn\scripts
                            waitAfterCompletion: '0'
                        d-unpack-sqlontap-scripts:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\scripts\sqlontap.zip -Destination C:\cfn\scripts
                            waitAfterCompletion: '0'
                        e-unpack-sqlspcu-scripts:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\Installer\sqlspcu.zip -Destination C:\cfn
                        f-unpack-powershell-scripts:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\Installer\powershell.zip -Destination C:\cfn\Installer
                        g-unpack-dbcreate-scripts:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\scripts\dbcreate.zip -Destination C:\cfn\scripts
                        h-move-execurequeryfromssmscript:
                            command: powershell.exe -Command  Copy-Item  C:\cfn\scripts\common\ExecuteQueryFromSSM.ps1 -Destination (New-Item -Path C:\SSM\ -Type Directory )  -Recurse
                            waitAfterCompletion: 0
                        i-move-ontapscript:
                            command: powershell.exe -Command  Copy-Item  C:\cfn\scripts\sqlontap\OntapRestGet.ps1 -Destination C:\SSM\
                            waitAfterCompletion: 0
                        j-move-mappedontapvolumesscript:
                            command: powershell.exe -Command  Copy-Item  C:\cfn\scripts\sqlontap\Get-MappedOntapVolumes.ps1 -Destination C:\SSM\
                            waitAfterCompletion: 0
                        k-move-dbcreatescripts:
                            command: powershell.exe -Command  Copy-Item  C:\cfn\scripts\dbcreate\* -Destination C:\SSM\ -Recurse
                            waitAfterCompletion: 0
                        l-hide-ssm:
                            command: powershell.exe -Command C:\cfn\scripts\common\HideAllSSMScripts.ps1
                            waitAfterCompletion: 0 
                        m-unpack-dependentpackages:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\Installer\dependent-packages.zip -Destination C:\cfn\Installer
                InitialSetup:
                    commands:
                        a-unpack-launchwizard-module:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\modules\AWSLaunchWizardForCFN.zip -Destination 'C:\Program
                                Files\WindowsPowerShell\Modules\'
                            waitAfterCompletion: 0
                        b-unpack-launchwizard-module:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\modules\AWSLaunchWizardForSSM.zip -Destination 'C:\Program
                                Files\WindowsPowerShell\Modules\'
                        c-initialize-disks:
                            command: powershell.exe -Command "C:\cfn\scripts\common\InitializeDisks.ps1"
                            waitAfterCompletion: 0
                        d-install-dsc-modules:
                            command: !Join
                                - ''
                                - - powershell.exe -Command "C:\cfn\scripts\sqlfci\install-dsc-modules.ps1 -ResourceID SqlNode -Stackname '"
                                  - !Ref 'AWS::StackName'
                                  - '''"'
                        e-config-LCM:
                            command: powershell.exe -Command "C:\cfn\scripts\sqlfci\LCM-Config.ps1"
                            waitAfterCompletion: 0
                        f-rename-computer:
                            command: !Join
                                - ''
                                - - powershell.exe -Command "C:\cfn\scripts\common\Rename-Computer.ps1
                                    -Restart -NewName '
                                  - !Ref 'SqlServerName'
                                  - '''"'
                            waitAfterCompletion: 0
                        g-restart-computer:
                            command: powershell.exe -Command "C:\cfn\scripts\common\Restart-Computer.ps1"
                            waitAfterCompletion: forever
                ontapconfig:
                    commands:
                        a-install-ontap-prereqs:
                            command: powershell.exe -Command C:\cfn\scripts\sqlontap\install-ONTAPprereqs.ps1
                            waitAfterCompletion: 0
                        b-install-powershell-7:
                            command: powershell.exe -Command C:\cfn\scripts\sqlontap\install-powershell7.ps1
                        c-restart-computer:
                            command: powershell.exe -Command "C:\cfn\scripts\common\Restart-Computer.ps1"
                            waitAfterCompletion: forever
                        d-configure-ontap:
                            command: !Join
                                - ''
                                - - pwsh -Command "C:\cfn\scripts\sqlontap\Configure-ONTAP.ps1 -Parentstackname
                                    '
                                  - !Ref 'ParentStackName'
                                  - "' -SQLVMName '"
                                  - !Ref 'SQLSvmName'
                                  - "' -FSxDataVolumeName '"
                                  - !Ref 'FSxDataVolumeName'
                                  - "' -FSxLogVolumeName '"
                                  - !Ref 'FSxLogVolumeName'
                                  - "' -FileSystemId '"
                                  - !Ref 'FSxFileSystemId'
                                  - "' -FSxTempDbVolumeName '"
                                  - !Ref 'FSxTempDbVolumeName'
                                  - "' -FSxDataLunSize '"
                                  - !Ref 'FSxDataLunSize'
                                  - "' -IGROUP '"
                                  - !Ref 'SQLigroupname'
                                  - "' -ResourceID SqlNode -Stackname '"
                                  - !Ref 'AWS::StackName'
                                  - '''"'
                        e-connect-ontap-instance:
                            command: !Join
                                - ''
                                - - powershell.exe -Command "C:\cfn\scripts\sqlontap\Connect-ONTAPInstance.ps1
                                    -FileSystemId '
                                  - !Ref 'FSxFileSystemId'
                                  - "' -ResourceID SqlNode -Stackname '"
                                  - !Ref 'AWS::StackName'
                                  - '''"'
                            waitAfterCompletion: 0
                        f-init-iscsi-disk:
                            command: powershell.exe -Command "C:\cfn\scripts\sqlontap\Initialize-Iscsidisk.ps1 -IsFCI false"
                InstancePrep:
                    commands:
                        a-enable-credssp:
                            command: powershell.exe -ExecutionPolicy RemoteSigned -Command "C:\cfn\scripts\common\Enable-CredSSP.ps1"
                            waitAfterCompletion: 0
                        b-restart-computer:
                            command: powershell.exe -Command "C:\cfn\scripts\common\Restart-Computer.ps1"
                            waitAfterCompletion: forever
                        c-set-dns:
                            command: !Join
                                - ''
                                - - powershell.exe -Command "C:\cfn\scripts\sqlfci\Add-DNSEntry.ps1
                                    -ADServerPrivateIP '
                                  - !Select
                                    - 0
                                    - !Split
                                      - ','
                                      - !Ref 'ADDnsIpAddresses'
                                  - "' -DomainDNSName '"
                                  - !Ref 'DomainDNSName'
                                  - '''"'
                            waitAfterCompletion: 0
                        d-update-dnssuffixlist:
                            command: !Join
                                - ''
                                - - powershell.exe -Command "C:\cfn\scripts\common\Update-DNSSuffixSearchList.ps1
                                    -DomainDNSName '
                                  - !Ref 'DomainDNSName'
                                  - '''"'
                            waitAfterCompletion: 0
                        e-join-domain:
                            command: !Join
                                - ''
                                - - powershell.exe -Command "C:\cfn\scripts\sqlfci\Join-Domain.ps1
                                    -DomainDNSName '
                                  - !Ref 'DomainDNSName'
                                  - "' -Parentstackname '"
                                  - !Ref 'ParentStackName'
                                  - "' -DomainAdminUser '"
                                  - !Ref 'DomainAdminUser'
                                  - '''"'
                            waitAfterCompletion: forever
                        f-add-domadmin-user-to-group:
                            command: !Join
                                - ''
                                - - 'powershell.exe '
                                  - '-ExecutionPolicy RemoteSigned '
                                  - -Command "
                                  - ' C:\cfn\scripts\common\AddUserToGroup.ps1 -UserName '''
                                  - !Ref 'DomainAdminUser'
                                  - ''' -GroupName ''Administrators''"'
                            waitAfterCompletion: '0'
                        g-create-sql-account:
                            command: !Join
                                - ''
                                - - powershell.exe -Command "C:\cfn\scripts\sqlfci\Create-ADServiceAccount.ps1
                                    -DomainAdminUser '
                                  - !Ref 'DomainAdminUser'
                                  - "' -DomainDNSName '"
                                  - !Ref 'DomainDNSName'
                                  - "' -ServiceAccountUser '"
                                  - !Ref 'SQLAdminAccounts'
                                  - "' -Parentstackname '"
                                  - !Ref 'ParentStackName'
                                  - '''"'
                            waitAfterCompletion: '0'
                        h-wait-for-ad-replication:
                            command: !Join
                                - ''
                                - - 'powershell.exe '
                                  - '-ExecutionPolicy RemoteSigned '
                                  - -Command "
                                  - C:\cfn\scripts\common\Test-ADUser.ps1 -UserName '
                                  - !Ref 'SQLAdminAccounts'
                                  - ''' -Wait -TimeoutMinutes 30 -IntervalMinutes 1"'
                            waitAfterCompletion: '0'
                        i-add-sqlservice-user-to-group:
                            command: !Join
                                - ''
                                - - 'powershell.exe '
                                  - '-ExecutionPolicy RemoteSigned '
                                  - -Command "
                                  - C:\cfn\scripts\common\AddUserToGroup.ps1 -UserName '
                                  - !Ref 'SQLAdminAccounts'
                                  - ''' -GroupName ''Administrators''"'
                            waitAfterCompletion: '0'
                SQLIncludedConfigure:
                    commands:
                        a-add-buildtin-admins-to-sysadmin:
                            command: powershell.exe -Command "C:\cfn\DSC\PostConfigDSC.ps1"
                            waitAfterCompletion: '0'
                        d-configure-sql:
                            command: !Join
                                - ''
                                - - powershell.exe -Command "C:\cfn\scripts\common\Reconfigure-SQL.ps1 -DomainAdminUser '
                                  - !Ref 'DomainAdminUser'
                                  - "' -SQLServiceAccount '"
                                  - !Ref 'SQLAdminAccounts'
                                  - "' -Parentstackname '"
                                  - !Ref 'ParentStackName'
                                  - "' -NetBIOSName '"
                                  - !Ref 'SqlServerName'
                                  - '''"'
                            waitAfterCompletion: '0'
                Configure:
                    commands:
                        a-set-maxdop:
                            command: !Join
                                - ''
                                - - powershell.exe -Command "C:\cfn\scripts\common\SetMaxDOP.ps1 -DomainAdminUser '
                                  - !Ref 'DomainAdminUser'
                                  - "' -Parentstackname '"
                                  - !Ref 'ParentStackName'
                                  - "' -NetBIOSName '"
                                  - !Ref 'SqlServerName'
                                  - '''"'
                            waitAfterCompletion: '0'
                        b-set-sqlinstancename:
                            command: !Join
                                - ''
                                - - powershell.exe -Command "C:\cfn\scripts\common\Set-SQLInstanceName.ps1 -DomainAdminUser '
                                  - !Ref 'DomainAdminUser'
                                  - "' -Parentstackname '"
                                  - !Ref 'ParentStackName'
                                  - "' -NetBIOSName '"
                                  - !Ref 'SqlServerName'
                                  - '''"'
                            waitAfterCompletion: '0'
                        c-create-fsxparameter:
                            command: !Join
                                - ''
                                - - powershell.exe -Command "C:\cfn\scripts\common\Create-FsxParameter.ps1 -FSxID '
                                  - !Ref 'FSxFileSystemId'
                                  - "' -Parentstackname '"
                                  - !Ref 'ParentStackName'
                                  - '''"'
                            waitAfterCompletion: 0

                Cleanup:
                    commands:
                        b-disable-credssp:
                            command: powershell.exe -ExecutionPolicy RemoteSigned -Command "C:\cfn\scripts\common\Disable-CredSSP.ps1"
                            waitAfterCompletion: 0
                        c-cleanup-scripts:
                            command: powershell -Command "Remove-Item C:\cfn\scripts -Recurse -Force"
                            waitAfterCompletion: '0'
                        d-cleanup-DSC:
                            command: powershell -Command "Remove-Item C:\cfn\DSC* -Force -Recurse"
                            waitAfterCompletion: '0'
                Finalize:
                    commands:
                        a-signal-resource:
                            command: !Sub "cfn-signal.exe -e %ERRORLEVEL% --resource SqlNode\
                                \ --stack ${AWS::StackName} --region ${AWS::Region}\n"
                            waitAfterCompletion: 0
        Properties:
            ImageId: !Ref 'AMIID'
            IamInstanceProfile: !Ref 'LaunchWizardSqlFSxProfile'
            InstanceType: !Ref 'WorkloadInstanceType'
            NetworkInterfaces:
                - NetworkInterfaceId: !Ref 'NetworkInterface'
                  DeviceIndex: 0
            Tags:
                - Key: Name
                  Value: !Ref 'SqlFSxServerNetBIOSName'
            BlockDeviceMappings:
                - DeviceName: /dev/sda1
                  Ebs:
                      VolumeSize: '100'
                      VolumeType: gp3
            KeyName: !Ref 'KeyPairName'
            UserData: !Base64
                Fn::Join:
                    - ''
                    - - ''
                      - <powershell>
                      - 'cfn-init.exe -v -c config -s '
                      - !Ref 'AWS::StackId'
                      - ' -r SqlNode'
                      - ' --region '
                      - !Ref 'AWS::Region'
                      - </powershell>
    WorkloadSecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupDescription: Allow access to the Workload instances
            VpcId: !Ref 'VPCID'
            SecurityGroupIngress:
                - IpProtocol: tcp
                  FromPort: 53
                  ToPort: 53
                  CidrIp: !Sub '${ADDnsIpAddresses}/32'
