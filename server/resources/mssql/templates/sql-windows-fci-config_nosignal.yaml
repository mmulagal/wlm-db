#prettier-ignore
---
AWSTemplateFormatVersion: '2010-09-09'
Description: This template deploys SQL Server failover cluster instances using NetApp FSx for ONTAP in an existing VPC.
            This template creates EC2 instances and related resources. 
            You will be billed for the AWS resources used if you create a stack from this template.
Metadata:
    AWS::CloudFormation::Interface:
        ParameterGroups:
            - Label:
                  default: Network Configuration
              Parameters:
                  - VPCID
                  - VPCCIDR
                  - PrivateSubnet1ID
                  - PrivateSubnet2ID
                  - RouteTable1Id
                  - RouteTable2Id
            - Label:
                  default: Microsoft Active Directory Configuration
              Parameters:
                  - DomainDNSName
                  - DomainAdminUser
                  - ADDnsIpAddresses
                  - DomainMemberSGID
                  - PreferredDomainController
                  - OUPath
            - Label:
                  default: Amazon EC2 Configuration
              Parameters:
                  - SqlFSxServerNetBIOSName1
                  - SqlFSxServerNetBIOSName2
                  - KeyPairName
                  - WorkloadInstanceType
                  - EBSVolumeSize
            - Label:
                  default: Amazon FSx for ONTAP Volume Configuration
              Parameters:
                  - FSxFileSystemId
                  - SQLSvmName
                  - FSxDataLunSize
                  - FSxDataVolumeName
                  - FSxLogVolumeName
                  - FSxTempDbVolumeName
                  - FSxQuorumVolumeName
                  - SQLigroupname
                  - ONTAPSecurityGroupID
                  - FsxVolumeSnapshotPolicy
            - Label:
                  default: Microsoft SQL Server FCI configurations
              Parameters:
                  - MSSQLMediaBucketName
                  - MSSQLMediaPathKey
                  - NumberOfNodes
                  - SqlFSxWSFCName
                  - SqlFSxFCIName
                  - SQLAdminAccounts
                  - AMIID
                  - BYOLAMI
                  - SqlCollation
            - Label:
                  default: AWS Configuration
              Parameters:
                  - EnableCloudWatchLogFeature
                  - ParentStackName
        ParameterLabels:
            KeyPairName:
                default: Key Pair Name for the Ec2 instances
            PrivateSubnet1ID:
                default: Private Subnet 1 ID for the first SQL node for existing VPC e.g subnet-000dc866d93550eb0
            PrivateSubnet2ID:
                default: Private Subnet 2 ID for the second SQL Node existing VPC e.g subnet-000dc866d93550eb0
            RouteTable1Id:
                default: ID of the route table for private subnet 1.
            RouteTable2Id:
                default: ID of the route table for private subnet 2.
            AMIID:
                default: AMI ID of the AMI used to launch Instances e.g ami-0b8aa9827ffff6e39
            VPCID:
                default: VPC ID if the instances are launched in an exiting VPC e.g vpc-04e3ac96d2f5ac570
            VPCCIDR:
                default: VPCCIDR for instances launched in existing VPC. Also used for setting
                    up security groups. e.g 10.0.0.8/16
            WorkloadInstanceType:
                default: Workload Servers Instance Type for SQL EC2 Instances e.g r4.xlarge
            DomainAdminUser:
                default: Domain Admin User Name e.g Administrator
            DomainDNSName:
                default: Domain DNS Name e.g example.com
            DomainMemberSGID:
                default: Security Group ID for AD Domain Members e.g sg-0b7b0431023b4208a
            SqlFSxServerNetBIOSName1:
                default: Server1 NetBIOS Name e.g SQLFSX01
            SqlFSxServerNetBIOSName2:
                default: Server2 NetBIOS Name e.g SQLFSX02
            FileShareVolumeSize:
                default: FSx for ONTAP capacity in GiB e.g 1024
            FileShareThroughputCapacity:
                default: Data throughput capacity (MB/s) e.g 16 MBps
            ADDnsIpAddresses:
                default: Comma Seperated List of DNS addresses for existing AD e.g 10.0.0.10,10.0.16.10
            SQLStorageVMName:
                default: SQL Storage VM Name for ONTAP
            ONTAPSecurityGroupID:
                default: Security Group ID for FSxN
            FSxDataLunSize:
                default: Projected SQL Data size
            SQLigroupname:
                default: SQL igroup name
            FSxDataVolumeName:
                default: SQL data volume name
            FSxQuorumVolumeName:
                default: WFC Quorum volume name
            FSxLogVolumeName:
                default: SQL log volume name
            FSxTempDbVolumeName:
                default: SQL tempDb volume name
            FSxFileSystemId:
                default: File system ID for FSxN
            SQLSvmName:
                default: SVM for creating SQL volumes
            NumberOfNodes:
                default: Number of SQL Nodes
            EnableCloudWatchLogFeature:
                default: (optional) Enable monitoring by CloudWatch Logging
            ParentStackName:
                default: Name of the parent CloudFormation stack
            FsxVolumeSnapshotPolicy:
                default: Snapshot policy for the volume. Can be either daily_weekretention or none.
            EBSVolumeSize:
                default: Size of the EBS Volume in GiB.
            PreferredDomainController:
                default: (optional) Preferred domain controller to use for AD join
            OUPath:
                default: (optional) Preferred organizational unit in the AD to join.    
Parameters:
    ParentStackName:
        Description: Name of the parent CloudFormation stack.
        Type: String
    Ec2RoleName:
        Default: AmazonEC2RoleForLaunchWizard
        Description: EC2 instance role name.
        Type: String
    EnableCloudWatchLogFeature:
        Default: false
        Description: Enable AWS CloudWatch logging.
        Type: String
    LogGroupName:
        Default: SQLDLOG
        Description: A name for the SQL Server log group.
        Type: String
    UniqueID:
        Default: SQL123
        Description: Automation execution unique ID.
        Type: String
    AMIID:
        Description: ID of the AMI to use.
        Type: String
        Default: ami-06c634c2148dc0856
    BYOLAMI:
        Default: 'false'
        Description: Whether the AMI is license included or bring your own license.
        Type: String
    KeyPairName:
        Description: Name of an existing EC2 key pair. All instances will launch with
            this key pair.
        Type: AWS::EC2::KeyPair::KeyName
    PrivateSubnet1ID:
        Description: ID of the private subnet 1 in Availability Zone 1 for the SQL Server (for example, subnet-a0246dcd).
        Type: String
    PrivateSubnet2ID:
        Description: ID of the private subnet 2 in Availability Zone 2 for the SQL Server (for example, subnet-a0246dcd). This field is required for SQL Server failover instances, but not required for standalone instances.
        Type: String
    VPCID:
        Description: ID of your existing VPC for deployment.
        Type: String
    VPCCIDR:
        AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$
        ConstraintDescription: CIDR block parameter must be in the form x.x.x.x/16-28
        Description: CIDR Block for the VPC.
        Type: String
    SqlFSxServerNetBIOSName1:
        AllowedPattern: '[a-zA-Z0-9\-]+'
        Default: SqlFSx1
        Description: NetBIOS name of the SQL Server (up to 15 characters).
        MaxLength: '15'
        MinLength: '1'
        Type: String
    SqlFSxServerNetBIOSName2:
        AllowedPattern: '[a-zA-Z0-9\-]+'
        Default: SqlFSx2
        Description: NetBIOS name of the SQL Server (up to 15 characters).
        MaxLength: '15'
        MinLength: '1'
        Type: String
    SqlFSxWSFCName:
        AllowedPattern: '[a-zA-Z0-9\-]+'
        Default: WSFC
        Description: Windows Server failover cluster name.
        MaxLength: '15'
        MinLength: '1'
        Type: String
    SqlFSxFCIName:
        AllowedPattern: '[a-zA-Z0-9\-]+'
        Default: DBSFCI
        Description: Name for the SQL Server failover cluster instance.
        MaxLength: '15'
        MinLength: '1'
        Type: String
    SqlCollation:
        Description: Name for the SQL Server collation.
        Type: String
        MinLength: '1'
    DomainAdminUser:
        AllowedPattern: ([a-zA-Z0-9]+(\.|_|-|@)*)+
        Default: admin
        Description: User name for the account that will be used as Domain Administrator.
            This is separate from the default "Administrator" account.
        MaxLength: '25'
        MinLength: '5'
        Type: String
    DomainDNSName:
        AllowedPattern: '[a-zA-Z0-9\-]+\..+'
        Description: Fully qualified domain name (FQDN). For example, example.com.
        MaxLength: '255'
        MinLength: '2'
        Type: String
    ADDnsIpAddresses:
        Description: Comma separated list of DNS IP addresses.
        MaxLength: '255'
        MinLength: '2'
        Type: String
    DomainMemberSGID:
        Description: ID of the Domain Member Security Group (e.g., sg-9cb7d0e5).
        Type: String
    WorkloadInstanceType:
        Default: r5.large
        Description: EC2 instance type for the workload instances.
        Type: String
    MSSQLMediaBucketName:
        Default: LaunchWizard-sqlha
        Description:  The S3 bucket name from where SQL Server media can be downloaded. 
                    This string can include numbers, lowercase letters, uppercase letters, and hyphens (-). 
                    It cannot start or end with a hyphen (-).
        Type: String
    MSSQLMediaPathKey:
        Default: launchwizardscripts/sqlmedia/sqlserver.iso
        Description: User name for the service account administrator on the SQL Server. 
                    It can be the Active Directory domain admin or other local or domain users.
        Type: String
    SQLAdminAccounts:
        Default: sqlsa
        Description: User name to be used as MSSQL DB Service Account Administrator. It
            could be AD domain admin, other local or domain users.
        MaxLength: '25'
        MinLength: '5'
        Type: String
    NumberOfNodes:
        Default: '2'
        Description: The number of SQL Server instances to create.
        Type: String
    RouteTable1Id:
        Description: A comma separated list of all route table IDs for primary SQL subnet.
        Type: String
    RouteTable2Id:
        Description: A comma separated list of all route table IDs for standby SQL subnet.
        Type: String
    SQLSvmName:
        Description: Name of the storage virtual machine (SVM) that will host the SQL Server workload.
        Type: String
        Default: SQLVM
    SQLigroupname:
        Description: igroup name for the SQL Server.
        Type: String
        Default: SQLIQN
    FSxDataVolumeName:
        Description: The name of the volume for SQL Server data.
        Type: String
        Default: SQLData
    FSxLogVolumeName:
        Description: The name of the volume for the SQL Server log.
        Type: String
        Default: SQLLog
    FSxTempDbVolumeName:
        Description: The name of the volume for the tempdb system database.
        Type: String
        Default: SQLTempDb
    FSxQuorumVolumeName:
        Description: The quorum volume name for the Windows Failover cluster.
        Type: String
        Default: WFCQuorum
    FSxDataLunSize:
        Description: The size of the SQL Server data LUN in megabytes (MiB).
        Type: String
    ONTAPSecurityGroupID:
        Description: Security group ID for FSx for ONTAP.
        Type: String
    FSxFileSystemId:
        Description: ID of the FSx for ONTAP file system.
        Type: String
    FsxVolumeSnapshotPolicy:
        Description: Snapshot policy for the volume. Can be either daily_weekretention or none.
        Type: String
        Default: daily_weekretention
        AllowedValues: [daily_weekretention, none]
    EBSVolumeSize:
        Description:  Size of the EBS Volume in GiB.
        Type: String
    PreferredDomainController:
        Description: (optional) Preferred domain controller to use for AD join.
        Type: String
        Default: default
    OUPath:
        Description: (optional) Preferred organizational unit in the AD to join.
        Type: String
        Default: default 
Conditions:
    ADSGNotSelected: !Equals
        - !Ref 'DomainMemberSGID'
        - ''
    LogFeatureEnabled: !Equals
        - !Ref 'EnableCloudWatchLogFeature'
        - 'true'
        
Rules:
    KeyPairsNotEmpty:
        Assertions:
            - Assert: !Not
                  - !EachMemberEquals
                    - !RefAll 'AWS::EC2::KeyPair::KeyName'
                    - ''
              AssertDescription: Kay Pair must not be empty
    SubnetsInVPC:
        Assertions:
            - Assert: !EachMemberIn
                  - !ValueOfAll
                    - AWS::EC2::Subnet::Id
                    - VpcId
                  - !RefAll 'AWS::EC2::VPC::Id'
              AssertDescription: All subnets must be in the VPC
Resources:
    DisableIMDSv1:
        Type: AWS::EC2::LaunchTemplate
        Properties:
            LaunchTemplateData:
                MetadataOptions:
                    HttpEndpoint: enabled
                    HttpTokens: required
    LaunchWizardSqlFSxProfile:
        Type: AWS::IAM::InstanceProfile
        Properties:
            Roles:
                - !Ref 'Ec2RoleName'
            Path: /
    NetworkInterface1:
        Type: AWS::EC2::NetworkInterface
        Properties:
            SecondaryPrivateIpAddressCount: 2
            SubnetId: !Ref 'PrivateSubnet1ID'
            GroupSet: !If
                - ADSGNotSelected
                - !Split
                  - ','
                  - !Join
                    - ','
                    - - !Ref 'WorkloadSecurityGroup'
                      - !Ref 'ONTAPSecurityGroupID'
                - !Split
                  - ','
                  - !Join
                    - ','
                    - - !Ref 'WorkloadSecurityGroup'
                      - !Ref 'ONTAPSecurityGroupID'
                      - !Ref 'DomainMemberSGID'
            Tags:
                - Key: Name
                  Value: !Ref 'SqlFSxServerNetBIOSName1'
    NetworkInterface2:
        Type: AWS::EC2::NetworkInterface
        Properties:
            SecondaryPrivateIpAddressCount: 2
            SubnetId: !Ref 'PrivateSubnet2ID'
            GroupSet: !If
                - ADSGNotSelected
                - !Split
                  - ','
                  - !Join
                    - ','
                    - - !Ref 'WorkloadSecurityGroup'
                      - !Ref 'ONTAPSecurityGroupID'
                - !Split
                  - ','
                  - !Join
                    - ','
                    - - !Ref 'WorkloadSecurityGroup'
                      - !Ref 'ONTAPSecurityGroupID'
                      - !Ref 'DomainMemberSGID'
            Tags:
                - Key: Name
                  Value: !Ref 'SqlFSxServerNetBIOSName2'
    SqlFSxInstanceMAD1:
        Type: AWS::EC2::Instance
        CreationPolicy:
            ResourceSignal:
                Count: '1'
                Timeout: PT180M
        Metadata:
            AWS::CloudFormation::Init:
                configSets:
                    config:
                        - ConfigureCWLogs
                        - FetchResources
                        - ScriptSignatureVerificationandExtract
                        - InitialSetup
                        - InstancePrep
                        - ontapconfig
                        - ConfigureInstance
                        - FCIConfigure
                        - Cleanup
                        - Finalize
                ConfigureCWLogs:
                    files:
                        C:\Program Files\Amazon\SSM\Plugins\awsCloudWatch\AWS.EC2.Windows.CloudWatch.json:
                            content: !If
                                - LogFeatureEnabled
                                - !Join
                                  - ''
                                  - - '{'
                                    - '  "IsEnabled" : true,'
                                    - '  "EngineConfiguration" : {'
                                    - '    "PollInterval" : "00:00:05",'
                                    - '    "Components" : [{'
                                    - '      "Id" : "ApplicationEventLog",'
                                    - '      "FullName" : "AWS.EC2.Windows.CloudWatch.EventLog.EventLogInputComponent,AWS.EC2.Windows.CloudWatch",'
                                    - '      "Parameters" : {'
                                    - '        "LogName" : "Application",'
                                    - '        "Levels" : "7"'
                                    - '      }'
                                    - '    },'
                                    - '    {'
                                    - '      "Id": "CfnInitLog",'
                                    - '      "FullName": "AWS.EC2.Windows.CloudWatch.CustomLog.CustomLogInputComponent,AWS.EC2.Windows.CloudWatch",'
                                    - '      "Parameters": {'
                                    - '        "LogDirectoryPath": "C:\\cfn\\log",'
                                    - '        "LogName" : "CfnInit",'
                                    - '        "Levels" : "7",'
                                    - '        "TimestampFormat": "yyyy-MM-dd HH:mm:ss,fff",'
                                    - '        "Encoding": "ASCII",'
                                    - '        "CultureName": "en-US",'
                                    - '        "TimeZoneKind": "Local"'
                                    - '      }'
                                    - '    },'
                                    - '    {'
                                    - '      "Id": "CloudWatchCfnInitLog",'
                                    - '      "FullName": "AWS.EC2.Windows.CloudWatch.CloudWatchLogsOutput,AWS.EC2.Windows.CloudWatch",'
                                    - '      "Parameters": {'
                                    - '        "AccessKey": "",'
                                    - '        "SecretKey": "",'
                                    - !Sub '        "Region": "${AWS::Region}",'
                                    - !Sub '        "LogGroup": "${ParentStackName}",'
                                    - '        "LogStream": "{instance_id}"'
                                    - '      }'
                                    - '    },'
                                    - '    {'
                                    - '      "Id" : "CloudWatch",'
                                    - '      "FullName" : "AWS.EC2.Windows.CloudWatch.CloudWatch.CloudWatchOutputComponent,AWS.EC2.Windows.CloudWatch",'
                                    - '      "Parameters" : {'
                                    - '        "AccessKey" : "",'
                                    - '        "SecretKey" : "",'
                                    - !Sub '        "Region": "${AWS::Region}",'
                                    - '        "NameSpace" : "Windows/Default"'
                                    - '      }'
                                    - '    }],'
                                    - '    "Flows": {'
                                    - '      "Flows": ['
                                    - '        "CfnInitLog,CloudWatchCfnInitLog"'
                                    - '      ]'
                                    - '    }'
                                    - '  }'
                                    - '}'
                                - ' { "IsEnabled" : false}'
                    commands:
                        a-installssmscript:
                            command: echo try{Start-Process ` -FilePath $env:USERPROFILE\Desktop\SSMAgent_latest.exe ` -ArgumentList "/S"}catch{Write-Host $_.exception} > C:/install-ssm.ps1
                            waitAfterCompletion: '0'
                        b-installssm:
                            command: powershell.exe -Command C:/install-ssm.ps1
                            waitAfterCompletion: '30'
                        c-enableSSM:
                            command: powershell.exe -Command "Set-Service -Name AmazonSSMAgent -StartupType
                                Automatic"
                            waitAfterCompletion: '30'
                        d-restartSSM:
                            command: powershell.exe -Command "Restart-Service AmazonSSMAgent -Force"
                            waitAfterCompletion: '30'
                FetchResources:
                    files:
                        C:\cfn\scripts\Verify-Signature.ps1:
                            source: {{{ ScriptVerifySignature }}}
                        C:\cfn\scripts\Unzip-Archive.ps1:
                            source: {{{ ScriptUnzipArchive }}}
                        C:\cfn\scripts\common.zip:
                            source: {{{ ScriptCommon }}}
                        C:\cfn\scripts\sqlfci.zip:
                            source: {{{ ScriptSQLFCI }}}
                        C:\cfn\scripts\sqlontap.zip:
                            source: {{{ ScriptSQLONTAP }}}
                        C:\cfn\scripts\dbcreate.zip:
                            source: {{{ ScriptDBCREATE}}}
                        C:\cfn\DSC.zip:
                            source: {{{ DSC }}}
                        C:\cfn\Installer\powershell.zip:
                            source: {{{ PowerShell }}}
                        C:\cfn\Installer\dotnet.zip:
                            source: {{{ Dotnet }}}                            
                        C:\cfn\modules\AWSLaunchWizardForCFN.zip:
                            source: {{{ AmazonLaunchWizardForCFN }}}
                        C:\cfn\modules\AWSLaunchWizardForSSM.zip:
                            source: {{{ AmazonLaunchWizardForSSM }}}
                        C:\cfn\modules\AmznFailoverCluster.zip:
                            source: {{{ AmazonFailoverCluster }}}
                        C:\cfn\Installer\sqlspcu.zip:
                            source: {{{ Sqlspcu }}}
                        C:\cfn\Installer\dependent-packages.zip:
                            source: {{{ DependentPackages }}}
                        C:\cfn\signig_files.zip:
                            source: {{{ ArtifactsSignatures }}}
                        C:\cfn\OpenSSL-Win64.zip:
                            source: {{{ OpenSSL }}}
                ScriptSignatureVerificationandExtract:
                    commands:
                        a-unpack-signatures:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\signig_files.zip -Destination C:\cfn
                            waitAfterCompletion: 0
                        b-unpack-openssl:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\OpenSSL-Win64.zip -Destination C:\cfn
                            waitAfterCompletion: 0
                        c-verify-common-signature:
                            command: !Join
                                - ''
                                - - powershell.exe -Command C:\cfn\scripts\Verify-Signature.ps1 -FilePath C:\cfn\scripts\common.zip -SignatureFilePath C:\cfn\signig_files\common.sig 
                                    -PubFilePath C:\cfn\signig_files\common.pub -ResourceID SqlFSxInstanceMAD1 -Stackname '"
                                  - !Ref 'AWS::StackName'
                                  - '''"'
                            waitAfterCompletion: 0
                        d-unpack-common-scripts:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\scripts\common.zip -Destination C:\cfn\scripts
                            waitAfterCompletion: 0
                        e-verify-DSC-signature:
                            command: !Join
                                - ''
                                - - powershell.exe -Command C:\cfn\scripts\Verify-Signature.ps1 -FilePath C:\cfn\DSC.zip -SignatureFilePath C:\cfn\signig_files\DSC.sig 
                                    -PubFilePath C:\cfn\signig_files\DSC.pub -ResourceID SqlFSxInstanceMAD1 -Stackname '"
                                  - !Ref 'AWS::StackName'
                                  - '''"'
                            waitAfterCompletion: 0
                        f-unpack-DSC-scripts:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\DSC.zip -Destination C:\cfn
                            waitAfterCompletion: 0
                        g-verify-sqlfci-signature:
                            command: !Join
                                - ''
                                - - powershell.exe -Command C:\cfn\scripts\Verify-Signature.ps1 -FilePath C:\cfn\scripts\sqlfci.zip -SignatureFilePath C:\cfn\signig_files\sqlfci.sig 
                                    -PubFilePath C:\cfn\signig_files\sqlfci.pub -ResourceID SqlFSxInstanceMAD1 -Stackname '"
                                  - !Ref 'AWS::StackName'
                                  - '''"'
                            waitAfterCompletion: 0
                        h-unpack-sqlfci-scripts:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\scripts\sqlfci.zip -Destination C:\cfn\scripts
                            waitAfterCompletion: 0
                        i-verify-sqlontap-signature:
                            command: !Join
                                - ''
                                - - powershell.exe -Command C:\cfn\scripts\Verify-Signature.ps1 -FilePath C:\cfn\scripts\sqlontap.zip -SignatureFilePath C:\cfn\signig_files\sqlontap.sig 
                                    -PubFilePath C:\cfn\signig_files\sqlontap.pub -ResourceID SqlFSxInstanceMAD1 -Stackname '"
                                  - !Ref 'AWS::StackName'
                                  - '''"'
                            waitAfterCompletion: 0
                        j-unpack-sqlontap-scripts:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\scripts\sqlontap.zip -Destination C:\cfn\scripts
                            waitAfterCompletion: 0
                        k-unpack-sqlspcu-scripts:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\Installer\sqlspcu.zip -Destination C:\cfn
                        l-unpack-dotnet-scripts:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\Installer\dotnet.zip -Destination C:\cfn\Installer                                
                        m-unpack-powershell-scripts:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\Installer\powershell.zip -Destination C:\cfn\Installer
                        n-verify-dbcreate-signature:
                            command: !Join
                                - ''
                                - - powershell.exe -Command C:\cfn\scripts\Verify-Signature.ps1 -FilePath C:\cfn\scripts\dbcreate.zip -SignatureFilePath C:\cfn\signig_files\dbcreate.sig 
                                    -PubFilePath C:\cfn\signig_files\dbcreate.pub -ResourceID SqlFSxInstanceMAD1 -Stackname '"
                                  - !Ref 'AWS::StackName'
                                  - '''"'
                            waitAfterCompletion: 0
                        o-unpack-dbcreate-scripts:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\scripts\dbcreate.zip -Destination C:\cfn\scripts
                        p-move-execurequeryfromssmscript:
                            command: powershell.exe -Command  Copy-Item  C:\cfn\scripts\common\ExecuteQueryFromSSM.ps1 -Destination (New-Item -Path C:\SSM\ -Type Directory )  -Recurse
                            waitAfterCompletion: 0
                        q-move-ontapscript:
                            command: powershell.exe -Command  Copy-Item  C:\cfn\scripts\sqlontap\OntapRestGet.ps1 -Destination C:\SSM\
                            waitAfterCompletion: 0
                        r-move-dbcreatescripts:
                            command: powershell.exe -Command  Copy-Item  C:\cfn\scripts\dbcreate\* -Destination C:\SSM\ -Recurse
                            waitAfterCompletion: 0
                        s-hide-ssm:
                            command: powershell.exe -Command C:\cfn\scripts\common\HideAllSSMScripts.ps1
                            waitAfterCompletion: 0 
                        t-verify-dependentpackages-signature:
                            command: !Join
                                - ''
                                - - powershell.exe -Command C:\cfn\scripts\Verify-Signature.ps1 -FilePath C:\cfn\Installer\dependent-packages.zip -SignatureFilePath C:\cfn\signig_files\dependent-packages.sig 
                                    -PubFilePath C:\cfn\signig_files\dependent-packages.pub -ResourceID SqlFSxInstanceMAD1 -Stackname '"
                                  - !Ref 'AWS::StackName'
                                  - '''"'
                            waitAfterCompletion: 0
                        u-unpack-dependentpackages:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\Installer\dependent-packages.zip -Destination C:\cfn\Installer
                InitialSetup:
                    commands:
                        a-unpack-launchwizard-module:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
                                C:\cfn\modules\AWSLaunchWizardForCFN.zip -Destination 'C:\Program
                                Files\WindowsPowerShell\Modules\'
                            waitAfterCompletion: 0
                        b-unpack-launchwizard-module:
                            command: powershell.exe -Command C:\cfn\scripts\Unzip-Archive.ps1 -Source
