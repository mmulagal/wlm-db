---
AWSTemplateFormatVersion: 2010-09-09

Description: 'A CloudFormation template to deploy an Amazon FSx for NetApp ONTAP file system. This template creates an FSx for ONTAP file system and a storage virtual machine (SVM) with the required volumes for SQL Server workloads.'

Metadata:
    AWS::CloudFormation::Interface:
        ParameterGroups:
            - Label:
                  default: Amazon FSx for NetApp ONTAP file system configuration.
              Parameters:
                  - DeploymentMode
                  - FSxFileSystemName
                  - FSxAdministratorPasswordSecret
                  - FSxDiskIops
                  - FSxStorageCapacity
                  - FSxVolumeThroughputCapacity
                  - FSxWeeklyMaintenanceStartTime
                  - FSxKmsKeyId
            - Label:
                  default: Storage virtual machine configuration for the FSx for ONTAP file system.
              Parameters:
                  - FSxSvmName
            - Label:
                  default: Volume configuration for the Amazon FSx for NetApp ONTAP file system.
              Parameters:
                  - FSxDataVolumeName
                  - FSxDataVolumeSize
                  - FSxLogVolumeName
                  - FSxLogVolumeSize
                  - FSxTempDbVolumeName
                  - FSxTempDbVolumeSize
                  - FSxClusterQuorumVolumeName
                  - FSxClusterQuorumVolumeSize
            - Label:
                  default: Network configuration for the FSx for ONTAP file system.
              Parameters:
                  - VPCID
                  - VPCCIDR
                  - PreferredSubnetId
                  - StandbySubnetId
                  - PreferredRouteTableId
                  - StandbyRouteTableId
        ParameterLabels:
            DeploymentMode:
                default: File system deployment mode
            FSxFileSystemName:
                default: File system name
            FSxAdministratorPasswordSecret:
                default: File system administrative password
            FSxDiskIops:
                default: Provisioned SSD IOPS
            FSxStorageCapacity:
                default: SSD storage capacity
            FSxVolumeThroughputCapacity:
                default: Throughput capacity
            FSxWeeklyMaintenanceStartTime:
                default: Start time for weekly maintenance window
            FSxKmsKeyId:
                default: Encryption key
            FSxSvmName:
                default: Storage virtual machine name
            FSxDataVolumeName:
                default: Data volume name
            FSxDataVolumeSize:
                default: Data volume size
            FSxLogVolumeName:
                default: Log volume name
            FSxLogVolumeSize:
                default: Log volume size
            FSxTempDbVolumeName:
                default: tempdb volume name
            FSxTempDbVolumeSize:
                default: tempdb volume size
            FSxClusterQuorumVolumeName:
                default: Cluster quorum volume name
            FSxClusterQuorumVolumeSize:
                default: Cluster quorum volume size
            VPCID:
                default: Virtual Private Cloud (VPC)
            VPCCIDR:
                default: The CIDR block of the VPC
            PreferredSubnetId:
                default: Preferred subnet
            StandbySubnetId:
                default: Standby subnet
            PreferredRouteTableId:
                default: Preferred VPC route table
            StandbyRouteTableId:
                default: Standby VPC route table

Parameters:
    DeploymentMode:
        Description: The deployment mode for the FSx for ONTAP file system.
        Type: String
        Default: MULTI_AZ_1
        AllowedValues: [SINGLE_AZ_1, MULTI_AZ_1]

    FSxFileSystemName:
        Description: Name for the FSx for ONTAP file system.
        Type: String
        Default: wlmdb-fsx

    FSxAdministratorPasswordSecret:
        Description: Secret string for the "fsxadmin" administrator account.
        Type: String

    FSxDiskIops:
        Description: The total number of SSD IOPS provisioned for the file system. The maximum is 80,000 IOPS.
        Default: 3
        Type: Number
        MinValue: 3
        MaxValue: 80000

    FSxStorageCapacity:
        Description: Storage capacity of the file system. The minimum is 1024 GiB. The maximum is 192 TiB.
        Type: Number
        MinValue: 1024
        MaxValue: 196608
        Default: 1024

    FSxVolumeThroughputCapacity:
        Description: The sustained speed, in MB/s, at which the file server hosting your file system can serve data. The file server can also burst to higher speeds for periods of time. Valid values are 128, 256, 512, 1024, and 2048 MB/s.
        Type: Number
        Default: 128
        AllowedValues: [128, 256, 512, 1024, 2048]

    FSxWeeklyMaintenanceStartTime:
        Description: A recurring weekly maintenance start time, in the format D:HH:MM. D is the day of the week, for which 1 represents Monday and 7 represents Sunday. HH is the zero-padded hour of the day (0-23), and MM is the zero-padded minute of the hour.
        Type: String
        Default: '1:05:00'

    FSxKmsKeyId:
        Description: ID of the AWS Key Management Service key that's used to encrypt the file system.
        Type: String

    FSxSvmName:
        Type: String
        Default: wlmdb-fsx-svm
        MinLength: 1
        MaxLength: 47

    FSxDataVolumeName:
        Description: The name of the volume for SQL Server data.
        Type: String
        Default: wlmdb_fsx_data_volume

    FSxDataVolumeSize:
        Description: The size of the data volume in megabytes (MiB).
        Type: Number
        Default: 200

    FSxLogVolumeName:
        Description: The name of the volume for the SQL Server log.
        Type: String
        Default: wlmdb_fsx_log_volume

    FSxLogVolumeSize:
        Description: The size of the log volume in megabytes (MiB).
        Type: Number
        Default: 100

    FSxTempDbVolumeName:
        Description: The name of the volume for the tempdb system database.
        Type: String
        Default: wlmdb_fsx_tempdb_volume

    FSxTempDbVolumeSize:
        Description: Size of the tempdb volume in megabytes (MiB).
        Type: Number
        Default: 200

    FSxClusterQuorumVolumeName:
        Description: The name of the volume for cluster quorum.
        Type: String
        Default: wlmdb_fsx_cluster_quorum_volume

    FSxClusterQuorumVolumeSize:
        Description: The size of the cluster quorum volume in megabytes (MiB).
        Type: Number
        Default: 2048

    VPCID:
        Description: Specify the VPC from which the file system is accessible.
        Type: String

    VPCCIDR:
        Description: CIDR Block for the VPC.
        Type: String
        Default: 10.0.0.0/16

    PreferredSubnetId:
        Description: Specify the preferred subnet for your file system.
        Type: AWS::EC2::Subnet::Id

    StandbySubnetId:
        Description: Specify the standby subnet for your file system.
        Type: String
        Default: subnet-123456

    PreferredRouteTableId:
        Description: Preferred VPC route tables to associate with your file system.
        Type: String

    StandbyRouteTableId:
        Description: Standby VPC route tables to associate with your file system.
        Type: String
        Default: rtb-123456

Conditions:
    FSxIsProvisionModeAutomatic: !Equals [!Ref FSxDiskIops, '3']
    FSxIsKmsKeyIdEmpty: !Equals [!Ref FSxKmsKeyId, '']
    FSxIsMultiZoneDeployment: !Equals [!Ref DeploymentMode, 'MULTI_AZ_1']

Resources:
    ONTAPSecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupDescription: Allow access to the Workload instances
            VpcId:
                Ref: VPCID
            SecurityGroupIngress:
                - IpProtocol: ICMP
                  FromPort: -1
                  ToPort: -1
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: tcp
                  FromPort: 139
                  ToPort: 139
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: tcp
                  FromPort: 443
                  ToPort: 443
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: udp
                  FromPort: 4045
                  ToPort: 4045
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: tcp
                  FromPort: 111
                  ToPort: 111
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: udp
                  FromPort: 2049
                  ToPort: 2049
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: tcp
                  FromPort: 10000
                  ToPort: 10000
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: tcp
                  FromPort: 635
                  ToPort: 635
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: tcp
                  FromPort: 4046
                  ToPort: 4046
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: tcp
                  FromPort: 2049
                  ToPort: 2049
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: tcp
                  FromPort: 3260
                  ToPort: 3260
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: udp
                  FromPort: 4046
                  ToPort: 4046
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: tcp
                  FromPort: 11104
                  ToPort: 11104
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: tcp
                  FromPort: 11105
                  ToPort: 11105
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: udp
                  FromPort: 4049
                  ToPort: 4049
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: udp
                  FromPort: 139
                  ToPort: 139
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: tcp
                  FromPort: 161
                  ToPort: 162
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: tcp
                  FromPort: 4045
                  ToPort: 4045
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: tcp
                  FromPort: 135
                  ToPort: 135
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: udp
                  FromPort: 135
                  ToPort: 135
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: tcp
                  FromPort: 749
                  ToPort: 749
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: udp
                  FromPort: 111
                  ToPort: 111
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: tcp
                  FromPort: 22
                  ToPort: 22
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: udp
                  FromPort: 161
                  ToPort: 162
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: udp
                  FromPort: 635
                  ToPort: 635
                  CidrIp: !Ref VPCCIDR
                - IpProtocol: udp
                  FromPort: 137
                  ToPort: 137
                  CidrIp: !Ref VPCCIDR

    FSxFileSystemConfiguration:
        Type: AWS::FSx::FileSystem
        Properties:
            FileSystemType: ONTAP
            KmsKeyId: !If [FSxIsKmsKeyIdEmpty, !Ref AWS::NoValue, !Ref FSxKmsKeyId]
            SecurityGroupIds:
                - Ref: ONTAPSecurityGroup
            StorageCapacity: !Ref FSxStorageCapacity
            StorageType: SSD # This is the only type supported for FSx/ONTAP.
            SubnetIds:
                !If [FSxIsMultiZoneDeployment, [!Ref PreferredSubnetId, !Ref StandbySubnetId], [!Ref PreferredSubnetId]]
            OntapConfiguration:
                AutomaticBackupRetentionDays: 0 # Disable automatic backups.
                WeeklyMaintenanceStartTime: !Ref FSxWeeklyMaintenanceStartTime
                DeploymentType: !Ref DeploymentMode
                DiskIopsConfiguration:
                    Iops: !If [FSxIsProvisionModeAutomatic, !Ref AWS::NoValue, !Ref FSxDiskIops]
                    Mode: !If [FSxIsProvisionModeAutomatic, AUTOMATIC, USER_PROVISIONED]
                FsxAdminPassword: !Sub '{{resolve:secretsmanager:${FSxAdministratorPasswordSecret}:SecretString:password}}'
                PreferredSubnetId: !Ref PreferredSubnetId
                RouteTableIds:
                    !If [
                        FSxIsMultiZoneDeployment,
                        [!Ref PreferredRouteTableId, !Ref StandbyRouteTableId],
                        !Ref AWS::NoValue
                    ]
                ThroughputCapacity: !Ref FSxVolumeThroughputCapacity
            Tags:
                - Key: Name
                  Value: !Ref FSxFileSystemName

    FSxSvmConfiguration:
        Type: AWS::FSx::StorageVirtualMachine
        Properties:
            #      ActiveDirectoryConfiguration: !Ref FSxADConfiguration
            Name: !Ref FSxSvmName
            FileSystemId: !Ref FSxFileSystemConfiguration
            RootVolumeSecurityStyle: NTFS

    FSxDataVolumeConfiguration:
        Type: AWS::FSx::Volume
        Properties:
            Name: !Ref FSxDataVolumeName
            VolumeType: ONTAP
            OntapConfiguration:
                SecurityStyle: NTFS
                SizeInMegabytes: !Ref FSxDataVolumeSize
                StorageVirtualMachineId: !Ref FSxSvmConfiguration
                JunctionPath: !Join ['', [/, !Ref FSxDataVolumeName]]
                OntapVolumeType: RW
                SnapshotPolicy: default
                StorageEfficiencyEnabled: true
                TieringPolicy:
                    Name: SNAPSHOT_ONLY
                    CoolingPeriod: 7

    FSxLogVolumeConfiguration:
        Type: AWS::FSx::Volume
        Properties:
            Name: !Ref FSxLogVolumeName
            VolumeType: ONTAP
            OntapConfiguration:
                SecurityStyle: NTFS
                SizeInMegabytes: !Ref FSxLogVolumeSize
                StorageVirtualMachineId: !Ref FSxSvmConfiguration
                JunctionPath: !Join ['', [/, !Ref FSxLogVolumeName]]
                OntapVolumeType: RW
                SnapshotPolicy: default
                StorageEfficiencyEnabled: true
                TieringPolicy:
                    Name: SNAPSHOT_ONLY
                    CoolingPeriod: 7

    FSxTempDbVolumeConfiguration:
        Type: AWS::FSx::Volume
        Properties:
            Name: !Ref FSxTempDbVolumeName
            VolumeType: ONTAP
            OntapConfiguration:
                SecurityStyle: NTFS
                SizeInMegabytes: !Ref FSxTempDbVolumeSize
                StorageVirtualMachineId: !Ref FSxSvmConfiguration
                JunctionPath: !Join ['', [/, !Ref FSxTempDbVolumeName]]
                OntapVolumeType: RW
                SnapshotPolicy: default
                StorageEfficiencyEnabled: true
                TieringPolicy:
                    Name: SNAPSHOT_ONLY
                    CoolingPeriod: 7

    FSxClusterQuorumVolumeConfiguration:
        Type: AWS::FSx::Volume
        Condition: FSxIsMultiZoneDeployment
        Properties:
            Name: !Ref FSxClusterQuorumVolumeName
            VolumeType: ONTAP
            OntapConfiguration:
                SecurityStyle: NTFS
                SizeInMegabytes: !Ref FSxClusterQuorumVolumeSize
                StorageVirtualMachineId: !Ref FSxSvmConfiguration
                JunctionPath: !Join ['', [/, !Ref FSxClusterQuorumVolumeName]]
                OntapVolumeType: RW
                SnapshotPolicy: default
                StorageEfficiencyEnabled: true
                TieringPolicy:
                    Name: SNAPSHOT_ONLY
                    CoolingPeriod: 7

Outputs:
    FSxFileSystemLogicalId:
        Description: Logical ID of the FSx for ONTAP file system
        Value: !Ref FSxFileSystemConfiguration
        Export:
            Name: !Sub ${AWS::StackName}-FSxFileSystemId
    FSxFileSystemResourceARN:
        Description: ARN of the FSx for ONTAP file system
        Value: !GetAtt FSxFileSystemConfiguration.ResourceARN
        Export:
            Name: !Sub ${AWS::StackName}-FSxFileSystemResourceARN
    FsxSecurityGroupID:
        Description: Security group for the FSx for ONTAP file system
        Value: !GetAtt ONTAPSecurityGroup.GroupId
        Export:
            Name: !Sub ${AWS::StackName}-FsxSecurityGroupID

    FSxSvmLogicalId:
        Description: Logical ID of the storage virtual machine
        Value: !Ref FSxSvmConfiguration
        Export:
            Name: !Sub ${AWS::StackName}-FSxSvmLogicalId
    FSxSvmArn:
        Description: ARN of the storage virtual machine
        Value: !GetAtt FSxSvmConfiguration.ResourceARN
        Export:
            Name: !Sub ${AWS::StackName}-FSxSvmArn
    FSxSvmId:
        Description: System generated ID of the storage virtual machine
        Value: !GetAtt FSxSvmConfiguration.StorageVirtualMachineId
        Export:
            Name: !Sub ${AWS::StackName}-FSxSvmId
    FSxSvmUuid:
        Description: System generated UUID of the storage virtual machine
        Value: !GetAtt FSxSvmConfiguration.UUID
        Export:
            Name: !Sub ${AWS::StackName}-FSxSvmUuid

    FSxDataVolumeLogicalId:
        Description: Logical ID of the FSx for ONTAP data volume
        Value: !Ref FSxDataVolumeConfiguration
        Export:
            Name: !Sub ${AWS::StackName}-FSxDataVolumeLogicalId
    FSxDataVolumeArn:
        Description: ARN of the FSx for ONTAP data volume
        Value: !GetAtt FSxDataVolumeConfiguration.ResourceARN
        Export:
            Name: !Sub ${AWS::StackName}-FSxDataVolumeArn
    FSxDataVolumeId:
        Description: System generated ID of volume
        Value: !GetAtt FSxDataVolumeConfiguration.VolumeId
        Export:
            Name: !Sub ${AWS::StackName}-FSxDataVolumeId
    FSxDataVolumeUuid:
        Description: System generated UUID of volume
        Value: !GetAtt FSxDataVolumeConfiguration.UUID
        Export:
            Name: !Sub ${AWS::StackName}-FSxDataVolumeUuid

    FSxLogVolumeLogicalId:
        Description: Logical ID of FSx for ONTAP log volume
        Value: !Ref FSxLogVolumeConfiguration
        Export:
            Name: !Sub ${AWS::StackName}-FSxLogVolumeLogicalId
    FSxLogVolumeArn:
        Description: ARN of FSx for ONTAP data volume
        Value: !GetAtt FSxLogVolumeConfiguration.ResourceARN
        Export:
            Name: !Sub ${AWS::StackName}-FSxLogVolumeArn
    FSxLogVolumeId:
        Description: System generated ID of volume
        Value: !GetAtt FSxLogVolumeConfiguration.VolumeId
        Export:
            Name: !Sub ${AWS::StackName}-FSxLogVolumeId
    FSxLogVolumeUuid:
        Description: System generated UUID of volume
        Value: !GetAtt FSxLogVolumeConfiguration.UUID
        Export:
            Name: !Sub ${AWS::StackName}-FSxLogVolumeUuid

    FSxTempDbVolumeLogicalId:
        Description: Logical ID of FSx for ONTAP tempdb volume
        Value: !Ref FSxTempDbVolumeConfiguration
        Export:
            Name: !Sub ${AWS::StackName}-FSxTempDbVolumeLogicalId
    FSxTempDbVolumeArn:
        Description: ARN of FSx for ONTAP data volume
        Value: !GetAtt FSxTempDbVolumeConfiguration.ResourceARN
        Export:
            Name: !Sub ${AWS::StackName}-FSxTempDbVolumeArn
    FSxTempDbVolumeId:
        Description: System generated ID of volume
        Value: !GetAtt FSxTempDbVolumeConfiguration.VolumeId
        Export:
            Name: !Sub ${AWS::StackName}--FSxTempDbVolumeId
    FSxTempDbVolumeUuid:
        Description: System generated UUID of volume
        Value: !GetAtt FSxTempDbVolumeConfiguration.UUID
        Export:
            Name: !Sub ${AWS::StackName}-FSxTempDbVolumeUuid

    FSxClusterQuorumVolumeLogicalId:
        Description: Logical ID for the FSx for ONTAP cluster quorum volume
        Value: !Ref FSxClusterQuorumVolumeConfiguration
        Export:
            Name: !Sub ${AWS::StackName}-FSxClusterQuorumVolumeLogicalId
        Condition: FSxIsMultiZoneDeployment
    FSxClusterQuorumVolumeArn:
        Description: ARN of FSx for ONTAP data volume
        Value: !GetAtt FSxClusterQuorumVolumeConfiguration.ResourceARN
        Export:
            Name: !Sub ${AWS::StackName}-FSxClusterQuorumVolumeArn
        Condition: FSxIsMultiZoneDeployment
    FSxClusterQuorumVolumeId:
        Description: System generated ID of volume
        Value: !GetAtt FSxClusterQuorumVolumeConfiguration.VolumeId
        Export:
            Name: !Sub ${AWS::StackName}--FSxClusterQuorumVolumeId
        Condition: FSxIsMultiZoneDeployment
    FSxClusterQuorumVolumeUuid:
        Description: System generated UUID of volume
        Value: !GetAtt FSxClusterQuorumVolumeConfiguration.UUID
        Export:
            Name: !Sub ${AWS::StackName}-FSxClusterQuorumVolumeUuid
        Condition: FSxIsMultiZoneDeployment
