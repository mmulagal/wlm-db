AWSTemplateFormatVersion: '2010-09-09'
Description: >
  This template deploys a SQL Server standalone instance using FSx for NetApp ONTAP in an existing VPC.
  This template creates EC2 instances and the required resources. You will be billed for AWS resources if you create a stack from this template.

Parameters:
  Ec2RoleName:
    Default: AmazonEC2RoleForLaunchWizard
    Description: EC2 instance role name.
    Type: String
  KeyPairName:
    Description: Name of an existing EC2 key pair. All instances will launch with this key pair.
    Type: AWS::EC2::KeyPair::KeyName
    Default: occm_qa
  PrivateSubnetID:
    Description: ID of private subnet in an Availability Zone 1 for the workload (For example, subnet-a0246dcd).
    Type: String
    Default: subnet-0ef4f90e95f375a84
  VPCID:
    Description: ID of your existing VPC for deployment.
    Type: String
    Default: vpc-84b3afe6
  VPCCIDR:
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$
    ConstraintDescription: CIDR block parameter must be in the form x.x.x.x/16-28
    Description: CIDR block for the VPC.
    Type: String
    Default: "172.31.0.0/16"
  WorkloadInstanceType:
    Default: m5.large
    Description: EC2 instance type for the workload instances.
    Type: String
  NumberOfNodes:
    Default: '1'
    Description: The number of SQL Server nodes to create.
    Type: String
  RouteTableId:
    Description: Comma separated list of all route table IDs for SQL Server subnets.
    Type: String
    Default: rtb-65aeb107
  SQLSvmName:
    Description: Name of the storage virtual machine (SVM) that will host the SQL Server workload.
    Type: String
    Default: wlmdb_postgres
  FSXDataVolumeName:
    Description: The name of the volume for SQL Server data.
    Type: String
    Default: vol_pgdata
  FSxLogVolumeName:
    Description: The name of the volume for the SQL Server log.
    Type: String
    Default: vol_pglog
  FSxDataLunSize:
    Description: The size of the LUN for SQL data, in GB.
    Type: String
    Default: 1024
  FSxFileSystemId:
    Description: ID for the FSx for ONTAP file system.
    Type: String
    Default: fs-0d5efc3057c4f12cb
  FSXUsername:
    Description: ID for the FSx for ONTAP file system.
    Type: String
    Default: fsxadmin
  FSXPassword:
    Description: ID for the FSx for ONTAP file system.
    Type: String
    Default: netapp1!
  FSXMgmtIp:
    Description: ID for the FSx for ONTAP file system.
    Type: String
    Default: "172.31.255.201"
  FSXNFSIP:
    Description: ID for the FSx for ONTAP file system.
    Type: String
    Default: "172.31.255.248"
  EBSVolumeSize:
    Description: Size of the EBS Volume in GiB.
    Type: String
    Default: "2048"
  AMIId:
    Description: The AMI ID for the EC2 instances.
    Type: String
    Default: ami-060e277c0d4cce553

Resources:
  LaunchWizardSqlFSxProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref Ec2RoleName
      Path: /

  SqlNode:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Count: '1'
        Timeout: PT90M
    Metadata:
      AWS::CloudFormation::Init:
        configSets:
          default:
            - setup_commands
        setup_commands:
          commands:
            a-signal-resource:
              command: !Sub
                - "cfn-signal.exe -e %ERRORLEVEL% --resource SqlNode --stack ${AWS::StackName} --region ${AWS::Region}\n"
                - {}
              waitAfterCompletion: 0
    Properties:
      IamInstanceProfile: !Ref LaunchWizardSqlFSxProfile
      InstanceType: !Ref WorkloadInstanceType
      ImageId: !Ref AMIId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref EBSVolumeSize
            VolumeType: gp3
      KeyName: !Ref KeyPairName
      UserData:
        'Fn::Base64':
          !Sub |
            #!/bin/bash
            echo "Setting up the environment..."
            fsxusername=${FSXUsername}
            fsxpassword=${FSXPassword}
            fsxMgmtIp=${FSXMgmtIp}
            fsxNFSIP=${FSXNFSIP}
            fsxdatamountpoint=/${FSXDataVolumeName}
            fsxlogmountpoint=/${FSxLogVolumeName}
            fsxdatavolumename=${FSXDataVolumeName}
            fsxlogvolumename=${FSxLogVolumeName}
            psql_data_default=/var/lib/pgsql/14/data
            archive_dir=/pglog/logs/archived_logs
            psql_svcs=postgresql
            dbname=testDB

            # Function to check status and exit on failure
            check_status() {
              if [ $? -ne 0 ]; then
                echo "$1"
                /opt/aws/bin/cfn-signal -e 1 --stack ${AWS::StackName} --resource SqlNode --region ${AWS::Region}
                exit 1
              fi
            }

            # Create FlexVols
            curl -k -u $fsxusername:$fsxpassword -H "Content-Type: application/json" -X POST -d '{ "name":"'$fsxdatavolumename'","size":"10G", "nas": { "path":"'$fsxdatamountpoint'" }, "svm": { "name": "fsx" }, "aggregates": [ { "name": "aggr1" } ] }' https://$fsxMgmtIp/api/storage/volumes
            check_status "Failed to create data volume"

            curl -k -u $fsxusername:$fsxpassword -H "Content-Type: application/json" -X POST -d '{ "name":"'$fsxlogvolumename'","size":"1G","nas": { "path":"'$fsxlogmountpoint'" }, "svm": { "name": "fsx" }, "aggregates": [ { "name": "aggr1" } ] }' https://$fsxMgmtIp/api/storage/volumes
            check_status "Failed to create log volume"

            # Install PostgreSQL and NFS utilities
            sudo apt update
            check_status "Failed to update package list"

            sudo apt install -y postgresql nfs-common
            check_status "Failed to install PostgreSQL or NFS utilities"

            # Create directories
            sudo mkdir -p /pgdata /pglog
            check_status "Failed to create directories"

            # Mount NFS volumes
            sudo mount -t nfs $fsxNFSIP:$fsxdatamountpoint /pgdata
            check_status "Failed to mount data volume"

            sudo mount -t nfs $fsxNFSIP:$fsxlogmountpoint /pglog
            check_status "Failed to mount log volume"

            # Create postgres user and group, set permissions
            sudo groupadd -f postgres
            sudo useradd -g postgres postgres || true
            sudo chmod 0700 /pgdata /pglog
            sudo chown -R postgres:postgres /pgdata /pglog
            check_status "Failed to set permissions"

            # Initialize the database cluster on the FSxN mounted volume
            sudo -u postgres /usr/lib/postgresql/14/bin/initdb -D /pgdata
            check_status "Failed to initialize PostgreSQL database cluster on FSxN volume"

            # Update PostgreSQL configuration to use the new data directory
            sudo sed -i "s|^#data_directory =.*|data_directory = '/pgdata'|" /etc/postgresql/14/main/postgresql.conf
            check_status "Failed to update PostgreSQL configuration"

            # Start the PostgreSQL service
            sudo systemctl start postgresql@14-main
            check_status "Failed to start PostgreSQL service"

            # Enable the PostgreSQL service to start on boot
            sudo systemctl enable postgresql@14-main
            check_status "Failed to enable PostgreSQL service"

            # Verify the installation
            sudo -u postgres psql -c "SELECT version();"
            check_status "Failed to verify PostgreSQL installation"

            # Switch to postgres user and move wal logs to log volume
            sudo chown -R postgres:postgres /pgdata/pg_wal
            sudo -u postgres mv /pgdata/pg_wal /pglog/pg_wal
            check_status "Failed to move WAL logs"

            # Create soft link to moved wal dir
            sudo -u postgres ln -s /pglog/pg_wal /pgdata/pg_wal
            check_status "Failed to create soft link for WAL logs"

            # Create postgresql archive log dir
            sudo -u postgres mkdir -p $archive_dir
            check_status "Failed to create PostgreSQL archive log directory"

            # Create a new database
            sudo -u postgres psql -c "CREATE DATABASE $dbname;"
            check_status "Failed to create database $dbname"

            # List all databases
            sudo -u postgres psql -c "\l"
            check_status "Failed to list databases"

            # Verify the data directory
            data_directory=$(sudo -u postgres psql -t -c "SHOW data_directory;" | xargs)
            if [ "$data_directory" = "/pgdata" ]; then
                echo "PostgreSQL data directory is correctly set to the FSxN mounted volume: $data_directory"
            else
                echo "Error: PostgreSQL data directory is not set to the FSxN mounted volume. Current data directory: $data_directory"
                exit 1
            fi

  WorkloadSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow access to the Workload instances
      VpcId: !Ref VPCID

Outputs:
  SqlNodeIp:
    Description: Private IP of Sql Instance
    Value: !GetAtt SqlNode.PrivateIp
  SqlNodeId:
    Description: Id of Sql Instance
    Value: !Ref SqlNode