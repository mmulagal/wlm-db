AWSTemplateFormatVersion: '2010-09-09'
Description: >
  This template deploys a SQL Server standalone instance using FSx for NetApp ONTAP in an existing VPC.
  This template creates EC2 instances and the required resources. You will be billed for AWS resources if you create a stack from this template.

Parameters:
  Ec2RoleName:
    Default: AmazonEC2RoleForLaunchWizard
    Description: EC2 instance role name.
    Type: String
  KeyPairName:
    Description: Name of an existing EC2 key pair. All instances will launch with this key pair.
    Type: AWS::EC2::KeyPair::KeyName
    Default: occm_qa
  PrivateSubnetID:
    Description: ID of private subnet in an Availability Zone 1 for the workload (For example, subnet-a0246dcd).
    Type: String
    Default: subnet-0ef4f90e95f375a84
  VPCID:
    Description: ID of your existing VPC for deployment.
    Type: String
    Default: vpc-84b3afe6
  VPCCIDR:
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$
    ConstraintDescription: CIDR block parameter must be in the form x.x.x.x/16-28
    Description: CIDR block for the VPC.
    Type: String
    Default: "172.31.0.0/16"
  WorkloadInstanceType:
    Default: m5.large
    Description: EC2 instance type for the workload instances.
    Type: String
  NumberOfNodes:
    Default: '1'
    Description: The number of SQL Server nodes to create.
    Type: String
  RouteTableId:
    Description: Comma separated list of all route table IDs for SQL Server subnets.
    Type: String
    Default: rtb-65aeb107
  SQLSvmName:
    Description: Name of the storage virtual machine (SVM) that will host the SQL Server workload.
    Type: String
    Default: wlmdb_postgres
  FSXDataVolumeName:
    Description: The name of the volume for SQL Server data.
    Type: String
    Default: vol_pgdata
  FSXLogVolumeName:
    Description: The name of the volume for the SQL Server log.
    Type: String
    Default: vol_pglog
  FSxDataLunSize:
    Description: The size of the LUN for SQL data, in GB.
    Type: String
    Default: 1024
  FSxFileSystemId:
    Description: ID for the FSx for ONTAP file system.
    Type: String
    Default: fs-0d5efc3057c4f12cb
  FSXUsername:
    Description: Username for the FSx for ONTAP file system.
    Type: String
    Default: fsxadmin
  FSXPassword:
    Description: Password for the FSx for ONTAP file system.
    Type: String
    NoEcho: true
    Default: netapp1!
  FSXMgmtIp:
    Description: Management IP for the FSx for ONTAP file system.
    Type: String
    Default: "172.31.255.201"
  FSXNFSIP:
    Description: NFS IP for the FSx for ONTAP file system.
    Type: String
    Default: "172.31.255.248"
  FSxAggrName:
    Description: Aggregate FSx for ONTAP file system.
    Type: String
    Default: "aggr1"
  EBSVolumeSize:
    Description: Size of the EBS Volume in GiB.
    Type: String
    Default: "2048"
  AMIId:
    Description: The AMI ID for the EC2 instances.
    Type: String
    Default: ami-0a6b545f62129c495

Resources:
  LaunchWizardSqlFSxProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref Ec2RoleName
      Path: /

  SqlNode:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Count: '1'
        Timeout: PT90M
    Metadata:
      AWS::CloudFormation::Init:
        configSets:
          default:
            - setup_commands
        setup_commands:
          commands:
            a-signal-resource:
              command: !Sub
                - "cfn-signal.exe -e %ERRORLEVEL% --resource SqlNode --stack ${AWS::StackName} --region ${AWS::Region}\n"
                - {}
              waitAfterCompletion: 0
    Properties:
      IamInstanceProfile: !Ref LaunchWizardSqlFSxProfile
      InstanceType: !Ref WorkloadInstanceType
      ImageId: !Ref AMIId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref EBSVolumeSize
            VolumeType: gp3
      KeyName: !Ref KeyPairName
      UserData:
        'Fn::Base64':
          !Sub |
            #!/bin/bash
            exec > /var/log/user-data.log 2>&1
            echo "Setting up the environment..."
            fsxusername=${FSXUsername}
            fsxpassword=${FSXPassword}
            fsxMgmtIp=${FSXMgmtIp}
            fsxNFSIP=${FSXNFSIP}
            fsxsvmname=${SQLSvmName}
            fsxaggrname=${FSxAggrName}
            fsxdatamountpoint=/${FSXDataVolumeName}
            fsxlogmountpoint=/${FSXLogVolumeName}
            fsxdatavolumename=${FSXDataVolumeName}
            fsxlogvolumename=${FSXLogVolumeName}
            psql_data_default=/var/lib/pgsql/14/data
            archive_dir=/pglog/logs/archived_logs
            psql_svcs=postgresql
            dbname=testDB

            # Function to check the status of the previous command and exit on failure
            check_status() {
              if [ $? -ne 0 ]; then
                echo "$1"
                exit 1;
              fi
            }

            # Increase shared memory limits
            echo "kernel.shmmax = 68719476736" | sudo tee /etc/sysctl.d/99-postgresql.conf
            echo "kernel.shmall = 4294967296" | sudo tee -a /etc/sysctl.d/99-postgresql.conf
            sudo sysctl --system
            
            check_status "Failed to increase shared memory limits"

            # Configure passwordless sudo for ec2-user
            echo "ec2-user ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/ec2-user
            check_status "Failed to configure passwordless sudo for ec2-user"

            # Create postgres user and group, set permissions
            if ! id "postgres" &>/dev/null; then
              sudo groupadd -f postgres
              sudo useradd -g postgres postgres
              check_status "Failed to create postgres user and group"
            fi

            # Check if data volume exists
            data_volume_exists=$(curl -s -k -u $fsxusername:$fsxpassword -H "Content-Type: application/json" -X GET https://$fsxMgmtIp/api/storage/volumes | grep -c '"name": "'$fsxdatavolumename'"')
            if [ $data_volume_exists -eq 0 ]; then
              echo "Creating data volume..."
              curl -k -u $fsxusername:$fsxpassword -H "Content-Type: application/json" -X POST -d '{ "name":"'$fsxdatavolumename'","size":"10G", "nas": { "path":"'$fsxdatamountpoint'" }, "svm": { "name": "'$fsxsvmname'" }, "aggregates": [ { "name": "'$fsxaggrname'" } ] }' https://$fsxMgmtIp/api/storage/volumes
              check_status "Failed to create data volume"
            else
              echo "Data volume already exists."
            fi

            # Check if log volume exists
            log_volume_exists=$(curl -s -k -u $fsxusername:$fsxpassword -H "Content-Type: application/json" -X GET https://$fsxMgmtIp/api/storage/volumes | grep -c '"name": "'$fsxlogvolumename'"')
            if [ $log_volume_exists -eq 0 ]; then
              echo "Creating log volume..."
              curl -k -u $fsxusername:$fsxpassword -H "Content-Type: application/json" -X POST -d '{ "name":"'$fsxlogvolumename'","size":"1G","nas": { "path":"'$fsxlogmountpoint'" }, "svm": { "name": "'$fsxsvmname'" }, "aggregates": [ { "name": "'$fsxaggrname'" } ] }' https://$fsxMgmtIp/api/storage/volumes
              check_status "Failed to create log volume"
            else
              echo "Log volume already exists."
            fi

            # Add the PostgreSQL 15 repository
            sudo yum install -y https://download.postgresql.org/pub/repos/yum/reporpms/EL-7-x86_64/pgdg-redhat-repo-latest.noarch.rpm --skip-broken
            check_status "Failed to add PostgreSQL repository"

            # Install PostgreSQL and NFS utilities
            sudo yum install -y postgresql15 postgresql15-server nfs-utils
            check_status "Failed to install PostgreSQL or NFS utilities"

            # Add PostgreSQL binaries to PATH
            export PATH=$PATH:/usr/bin

            # Create directories
            sudo mkdir -p /pgdata /pglog
            check_status "Failed to create directories"

            # Mount NFS volumes
            sudo mount -t nfs $fsxNFSIP:$fsxdatamountpoint /pgdata
            check_status "Failed to mount data volume"

            sudo mount -t nfs $fsxNFSIP:$fsxlogmountpoint /pglog
            check_status "Failed to mount log volume"

            # Set permissions for directories
            sudo chmod 0700 /pgdata /pglog
            sudo chown -R postgres:postgres /pgdata /pglog
            check_status "Failed to set permissions"

            # Remove existing contents of /pgdata directory
            sudo rm -rf /pgdata/*

            # Initialize the database cluster on the FSxN mounted volume
            sudo -u postgres /usr/bin/initdb -D /pgdata
            check_status "Failed to initialize PostgreSQL database cluster on FSxN volume"

            # Update PostgreSQL configuration to use the new data and log directories
            sudo sed -i "s|^#data_directory =.*|data_directory = '/pgdata'|" /pgdata/postgresql.conf
            sudo sed -i "s|^#log_directory =.*|log_directory = '/pglog'|" /pgdata/postgresql.conf
            check_status "Failed to update PostgreSQL configuration"

            # Initialize database
            sudo /usr/bin/postgresql-setup --initdb
            check_status "Failed to initialize PostgreSQL service"

            # Enable the PostgreSQL service to start on boot
            sudo systemctl enable postgresql
            check_status "Failed to enable PostgreSQL service"

            # Start the PostgreSQL service
            sudo systemctl start postgresql
            check_status "Failed to start PostgreSQL service"

            # Verify the installation
            sudo -u postgres /usr/bin/psql -c "SELECT version();"
            check_status "Failed to verify PostgreSQL installation"

            

            # Switch to postgres user and move wal logs to log volume
            sudo chown -R postgres:postgres /pgdata/pg_wal
            # Ensure the target directory is empty
            sudo rm -rf /pglog/pg_wal
            sudo -u postgres mv /pgdata/pg_wal /pglog/pg_wal
            check_status "Failed to move WAL logs"

            # Create soft link to moved wal dir
            sudo -u postgres ln -s /pglog/pg_wal /pgdata/pg_wal
            check_status "Failed to create soft link for WAL logs"

            # Create postgresql archive log dir
            sudo -u postgres mkdir -p $archive_dir
            check_status "Failed to create PostgreSQL archive log directory"

            # Create a new database
            sudo -i -u postgres /usr/bin/psql -c "CREATE DATABASE $dbname;"
            check_status "Failed to create database $dbname"

            # List all databases
            sudo -u postgres /usr/bin/psql -c "\l"
            check_status "Failed to list databases"

            # Verify the data directory
            data_directory=$(sudo -u postgres /usr/bin/psql -t -c "SHOW data_directory;" | xargs)
            if [ "$data_directory" = "/pgdata" ]; then
                echo "PostgreSQL data directory is correctly set to the FSxN mounted volume: $data_directory"
            else
                echo "Error: PostgreSQL data directory is not set to the FSxN mounted volume. Current data directory: $data_directory"
                exit 1
            fi

            # Install dependencies for pgvector
            sudo yum install -y git gcc make libpq-devel
            check_status "Failed to install dependencies for pgvector"

            # Clone the pgvector repository
            git clone https://github.com/pgvector/pgvector.git
            check_status "Failed to clone pgvector repository"

            # Install PostgreSQL development packages
            sudo yum install -y postgresql15-private-devel --allowerasing
            check_status "Failed to install postgresql15-private-devel"

            sudo yum install -y postgresql15-server-devel
            check_status "Failed to install postgresql15-server-devel"

            # Build and install pgvector
            cd pgvector
            make
            sudo make install
            check_status "Failed to build and install pgvector"

            # Enable pgvector extension in PostgreSQL
            sudo sysctl -p
            sudo systemctl restart postgresql
            sudo -u postgres /usr/bin/psql -c "CREATE EXTENSION vector;"
            check_status "Failed to create pgvector extension"

            echo "pgvector installation complete."

  WorkloadSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow access to the Workload instances
      VpcId: !Ref VPCID

Outputs:
  SqlNodeIp:
    Description: Private IP of Sql Instance
    Value: !GetAtt SqlNode.PrivateIp
  SqlNodeId:
    Description: Id of Sql Instance
    Value: !Ref SqlNode