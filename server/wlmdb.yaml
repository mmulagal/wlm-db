openapi: 3.0.3
info:
  title: Workload Manager for DB API
  version: 1.0.1
components:
  securitySchemes:
    http:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas: {}
paths:
  /wlmdb/about:
    get:
      summary: Get system information
      tags:
        - System
      description: Get information about the system
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  nodeVersion:
                    type: string
                  mode:
                    type: string
                  build:
                    type: string
                required:
                  - version
                  - nodeVersion
  /accounts/{accountId}/wlmdb/v1/credentials/{credentialsId}/regions/{region}/vpcs:
    get:
      summary: List VPCs
      tags: &a1
        - AWS
      description: List VPCs in the given AWS region
      parameters:
        - schema:
            type: string
          in: query
          name: fields
          required: false
        - schema:
            type: string
          in: path
          name: accountId
          required: true
        - schema:
            type: string
          in: path
          name: credentialsId
          required: true
        - schema:
            type: string
          in: path
          name: region
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  vpcs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        state:
                          type: string
                        cidrBlock: {}
                        tags: {}
                        isDefault:
                          type: boolean
                        name:
                          type: string
                        subnets:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              state:
                                type: string
                              vpcId:
                                type: string
                              cidrBlock:
                                type: string
                              availabilityZone:
                                type: string
                              availableIps:
                                type: number
                              tags:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    Key:
                                      type: string
                                    Value:
                                      type: string
                              name:
                                type: string
                              routeTableId:
                                type: string
                        securityGroups:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              description:
                                type: string
                              vpcId:
                                type: string
                              ipPermissions: {}
                              name:
                                type: string
                              securityGroupName:
                                type: string
                required:
                  - vpcs
  /accounts/{accountId}/wlmdb/v1/credentials/{credentialsId}/regions/{region}/amis:
    get:
      summary: List AMIs
      tags: *a1
      description: List AMIs in the given AWS region for the provided parameters
      parameters:
        - schema:
            type: string
            enum:
              - windows
          in: query
          name: osType
          required: true
        - schema:
            type: string
          in: query
          name: osVersion
          required: false
        - schema:
            type: string
            enum:
              - sql
          in: query
          name: databaseType
          required: true
        - schema:
            type: string
          in: query
          name: databaseEdition
          required: false
        - schema:
            type: string
          in: query
          name: databaseVersion
          required: false
        - schema:
            type: string
          in: path
          name: accountId
          required: true
        - schema:
            type: string
          in: path
          name: credentialsId
          required: true
        - schema:
            type: string
          in: path
          name: region
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  amis:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        architecture:
                          type: string
                        imageId:
                          type: string
                        imageLocation:
                          type: string
                        public:
                          type: boolean
                        platform:
                          type: string
                        platformDetails:
                          type: string
                        state:
                          type: string
                        hypervisor:
                          type: string
                required:
                  - amis
  /accounts/{accountId}/wlmdb/v1/credentials/{credentialsId}/regions/{region}/sns-topics:
    get:
      summary: Get SNS Topics
      tags: *a1
      description: Get SNS Topics in the given AWS region
      parameters:
        - schema:
            type: string
          in: path
          name: accountId
          required: true
        - schema:
            type: string
          in: path
          name: credentialsId
          required: true
        - schema:
            type: string
          in: path
          name: region
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  topics:
                    type: array
                    items:
                      type: object
                      properties:
                        topicName:
                          type: string
                        topicArn:
                          type: string
                required:
                  - topics
  /accounts/{accountId}/wlmdb/v1/credentials/{credentialsId}/regions/{region}/ads:
    get:
      summary: List AWS managed Active Directories
      tags: *a1
      description: List AWS managed Active Directories in the given AWS region
      parameters:
        - schema:
            type: string
          in: path
          name: accountId
          required: true
        - schema:
            type: string
          in: path
          name: credentialsId
          required: true
        - schema:
            type: string
          in: path
          name: region
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  directories:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        dnsIpAddress:
                          type: array
                          items:
                            type: string
                        launchTime:
                          type: number
                        domainName:
                          type: string
                        shortName:
                          type: string
                        ssoEnabled:
                          type: boolean
                        status:
                          type: string
                        type:
                          type: string
                        vpcSettings:
                          type: object
                          properties:
                            vpcId:
                              type: string
                            subnetIds:
                              type: array
                              items:
                                type: string
                            availabilityZones:
                              type: array
                              items:
                                type: string
                            securityGroupId:
                              type: string
                required:
                  - directories
  /accounts/{accountId}/wlmdb/v1/credentials/{credentialsId}/regions/{region}/instance-types:
    get:
      summary: List EC2 instance types
      tags: *a1
      description: Get EC2 instance types in the region supported for MS SQL deployment
      parameters:
        - schema:
            type: string
          in: path
          name: accountId
          required: true
        - schema:
            type: string
          in: path
          name: credentialsId
          required: true
        - schema:
            type: string
          in: path
          name: region
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  instanceTypes:
                    type: array
                    items:
                      type: object
                      properties:
                        instanceType:
                          type: string
                        vCpus:
                          type: number
                        ramInMib:
                          type: number
                        iopsInMbps:
                          type: number
                        architecture:
                          type: array
                          items:
                            type: string
                required:
                  - instanceTypes
  /accounts/{accountId}/wlmdb/v1/credentials/{credentialsId}/fsx/regions:
    get:
      summary: List AWS regions that supports FSx
      tags:
        - AWS
      parameters:
        - schema:
            type: string
          in: path
          name: accountId
          required: true
        - schema:
            type: string
          in: path
          name: credentialsId
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  regions:
                    type: array
                    items:
                      type: object
                      properties:
                        regionCode:
                          type: string
                        regionName:
                          type: string
                      required:
                        - regionCode
                        - regionName
                required:
                  - regions
  /accounts/{accountId}/wlmdb/v1/credentials/{credentialsId}/fsx/regions/{region}/vpcs/{vpcId}/file-systems:
    get:
      summary: List FSx for NetApp ONTAP filesystems
      tags:
        - AWS
      description: List Amazon FSx for NetApp ONTAP filesystems
      parameters:
        - schema:
            type: string
          in: path
          name: accountId
          required: true
        - schema:
            type: string
          in: path
          name: credentialsId
          required: true
        - schema:
            type: string
          in: path
          name: region
          required: true
        - schema:
            type: string
          in: path
          name: vpcId
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  filesystems:
                    type: array
                    items:
                      type: object
                      properties:
                        fileSystemId:
                          type: string
                        name:
                          type: string
                        kmsKeyId:
                          type: string
                        lifecycle:
                          enum:
                            - AVAILABLE
                            - CREATING
                            - DELETING
                            - FAILED
                            - MISCONFIGURED
                            - MISCONFIGURED_UNAVAILABLE
                            - UPDATING
                          type: string
                        networkInterfaceIds:
                          type: array
                          items:
                            type: string
                        subnetIds:
                          type: array
                          items:
                            type: string
                        vpcId:
                          type: string
                        securityGroups:
                          type: array
                          items:
                            type: string
                        ontapConfiguration:
                          type: object
                          properties:
                            deploymentType:
                              type: string
                            endpointIpAddressRange:
                              type: string
                            fsxAdminPassword:
                              type: string
                            preferredSubnetId:
                              type: string
                            routeTableIds:
                              type: array
                              items:
                                type: string
                            throughputCapacity:
                              type: number
                            diskIopsConfiguration:
                              type: object
                              properties:
                                iops:
                                  type: number
                                mode:
                                  type: string
                            endpoints:
                              type: object
                              properties:
                                intercluster:
                                  type: object
                                  properties:
                                    dnsName:
                                      type: string
                                    ipAddresses:
                                      type: array
                                      items:
                                        type: string
                                management:
                                  type: object
                                  properties:
                                    dnsName:
                                      type: string
                                    ipAddresses:
                                      type: array
                                      items:
                                        type: string
                        volumes:
                          type: array
                          items:
                            type: object
                            properties:
                              volumeId:
                                type: string
                              volumeType:
                                type: string
                              securityStyle:
                                type: string
                              sizeInMegabytes:
                                type: number
                              storageEfficiencyEnabled:
                                type: boolean
                              storageVirtualMachineId:
                                type: string
                              ontapVolumeType:
                                type: string
                        storageVirtualMachines:
                          type: array
                          items:
                            type: object
                            properties:
                              storageVirtualMachineId:
                                type: string
                              storageVirtualMachineName:
                                type: string
                              resourceARN:
                                type: string
                              lifeCycle:
                                type: string
                              subtype:
                                type: string
                              creationTime: {}
                              uuid:
                                type: string
                      required:
                        - fileSystemId
                        - lifecycle
                required:
                  - filesystems
  /accounts/{accountId}/wlmdb/v1/credentials/{credentialsId}/regions/{region}/kms-keys:
    get:
      summary: List KMS keys
      tags: *a1
      description: List KMS Keys in the given AWS region
      parameters:
        - schema:
            type: string
          in: path
          name: accountId
          required: true
        - schema:
            type: string
          in: path
          name: credentialsId
          required: true
        - schema:
            type: string
          in: path
          name: region
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        origin:
                          type: string
                        state:
                          type: string
                        expirationDate:
                          type: string
                        isDefault:
                          type: boolean
                        formattedDate:
                          type: string
                required:
                  - keys
  /accounts/{accountId}/wlmdb/v1/credentials/{credentialsId}/regions/{region}/key-pairs:
    get:
      summary: List Key Pairs
      tags: *a1
      description: List Key Pairs in the given AWS region
      parameters:
        - schema:
            type: string
          in: path
          name: accountId
          required: true
        - schema:
            type: string
          in: path
          name: credentialsId
          required: true
        - schema:
            type: string
          in: path
          name: region
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  keyPairs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                required:
                  - keyPairs
  /accounts/{accountId}/wlmdb/v1/credentials/{credentialsType}:
    get:
      summary: List credentials
      tags:
        - Generic
      description: List added credentials
      parameters:
        - schema:
            minLength: 1
            type: string
          in: path
          name: accountId
          required: true
        - schema:
            enum:
              - aws_assume_role
            type: string
          in: path
          name: credentialsType
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    credentialsId:
                      type: string
                    name:
                      type: string
                    arn:
                      type: string
                    providerAccountId:
                      type: string
                  required:
                    - credentialsId
                    - name
                    - arn
                    - providerAccountId
  /accounts/{accountId}/wlmdb/v1/cloudformation/template:
    post:
      summary: Create CloudFormation template
      tags:
        - Deployment
      description: Create CloudFormation template in URL, YAML and CLI format for user
        deployment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                networkConfiguration:
                  type: object
                  properties:
                    vpcId:
                      type: string
                    vpcCidr:
                      type: string
                    privateSubnet1Id:
                      type: string
                    routeTable1Id:
                      type: string
                    availabilityZone1:
                      type: string
                    privateSubnet2Id:
                      type: string
                    routeTable2Id:
                      type: string
                    availabilityZone2:
                      type: string
                  required:
                    - vpcId
                    - vpcCidr
                    - privateSubnet1Id
                    - routeTable1Id
                    - availabilityZone1
                ec2Configuration:
                  type: object
                  properties:
                    workloadInstanceType:
                      type: string
                    keyPairName:
                      type: string
                  required:
                    - workloadInstanceType
                    - keyPairName
                adConfiguration:
                  type: object
                  properties:
                    adScenarioType:
                      enum:
                        - AWS_MANAGED_AD
                        - USER_MANAGED_AD
                      type: string
                    domainUsername:
                      type: string
                    domainPassword:
                      type: string
                    domainDnsname:
                      type: string
                    dnsIpaddress:
                      type: string
                    securityGroupId:
                      type: string
                  required:
                    - adScenarioType
                    - domainUsername
                    - domainPassword
                    - domainDnsname
                    - dnsIpaddress
                fsxConfiguration:
                  type: object
                  properties:
                    fsxDeploymentMode:
                      enum:
                        - SINGLE_AZ_1
                        - MULTI_AZ_1
                      type: string
                    fsxFileSystemId:
                      type: string
                    fsxUsername:
                      type: string
                    fsxPassword:
                      type: string
                    databaseSize:
                      type: number
                    ontapSgGroupId:
                      type: array
                      items:
                        type: string
                    fsxVolThroughput:
                      enum:
                        - 128
                        - 256
                        - 512
                        - 1024
                        - 2048
                        - 4096
                      type: number
                    fsxIOPS:
                      type: number
                    encryptionKey:
                      type: string
                  required:
                    - fsxDeploymentMode
                    - fsxUsername
                    - fsxPassword
                    - databaseSize
                    - ontapSgGroupId
                    - fsxVolThroughput
                    - fsxIOPS
                sqlConfiguration:
                  type: object
                  properties:
                    sqlDeploymentMode:
                      enum:
                        - standalone
                        - fci
                      type: string
                    sqlAmiId:
                      type: string
                    serviceAccountName:
                      type: string
                    serviceAccountPassword:
                      type: string
                    sqlServerName:
                      type: string
                  required:
                    - sqlDeploymentMode
                    - sqlAmiId
                    - serviceAccountName
                    - serviceAccountPassword
                    - sqlServerName
                topicArn:
                  type: string
                enableCloudWatch:
                  default: false
                  type: boolean
                tags:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                      value:
                        type: string
                    required:
                      - key
                      - value
                credentialsId:
                  type: string
                region:
                  type: string
              required:
                - networkConfiguration
                - ec2Configuration
                - adConfiguration
                - fsxConfiguration
                - sqlConfiguration
        required: true
      parameters:
        - schema:
            minLength: 1
            type: string
          in: path
          name: accountId
          required: true
        - schema:
            enum:
              - wizard-advanced
              - wizard-quick
              - chatbot
              - rest-api
            default: rest-api
            type: string
          in: header
          name: triggered-from
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  template:
                    type: string
                  cliCommand:
                    type: string
                required:
                  - url
                  - template
                  - cliCommand
  /accounts/{accountId}/wlmdb/v1/credentials/{credentialsId}/regions/{region}/cloudformation/deploy:
    post:
      summary: Deploy CloudFormation template
      tags: &a2
        - Deployment
      description: Deploy CloudFormation template to provision SQL FCI
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                networkConfiguration:
                  type: object
                  properties:
                    vpcId:
                      type: string
                    vpcCidr:
                      type: string
                    privateSubnet1Id:
                      type: string
                    routeTable1Id:
                      type: string
                    availabilityZone1:
                      type: string
                    privateSubnet2Id:
                      type: string
                    routeTable2Id:
                      type: string
                    availabilityZone2:
                      type: string
                  required:
                    - vpcId
                    - vpcCidr
                    - privateSubnet1Id
                    - routeTable1Id
                    - availabilityZone1
                ec2Configuration:
                  type: object
                  properties:
                    workloadInstanceType:
                      type: string
                    keyPairName:
                      type: string
                  required:
                    - workloadInstanceType
                    - keyPairName
                adConfiguration:
                  type: object
                  properties:
                    adScenarioType:
                      enum:
                        - AWS_MANAGED_AD
                        - USER_MANAGED_AD
                      type: string
                    domainUsername:
                      type: string
                    domainPassword:
                      type: string
                    domainDnsname:
                      type: string
                    dnsIpaddress:
                      type: string
                    securityGroupId:
                      type: string
                  required:
                    - adScenarioType
                    - domainUsername
                    - domainPassword
                    - domainDnsname
                    - dnsIpaddress
                fsxConfiguration:
                  type: object
                  properties:
                    fsxDeploymentMode:
                      enum:
                        - SINGLE_AZ_1
                        - MULTI_AZ_1
                      type: string
                    fsxFileSystemId:
                      type: string
                    fsxUsername:
                      type: string
                    fsxPassword:
                      type: string
                    databaseSize:
                      type: number
                    ontapSgGroupId:
                      type: array
                      items:
                        type: string
                    fsxVolThroughput:
                      enum:
                        - 128
                        - 256
                        - 512
                        - 1024
                        - 2048
                        - 4096
                      type: number
                    fsxIOPS:
                      type: number
                    encryptionKey:
                      type: string
                  required:
                    - fsxDeploymentMode
                    - fsxUsername
                    - fsxPassword
                    - databaseSize
                    - ontapSgGroupId
                    - fsxVolThroughput
                    - fsxIOPS
                sqlConfiguration:
                  type: object
                  properties:
                    sqlDeploymentMode:
                      enum:
                        - standalone
                        - fci
                      type: string
                    sqlAmiId:
                      type: string
                    serviceAccountName:
                      type: string
                    serviceAccountPassword:
                      type: string
                    sqlServerName:
                      type: string
                  required:
                    - sqlDeploymentMode
                    - sqlAmiId
                    - serviceAccountName
                    - serviceAccountPassword
                    - sqlServerName
                topicArn:
                  type: string
                enableCloudWatch:
                  default: false
                  type: boolean
                tags:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                      value:
                        type: string
                    required:
                      - key
                      - value
              required:
                - networkConfiguration
                - ec2Configuration
                - adConfiguration
                - fsxConfiguration
                - sqlConfiguration
        required: true
      parameters:
        - schema:
            type: string
          in: path
          name: accountId
          required: true
        - schema:
            type: string
          in: path
          name: credentialsId
          required: true
        - schema:
            type: string
          in: path
          name: region
          required: true
        - schema:
            enum:
              - wizard-advanced
              - wizard-quick
              - chatbot
              - rest-api
            default: rest-api
            type: string
          in: header
          name: triggered-from
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  cloudFormationUrl:
                    type: string
                  cloudFormationStackId:
                    type: string
                  missingPermissions:
                    type: string
  /accounts/{accountId}/wlmdb/v1/credentials/{credentialsId}/regions/{region}/cloudformation/stacks/status:
    get:
      summary: List CloudFormation deployments
      tags: *a2
      description: List CloudFormation deployment details
      parameters:
        - schema:
            type: string
          in: path
          name: accountId
          required: true
        - schema:
            type: string
          in: path
          name: credentialsId
          required: true
        - schema:
            type: string
          in: path
          name: region
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    deploymentId:
                      type: string
                    deploymentName:
                      type: string
                    deploymentStatus:
                      type: string
                    deploymentFailureReason:
                      type: string
                  required:
                    - deploymentId
                    - deploymentName
                    - deploymentStatus
  /accounts/{accountId}/wlmdb/v1/credentials/{credentialsId}/regions/{region}/cloudformation/stacks/{stackName}/status:
    get:
      summary: Get CloudFormation deployment details
      tags: *a2
      description: Get CloudFormation deployment details for a given deployment Id
      parameters:
        - schema:
            minLength: 1
            type: string
          in: path
          name: accountId
          required: true
        - schema:
            minLength: 1
            type: string
          in: path
          name: credentialsId
          required: true
        - schema:
            minLength: 1
            type: string
          in: path
          name: region
          required: true
        - schema:
            minLength: 1
            type: string
          in: path
          name: stackName
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  deploymentId:
                    type: string
                  deploymentName:
                    type: string
                  deploymentStatus:
                    type: string
                  deploymentFailureReason:
                    type: string
                required:
                  - deploymentId
                  - deploymentName
                  - deploymentStatus
  /accounts/{accountId}/wlmdb/v1/deployments:
    get:
      summary: Get deployment jobs summary
      tags:
        - Deployment
