  /accounts/{accountId}/wlmdb/v1/credentials/{credentialsId}/pricing:
    post:
      summary: MSSQL Server deployment cost estimation
      tags:
        - Pricing
      description: Estimates monthly cost of deployable resources in USD for MSSQL server
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                compute:
                  type: object
                  properties:
                    regionCode:
                      minLength: 1
                      type: string
                    instanceType:
                      minLength: 1
                      type: string
                    sqlSoftwareType:
                      enum:
                        - SQL std
                        - SQL ent
                        - SQL web
                      type: string
                    sqlDeploymentMode:
                      enum:
                        - fci
                        - standalone
                      type: string
                  required:
                    - regionCode
                    - instanceType
                    - sqlSoftwareType
                    - sqlDeploymentMode
                storage:
                  type: object
                  properties:
                    regionCode:
                      minLength: 1
                      type: string
                    diskSize:
                      description: Database "data" volume size in GiB
                      type: number
                    throughput:
                      description: Throughput is in MBps
                      type: number
                    iops:
                      type: number
                    deploymentOption:
                      enum:
                        - SINGLE_AZ_1
                        - MULTI_AZ_1
                      type: string
                    storageCapacity:
                      description: The total FSxN storage capacity in GB. "storageCapacity" and
                        "diskSize" are mutually exclusive
                      type: number
                  required:
                    - regionCode
                    - diskSize
                vpc:
                  type: object
                  properties:
                    regionCode:
                      minLength: 1
                      type: string
                  required:
                    - regionCode
              required:
                - compute
        required: true
      parameters:
        - schema:
            type: string
          in: path
          name: accountId
          required: true
        - schema:
            type: string
          in: path
          name: credentialsId
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  compute:
                    type: number
                  storage:
                    type: object
                    properties:
                      capacity:
                        type: number
                      throughput:
                        type: number
                      size:
                        description: All the sizes are in GiB
                        type: object
                        properties:
                          data:
                            type: number
                          log:
                            type: number
                          tempdb:
                            type: number
                          quorum:
                            type: number
                          total:
                            type: number
                        required:
                          - data
                          - log
                          - tempdb
                          - total
                    required:
                      - capacity
                      - throughput
                  vpc:
                    type: number
                  total:
                    type: number
                required:
                  - compute
                  - total
