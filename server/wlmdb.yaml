                    type: string
                  name:
                    type: string
                  status:
                    enum:
                      - Up
                      - Down
                      - N/A
                    type: string
                  databaseCount:
                    type: number
                  databaseServer:
                    type: object
                    properties:
                      operatingSystem:
                        minLength: 1
                        type: string
                      serverEdition:
                        minLength: 1
                        type: string
                      serverVersion:
                        minLength: 1
                        type: string
                      clusterName:
                        minLength: 1
                        type: string
                      activeNode:
                        type: string
                      nodeNames:
                        type: array
                        items:
                          type: string
                      activeConnections:
                        type: number
                      creationDate:
                        minLength: 1
                        type: string
                    required:
                      - operatingSystem
                      - serverEdition
                      - serverVersion
                      - activeNode
                      - nodeNames
                      - activeConnections
                      - creationDate
                  topology:
                    type: object
                    properties:
                      awsAccount:
                        minLength: 1
                        type: string
                      region:
                        type: string
                      serverType:
                        enum:
                          - Microsoft SQL Server
                        type: string
                      serverInstallationMode:
                        enum:
                          - Standalone
                          - FCI
                        type: string
                      fileSystemType:
                        enum:
                          - EBS
                          - FSx for ONTAP
                          - FSx for Windows
                        type: string
                      fileSystemId:
                        type: string
                      fileSystemName:
                        type: string
                      fileSystemDeploymentMode:
                        type: string
                      fileSystemStatus:
                        type: string
                      fileSystemStorageCapacity:
                        type: number
                      fileSystemThroughputCapacity:
                        type: number
                      vpcId:
                        type: string
                      keyPairName:
                        type: string
                      ec2Details:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            ebsVolumeId:
                              type: string
                            instanceType:
                              type: string
                            availabilityZone:
                              type: string
                            subnetId:
                              type: string
                          required:
                            - id
                            - name
                            - ebsVolumeId
                      activeDirectoryDetails:
                        type: object
                        properties:
                          name:
                            minLength: 1
                            type: string
                          address:
                            minLength: 1
                            type: string
                        required:
                          - name
                          - address
                    required:
                      - awsAccount
                      - region
                      - serverType
                      - serverInstallationMode
                      - fileSystemType
                      - fileSystemId
                      - ec2Details
                  protection:
                    type: object
                    properties:
                      isAwsBackUpEnabled:
                        default: false
                        type: boolean
                      isFsxOntapSnapshotsEnabled:
                        default: false
                        type: boolean
                      isSqlNativeEnabled:
                        default: false
                        type: boolean
                      protectedDatabases:
                        description: Number of protected databases
                        type: number
                    required:
                      - isAwsBackUpEnabled
                      - isFsxOntapSnapshotsEnabled
                      - isSqlNativeEnabled
                  performance:
                    type: object
                    properties:
                      latency:
                        description: Database server I/O latency in milliseconds
                        type: number
                      assessment:
                        enum:
                          - High
                          - Medium
                          - Low
                        type: string
                      rwMetrics:
                        type: object
                        properties:
                          latency:
                            type: object
                            properties:
                              read:
                                description: Database server read performance for latency, IOPS or throughput
                                type: number
                              write:
                                description: Database server write performance for latency, IOPS or throughput
                                type: number
                            required:
                              - read
                              - write
                          iops:
                            type: object
                            properties:
                              read:
                                description: Database server read performance for latency, IOPS or throughput
                                type: number
                              write:
                                description: Database server write performance for latency, IOPS or throughput
                                type: number
                            required:
                              - read
                              - write
                          throughput:
                            type: object
                            properties:
                              read:
                                description: Database server read performance for latency, IOPS or throughput
                                type: number
                              write:
                                description: Database server write performance for latency, IOPS or throughput
                                type: number
                            required:
                              - read
                              - write
                        required:
                          - latency
                          - iops
                          - throughput
                  storage:
                    type: object
                    properties:
                      size:
                        description: Provisioned size, in bytes
                        type: number
                      used:
                        description: The virtual space used before storage efficiency, in bytes.
                        type: number
                      spaceSavings:
                        description: Total disk space saved in the volume due to storage efficiency, in
                          bytes.
                        type: number
                    required:
                      - size
                      - used
                      - spaceSavings
                  estimatedUsageCost:
                    type: object
                    properties:
                      compute:
                        description: Compute cost in dollars
                        type: number
                      storage:
                        description: Storage  cost in dollars
                        type: number
                      connectivity:
                        description: Connectivity cost in dollars
                        type: number
                      others:
                        description: Other services like active directory, cloudwatch logging, etc costs
                          in dollars
                        type: number
                      estimationType:
                        enum:
                          - billing
                          - pricing
                        type: string
                    required:
                      - compute
                      - storage
                      - connectivity
                      - others
                      - estimationType
                  resourceUtilization:
                    type: object
                    properties:
                      cpu:
                        type: object
                        properties:
                          percentUsed:
                            minLength: 1
                            type: string
                          used:
                            minLength: 1
                            type: string
                          total:
                            minLength: 1
                            type: string
                          remaining:
                            minLength: 1
                            type: string
                        required:
                          - percentUsed
                          - used
                          - total
                          - remaining
                      memory:
                        type: object
                        properties:
                          percentUsed:
                            minLength: 1
                            type: string
                          used:
                            minLength: 1
                            type: string
                          total:
                            minLength: 1
                            type: string
                          remaining:
                            minLength: 1
                            type: string
                        required:
                          - percentUsed
                          - used
                          - total
                          - remaining
                      disk:
                        type: object
                        properties:
                          percentUsed:
                            minLength: 1
                            type: string
                          used:
                            minLength: 1
                            type: string
                          total:
                            minLength: 1
                            type: string
                          remaining:
                            minLength: 1
                            type: string
                        required:
                          - percentUsed
                          - used
                          - total
                          - remaining
                    required:
                      - cpu
                      - memory
                      - disk
                required:
                  - id
                  - name
                  - status
                  - databaseCount
  /accounts/{accountId}/wlmdb/v1/database-hosts/{databaseHostId}/databases:
