#############################################################

# Deployment configs
namespace: 'wlmdb'

# image (both init and app)
image:
    registry: '718273455463.dkr.ecr.us-east-1.amazonaws.com/wlmdb'

imagePullPolicy: IfNotPresent

# app resources
resources:
    limits:
        cpu: '2000m'
        memory: '6Gi'
    requests:
        cpu: '250m'
        memory: '2Gi'

resourcesaudit:
    limits:
        cpu: '150m'
        memory: '150Mi'
    requests:
        cpu: '100m'
        memory: '100Mi'

infraversion: development-19a5759-2797
UseExternalIP: true

# monitoring
monitoring: true
promrelease: prometheus-operator
#############################################################

# App properties

## env vars to be mounted to pod