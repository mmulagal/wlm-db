apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: wlmdb
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"    
  name: wlmdb
spec:
  {{ if .Values.global.demoEnv }}
  replicas: 1
  {{ else }}
  replicas: 2
  {{ end }}
  selector:
    matchLabels:
      run: wlmdb
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        run: wlmdb
        vectorfilter: disabled
      annotations:  
{{ toYaml .Values.global.annotations | indent 10 }}          
    spec:
      serviceAccountName: wlmdb-secretmanager-sa
      containers:
      - image: {{ .Values.image.registry }}:{{ .Values.infraversion }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        name: wlmdb
        envFrom:
        - configMapRef:
            name: wlmdb-config
        env:
        readinessProbe:
          httpGet:
            path: wlmdb/health
            port: 8085
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: wlmdb/health
            port: 8085
            scheme: HTTP
          initialDelaySeconds: 80
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
{{ toYaml .Values.resources | indent 12 }}
      # dnsPolicy: ClusterFirst
      # restartPolicy: Always
      # securityContext: {}
      # terminationGracePeriodSeconds: 30
