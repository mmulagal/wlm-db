{{ if not .Values.global.demoEnv .Values.global.istioEnabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: wlmdb-vs
  namespace: wlmdb-demo
spec:
  hosts:
    - {{ .Values.global.bluexpDomain }}
  gateways:
    - istio-ingress/istio-api
  http:
    - match:
        - headers:
            x-simulator:
              exact: "true"
          uri: 
            regex: '\/wlmdb.*'
        - headers:
            x-simulator:
              exact: "true"
          uri: 
            regex: '\/accounts\/.*\/wlmdb\/v.*'
      route:
        - destination:
            host: wlmdb.wlmdb-demo.svc.cluster.local
            port:
              number: 8085
{{ end }}